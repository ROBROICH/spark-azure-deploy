stages:
  - typescript-bundle
  - oci-image
  - attestation

include:
  - local: ".gitlab/ci/templates/devguard-oci-service.yml"
    inputs:
      job_suffix: ":spark-backend"
      image_suffix: "spark-backend"
      artifact_name: "pkg:oci/spark-backend"
      context: "$CI_PROJECT_DIR/02-backend/apps/spark-backend/dist"
      dockerfile: "$CI_PROJECT_DIR/02-backend/apps/Dockerfile"
      intoto_materials: |
        02-backend/apps/spark-backend/dist
      base_image_dev: "oven/bun:1.4.4-slim@sha256:1846adf22496bd711036aae8be147e57bdebbaea2e5264e3e0b5af1db187d9a4"
      base_image: "gcr.io/distroless/cc-debian13:nonroot@sha256:08476c244888bfb425bae1ae4dd7c17f093e972aab8426883d97f3c6f280f7c1"
      build_needs:
        - job: "typescript-build"
          artifacts: true

typescript-build:
  stage: typescript-bundle
  image:
    name: node:22.23.4
    pull_policy: if-not-present
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  before_script:
    - corepack enable
    - corepack prepare --activate
    - pnpm install --frozen-lockfile
  script:
    - NODE_ENV=production pnpm exec -- vp run --filter '@spark-workflow/spark-backend' --fail-if-no-match --no-cache build
  artifacts:
    expire_in: 1 day
    paths:
      - 02-backend/apps/spark-backend/dist/
