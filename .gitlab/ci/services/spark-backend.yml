stages:
  - typescript-bundle
  - oci-image
  - attestation

include:
  - local: ".gitlab/ci/templates/devguard-oci-service.yml"
    inputs:
      job_suffix: ":spark-backend"
      image_suffix: "spark-backend"
      artifact_name: "pkg:oci/spark-backend"
      context: "$CI_PROJECT_DIR/02-backend/apps/spark-backend/dist"
      dockerfile: "$CI_PROJECT_DIR/02-backend/apps/Dockerfile"
      base_image_dev: "oven/bun:1.4.2-slim@sha256:cb3bbbb08e13a4a2ff400f24c7a2a1d5efa83f6ef8544d52d95a519631e2fc61"
      base_image: "gcr.io/distroless/cc-debian13:nonroot@sha256:e792ab3d241a468a4fd7519ddbbebe66b49b5f365771716ea688ad40b6c6f1c2"
      build_needs:
        - job: "typescript-build"
          artifacts: true

typescript-build:
  stage: typescript-bundle
  image: node:22.23.2
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  before_script:
    - corepack enable
    - corepack prepare --activate
    - pnpm install --frozen-lockfile
  script:
    - NODE_ENV=production pnpm exec -- vp run --filter '@spark-workflow/spark-backend' --fail-if-no-match --no-cache build
  artifacts:
    expire_in: 1 day
    paths:
      - 02-backend/apps/spark-backend/dist/
