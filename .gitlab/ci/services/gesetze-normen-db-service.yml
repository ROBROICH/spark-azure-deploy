stages:
  - oci-image
  - attestation

include:
  - local: ".gitlab/ci/templates/devguard-oci-service.yml"
    inputs:
      job_suffix: ":gesetze-normen-db-service"
      image_suffix: "gesetze-normen-db-service"
      artifact_name: "pkg:oci/gesetze-normen-db-service"
      context: "$CI_PROJECT_DIR/."
      dockerfile: "$CI_PROJECT_DIR/04-shared-services/db-services/gesetze-normen-db-service/Dockerfile"
      base_image_dev: "python:3.13-slim"
      base_image: "registry.opencode.de/oci-community/images/zendis/python3:3.13-minimal"
