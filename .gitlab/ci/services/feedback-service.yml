stages:
  - oci-image
  - attestation

include:
  - local: ".gitlab/ci/templates/devguard-oci-service.yml"
    inputs:
      job_suffix: ":feedback-service"
      image_suffix: "feedback-service"
      artifact_name: "pkg:oci/feedback-service"
      context: "$CI_PROJECT_DIR/."
      dockerfile: "$CI_PROJECT_DIR/02-backend/feedback_service/Dockerfile"
      base_image_dev: "python:3.13-slim"
      base_image: "registry.opencode.de/oci-community/images/zendis/python3:3.13-minimal"
