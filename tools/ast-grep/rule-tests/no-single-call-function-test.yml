id: no-single-call-function

invalid:
  - |
    export const typedScope = (database: Database): Scope => scoped<ScopedDatabase>(database);

  - |
    export const genericScope = <Database>(database: Database) => scoped(database);

  - |
    export const runListenerCliFromArgv = async () => {
      await runListenerCli();
    };

  - |
    function forwardClick(value: string) {
      sendClick(value);
    }

  - |
    const stopRunner = async (runnerId: string) => {
      await stopRunnerById(runnerId);
    };

  - |
    const startWorkWithUnusedContext = async (context: WorkContext): Promise<void> => {
      await startWork();
    };

  - |
    const startWorkWithUnusedSyncContext = (context: WorkContext): void => {
      startWork();
    };

  - |
    const stop = async function (runnerId: string) {
      await stopRunnerById(runnerId);
    };

  - |
    function startCli() {
      return runCli();
    }

  - |
    async function loadCli(): Promise<Cli> {
      return await createCli();
    }

  - |
    const start = () => {
      runtime.start();
    };

  - |
    const startNow = () => runtime.start();

  - |
    const stopRuntime = async (runtime: Runtime) => {
      await runtime.stop();
    };

  - |
    const stopTask = async (task: Task) => await task.stop();

  - |
    const clickHandler = () => sendClick();

  - |
    const forwardBareClick = value => {
      sendClick(value);
    };

  - |
    class ListenerService {
      async stop(runnerId: string) {
        await stopRunnerById(runnerId);
      }
    }

  # A default-exported forwarding arrow has no declarator to hang off. Only
  # no-tiny-top-level-functions caught this shape; it moved here when that rule
  # was retired.
  - |
    export default () => compute();

  - |
    export default async (runnerId: string) => await stopRunnerById(runnerId);

  # An object literal whose methods only return another call is the "service
  # object" smell. Previously only no-single-return-function caught this shape;
  # it moved here when that rule was retired.
  - |
    const service = {
      getThing(id: string) {
        return backend.getThing(id);
      }
    };

  - |
    const store = {
      list() {
        return backend.list();
      }
    };

  - |
    const remote = {
      async fetchThing(id: string) {
        return await backend.fetchThing(id);
      }
    };

  - |
    const forwarder = {
      stop(task: Task) {
        return task.stop();
      }
    };

  - |
    function forwardClickWithLeadingComment(value: string) {
      // Forward the click unchanged.
      sendClick(value);
    }

  - |
    const stopRunnerWithTrailingComment = async (runnerId: string) => {
      // Forward the runner identifier unchanged.
      await stopRunnerById(runnerId);
      // Keep runner shutdown centralized.
    };

  - |
    const startWithEmptyStatements = () => {
      ;
      runtime.start();
      ;
    };

  - |
    const commentedService = {
      getThing(id: string) {
        // Forward the lookup unchanged.
        ;
        return backend.getThing(id);
        ;
        // Preserve the service boundary.
      }
    };

  - |
    class TaskController {
      halt(task: Task) {
        return task.stop();
      }
    }

  - |
    class AsyncTaskController {
      async halt(task: Task) {
        return await task.stop();
      }
    }

  - |
    const taskController = {
      halt(task: Task) {
        return task.stop();
      },
    };

  - |
    const asyncTaskController = {
      async halt(task: Task) {
        return await task.stop();
      },
    };

valid:
  - |
    export const resultOf = <Schema extends TSchema>(schema: Schema) =>
      Type.Unsafe<Static<Schema> | Result<Static<Schema>, EvlogError>>(schema);

  - |
    const listener = {
      start() {
        runListenerCli();
      },
    };

  - |
    async function runListenerCli() {
      const program = createListenerCommand();
      await program.parseAsync(Bun.argv, { from: "node" });
    }

  - |
    export const command = program.action(async () => {
      await runListenerCli();
    });

  - |
    export const sendMail = async (message: SmtpMessage) => {
      await transport.sendMail({
        from: env.SMTP_FROM,
        to: message.to,
        subject: message.subject,
        text: message.text,
        html: message.html,
      });
    };

  - |
    const stopAfterReport = async (runtime: Runtime, task: Task) => {
      const stopped = await runtime.stop(task);
      await reportStop(stopped);
    };

  - |
    class DerivedListener extends BaseListener {
      constructor() {
        super();
      }
    }

  - |
    class Mailer {
      async send(message: SmtpMessage) {
        await transport.sendMail({
          from: env.SMTP_FROM,
          to: message.to,
          subject: message.subject,
          text: message.text,
          html: message.html,
        });
      }
    }

  - |
    class SecretStore {
      async remove(taskId: string) {
        await kubernetesApi().deleteNamespacedSecret({ name: taskId }).catch((error) => {
          if (error.code === 404) {
            return;
          }
          throw error;
        });
      }
    }

  - |
    const secretStore = {
      async remove(taskId: string) {
        await kubernetesApi().deleteNamespacedSecret({ name: taskId }).catch((error) => {
          if (error.code === 404) {
            return;
          }
          throw error;
        });
      },
    };

  - |
    const restoreInstallations = (db: Database, backup: InstallationBackup[]) => {
      return db.transaction(async (transaction) => {
        await transaction.delete(githubAppInstallations);
        if (backup.length > 0) {
          await transaction.insert(githubAppInstallations).values(backup);
        }
      });
    };

  - |
    const stopNormalizedRunner = (runnerId: string) => {
      stopRunnerById(normalizeRunnerId(runnerId));
    };

  - |
    const stopLoggedRunner = async (runnerId: string) => {
      logger.info({ runnerId });
      await stopRunnerById(runnerId);
    };

  - |
    const stopThenReport = async (runtime: Runtime) => {
      await runtime.stop();
      reportStop();
    };

  - |
    const startThenMark = () => {
      runtime.start();
      started = true;
    };

  - |
    const markThenStart = () => {
      started = false;
      runtime.start();
    };

