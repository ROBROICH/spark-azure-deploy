description:
  de:
    genericName: Agentische KI-Assistenzlösung
    shortDescription: SPARK Workflow unterstützt und beschleunigt als agentische KI-Assistenzlösung die vollständige Bearbeitung von Genehmigungsverfahren.
    longDescription: |-
      ## Projektzielsetzung und Kernfunktionalitäten

      SPARK Workflow ist eine agentische KI-Lösung, die komplexe verwaltungsrechtliche Planungs- und Genehmigungsverfahren als operative Assistenz unterstützt. Die Lösung wurde konzeptionell für Planfeststellungsverfahren entwickelt, ist allerdings grundsätzlich verfahrens- und rechtsgebietsagnostisch angelegt. Damit ist eine möglichst breite Nachnutzbarkeit in den Verfahren von Bund, Ländern und Kommunen sichergestellt.

      Planungs- und Genehmigungsverfahren gelten als ein zentraler Flaschenhals für den Erhalt und Ausbau von Infrastruktur in Deutschland. Die zugrunde liegenden Verwaltungsverfahren sind häufig komplex, ressourcenintensiv und dauern viele Monate oder sogar Jahre. SPARK unterstützt die Mitarbeitenden in den Behörden durch einen Workflow, der sich an ihrer gewohnten juristischen Arbeitsweise ausrichtet, sowie durch agentische KI, die ihnen initiale Prüf- und Bewertungsvorschläge unterbreitet. Die  Nutzenden treffen dabei stets die Entscheidungen im Prüfprozess. KI-Vorschläge können übernommen, ergänzt oder gänzlich verworfen werden.

      SPARK Workflow besteht aus mehreren Modulen und Services, die alle wichtigen Verfahrensschritte abbilden. Dazu gehören insbesondere die Inhaltsextraktion des Sachverhalts aus Antragsunterlagen, die formale und materielle Vollständigkeitsprüfung einschließlich der Plausibilitätsprüfung, die Behörden- und Öffentlichkeitsbeteiligung, die rechtliche Prüfung und Bewertung sowie die Beschlusserstellung. Ergänzt wird die KI-Lösung durch eine digitale Rechtsdogmatik mit Gesetzesdatenbanken, automatisierter Normendekonstruktion und juristischen Bewertungsmechanismen.

      Die KI-Lösung SPARK Workflow ist im Rahmen einer Innovationspartnerschaft des Bundesministeriums für Digitales und Staatsmodernisierung entstanden.

      ## Projektstand und Open-Source-Veröffentlichung

      SPARK Workflow wird in drei aufeinanderfolgenden Releases als Open Source veröffentlicht. Die Lösung ist derzeit im Beta-Status.

      Die erste Veröffentlichung umfasst die Module Inhaltsextraktion und formale Vollständigkeitsprüfung einschließlich der Plausibilitätsprüfung sowie unterstützende Backend-Dienste. Weitere Funktionen werden in den nachfolgenden Open-Source-Veröffentlichungen ergänzt.

      Eine detaillierte Übersicht über Inhalte und Zeitpunkte der drei Releases befindet sich in der Datei [`roadmap.md`](https://gitlab.opencode.de/bmds/planungs-und-genehmigungsbeschleunigung/agentische-ki-assistenzloesung/-/blob/main/roadmap.md?ref_type=heads).
