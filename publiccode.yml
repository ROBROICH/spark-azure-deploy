  de:
    genericName: SPARK Workflow
    shortDescription: KI-Assistenzlösung für komplexe Planungs- und Genehmigungsverfahren in der öffentlichen Verwaltung
    longDescription: |-
      ## Projektzielsetzung und Kernfunktionalitäten
      Im Projekt SPARK („Schnellere Planung und Realisierung durch KI“) hat das Bundesministerium für Digitales und Staatsmodernisierung die KI-Lösung SPARK Workflow in einer Innovationspartnerschaft entwickeln lassen. SPARK Workflow unterstützt komplexe verwaltungsrechtliche Planungs- und Genehmigungsverfahren als operative Assistenz. Die Entwicklung wurde aus dem Klima- und Transformationsfonds des Bundesministeriums für Wirtschaft und Energie finanziert. Die KI trägt dazu bei, Verwaltungsverfahren zu beschleunigen und Beschäftigte in der öffentlichen Verwaltung bei zeitaufwändigen Tätigkeiten wirksam zu entlasten. 
      
      Planungs- und Genehmigungsverfahren gelten als ein zentraler Flaschenhals für den Erhalt und Ausbau von Infrastruktur in Deutschland. Die zugrunde liegenden Verwaltungsverfahren sind komplex sowie ressourcen- und zeitintensiv. Die KI-Lösung unterstützt die Mitarbeitenden in den Behörden durch einen Workflow, der sich an ihrer juristischen Arbeitsweise orientiert, sowie durch KI-Module, die Prüf- und Bewertungsvorschläge unterbreiten. 
      
      Die veröffentlichten KI-Module orientieren sich an den typischen Verfahrensschritten eines Planungs- und Genehmigungsverfahrens, von der Extraktion relevanter Informationen aus den Antragsunterlagen über die formale und materielle Vollständigkeitsprüfung bis zur rechtlichen Prüfung und Beschlusserstellung. Zudem bettet sich SPARK Workflow in bestehende digitale Prozesse, bspw. Online-Antragsportale, über Schnittstellen ein. Damit ist diese Verfahrenskette erstmalig Ende-zu-Ende abgedeckt. 
      
      SPARK Workflow extrahiert und bereitet Informationen auf und macht Vorschläge, die über konkrete Verweise nachvollziehbar belegt sind. Alle KI-Ergebnisse werden übersichtlich in einer gemeinsam mit den Nutzenden konzipierten Benutzeroberfläche dargestellt. Die fachliche Entscheidung trifft weiterhin der Mensch.
      
      ## Projektstand und Open-Source-Veröffentlichung
      
      SPARK Workflow wurde in zwei Releases als Open Source veröffentlicht. Die Lösung wird mit einer ersten Bundesbehörde getestet und wird kontinuierlich weiter verbessert.
      
      Eine detaillierte Übersicht über die Funktionen finden sich in der [`Featureliste`](https://gitlab.opencode.de/bmds/planungs-und-genehmigungsbeschleunigung/spark-workflow/-/blob/main/docs/feature-list-ger.md).
