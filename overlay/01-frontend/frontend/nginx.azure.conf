# Azure demo: nginx serves the SPA (built with base "/") AND acts as the /api gateway,
# proxying to internal Container Apps by name. Routing mirrors vite.config.ts apiProxyServices:
# most prefixes are stripped to the service root; /temporal keeps its prefix.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    set $security_csp "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https:; media-src 'self' blob:; frame-src 'self' https: blob:; worker-src 'self' blob:; form-action 'self'";
    add_header Content-Security-Policy $security_csp always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 200m;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    # Gateway-injected auth: attach the demo test-user's Keycloak bearer token to every
    # /api call. The entrypoint substitutes __GATEWAY_AUTH_TOKEN__ from $GATEWAY_AUTH_TOKEN
    # (or removes this line when unset). Backends run optional_verify_dry_run.
    proxy_set_header Authorization "Bearer __GATEWAY_AUTH_TOKEN__";

    # --- API gateway: /api/<prefix> -> internal service (prefix stripped) ---
    location /api/pls/v1/ { proxy_pass http://project-logic/; }
    location /api/dms/v1/ { proxy_pass http://document-management/; }
    location /api/fcs/v1/ { proxy_pass http://formal-completeness/; }
    location /api/agent-orchestration/v1/ { proxy_pass http://agent-orchestration/; }
    location /api/plausibility-notes/v1/ { proxy_pass http://plausibility-notes/; }
    location /api/oms/v1/ { proxy_pass http://objections-management/; }
    location /api/supplementary-requests/v1/ { proxy_pass http://supplementary-requests/; }
    location /api/comment/v1/ { proxy_pass http://comment/; }
    location /api/examination/v1/ { proxy_pass http://examination/; }
    location /api/feedback/v1/ { proxy_pass http://feedback/; }
    location /api/protocol/v1/ { proxy_pass http://protocol/; }
    location /api/vae/v1/ { proxy_pass http://project-logic/; }
    # Demo user directory: identity /users needs a Keycloak service account that the demo
    # realm doesn't configure; serve the single test user so name-resolution/pickers work.
    location = /api/identity/users {
        default_type application/json;
        return 200 '{"users":[{"userId":"9f6d0a95-19ad-49f7-8995-74793532376b","email":"erika.mustermann@example.org","firstName":"Erika","lastName":"Mustermann","role":"admin"}]}';
    }
    location /api/identity/ { proxy_pass http://identity-management/; }
    # temporal keeps its prefix (stripPrefix: false in vite.config.ts)
    location /api/temporal/ { proxy_pass http://temporal-job/temporal/; }

    # --- SPA (built with base "/app"; asset files live at web root) ---
    location = / { return 302 /app/; }
    location /app/ {
        rewrite ^/app/(.*)$ /$1 break;
        try_files $uri /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
