# Local infrastructure for native development.
# Runtime Python services are started with process-compose.yaml.
services:
  postgresql:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./scripts/data/gesetze-normen-seed.sql.gz:/seed/gesetze-normen-seed.sql.gz:ro
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    configs:
      - source: postgresql_init_sql
        target: /docker-entrypoint-initdb.d/init.sql
      - source: postgresql_seed_gesetze_normen
        target: /docker-entrypoint-initdb.d/seed-gesetze-normen.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 30

  backend-postgresql:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "5433:5432"
    volumes:
      - backend_postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: application
    configs:
      - source: backend_postgresql_init_sql
        target: /docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d application"]
      interval: 3s
      timeout: 5s
      retries: 30

  unoserver:
    build:
      context: ./04-shared-services/basiskomponenten/unoserver
    restart: unless-stopped
    environment:
      CONVERSION_TIMEOUT: "120"
    ports:
      - "127.0.0.1:2003:2003"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --max-time 2 -H 'Content-Type: text/xml'
          --data '<methodCall><methodName>info</methodName><params></params></methodCall>'
          http://localhost:2003/ -o /dev/null
      interval: 3s
      timeout: 3s
      retries: 30

  temporal-postgresql:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5434:5432"
    volumes:
      - temporal_postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 30

  spicedb-postgresql:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5435:5432"
    volumes:
      - spicedb_postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: spicedb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spicedb"]
      interval: 3s
      timeout: 5s
      retries: 30

  spicedb-migrate:
    image: authzed/spicedb:v1.49.0
    command: >
      datastore migrate head
      --datastore-engine=postgres
      --datastore-conn-uri=postgres://postgres:${DB_PASSWORD}@spicedb-postgresql:5432/spicedb?sslmode=disable
    restart: "no"
    depends_on:
      spicedb-postgresql:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:1.29.0
    restart: unless-stopped
    ports:
      - "7233:7233"
    volumes:
      - ./docker/temporal/development-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml
    environment:
      SQL_MAX_CONNS: 3
      SQL_MAX_IDLE_CONNS: 3
      SQL_VIS_MAX_CONNS: 2
      SQL_VIS_MAX_IDLE_CONNS: 2
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: ${DB_PASSWORD}
      POSTGRES_SEEDS: temporal-postgresql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_ADDRESS: 0.0.0.0:7233
      TEMPORAL_CLI_ADDRESS: 0.0.0.0:7233
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "h"]
      interval: 2s
      timeout: 5s
      retries: 60

  temporal-init:
    image: temporalio/admin-tools:1.29
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        until temporal operator cluster health --address temporal:7233 | grep -q SERVING; do
          echo "Waiting for Temporal server to start..."
          sleep 1
        done

        until temporal operator search-attribute list --address temporal:7233 --namespace default >/dev/null 2>&1; do
          echo "Waiting for namespace cache to refresh..."
          sleep 1
        done

        temporal operator search-attribute create --address temporal:7233 --namespace default --name ProjectId --type Keyword || true
        temporal operator search-attribute create --address temporal:7233 --namespace default --name ProjectVersion --type Int || true
        echo "Project search attributes registered."
        temporal operator namespace update --address temporal:7233 --namespace default --retention 60d
        tail -f /dev/null

  temporal-ui:
    image: temporalio/ui:2.44.1
    restart: unless-stopped
    ports:
      - "8233:8080"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CSRF_COOKIE_INSECURE: "true"

  versitygw:
    image: versity/versitygw:v1.8.0
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - versitygw_data:/data
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      ROOT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      VGW_REGION: eu-west-1
      VGW_CORS_ALLOW_ORIGIN: "*"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /data/dms-local /data/temporal-payloads /data/quarantine-bucket
        exec versitygw --port :9000 --health /health posix /data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/health"]
      interval: 3s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - qdrant_data:/qdrant/storage

  tempo:
    image: grafana/tempo:2.9.0
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.6.3
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.142.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      TEMPORAL_UI_HOST: http://localhost:8233
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.4.2
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-otlp-receiver"
    volumes:
      - ./docker/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:v0.31.1
    profiles: ["observability"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yaml"]
    volumes:
      - ./docker/observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana-oss:11.2.0
    profiles: ["observability"]
    user: "0"
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/observability/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/observability/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - tempo
      - loki
      - prometheus

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command:
      - start-dev
      - --http-port=9090
    environment:
      KC_DB: dev-file
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 9090
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OIDC_BOOTSTRAP_ADMIN_PASSWORD:-${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-}}
      KC_FEATURES: token-exchange
      KC_HEALTH_ENABLED: true
    ports:
      - "9090:9090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/localhost/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \"200\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.0
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      OIDC_BOOTSTRAP_ADMIN_PASSWORD: ${OIDC_BOOTSTRAP_ADMIN_PASSWORD:-${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-}}
      LOCAL_OIDC_CLIENT_SECRET: ${LOCAL_OIDC_CLIENT_SECRET:-${LOCAL_KEYCLOAK_CLIENT_SECRET:-}}
      LOCAL_USER_ID: ${LOCAL_USER_ID}
      LOCAL_USER_EMAIL: ${LOCAL_USER_EMAIL}
      LOCAL_USER_PASSWORD: ${LOCAL_USER_PASSWORD}
      LOCAL_USER_FIRST_NAME: ${LOCAL_USER_FIRST_NAME}
      LOCAL_USER_LAST_NAME: ${LOCAL_USER_LAST_NAME}
    restart: on-failure
    volumes:
      - ./docker/keycloak/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/bash", "/bootstrap.sh"]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    restart: unless-stopped
    ports:
      - "3000:4180"
    depends_on:
      keycloak-bootstrap:
        condition: service_completed_successfully
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # The frontend dev server runs on the host via process-compose.
      OAUTH2_PROXY_UPSTREAMS: http://host.docker.internal:3002
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_CLIENT_ID: local-client
      OAUTH2_PROXY_CLIENT_SECRET: ${LOCAL_OIDC_CLIENT_SECRET:-${LOCAL_KEYCLOAK_CLIENT_SECRET:-}}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:3000/oauth2/callback
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      # The browser reaches Keycloak via localhost:9090, this container via
      # keycloak:9090. OIDC discovery cannot express that split, so the
      # endpoints are set explicitly.
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://localhost:9090/realms/local
      OAUTH2_PROXY_LOGIN_URL: http://localhost:9090/realms/local/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:9090/realms/local/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:9090/realms/local/protocol/openid-connect/certs
      OAUTH2_PROXY_PROFILE_URL: http://keycloak:9090/realms/local/protocol/openid-connect/userinfo
    extra_hosts:
      - "host.docker.internal:host-gateway"

  spicedb:
    image: authzed/spicedb:v1.49.0
    container_name: spicedb
    command: >
      serve
      --datastore-engine=postgres
      --datastore-conn-uri=postgres://postgres:${DB_PASSWORD}@spicedb-postgresql:5432/spicedb?sslmode=disable
      --grpc-preshared-key=${AUTH_SPICE_DB_TOKEN}
    environment:
      ZED_TOKEN: ${AUTH_SPICE_DB_TOKEN}
    healthcheck:
      test: [ "CMD", "grpc_health_probe", "-addr=:50051" ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    ports:
      - "50051:50051"

volumes:
  postgresql_data:
    driver: local
  backend_postgresql_data:
    driver: local
  temporal_postgresql_data:
    driver: local
  spicedb_postgresql_data:
    driver: local
  versitygw_data:
    driver: local
  qdrant_data:
    driver: local
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:

configs:
  backend_postgresql_init_sql:
    content: |
      #!/bin/sh
      set -eu
      psql --set=ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" --set=local_password="$$POSTGRES_PASSWORD" <<'SQL'
      SELECT 'CREATE ROLE application_owner NOLOGIN'
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'application_owner')\gexec
      SELECT format('CREATE ROLE application_migrator LOGIN PASSWORD %L IN ROLE application_owner', :'local_password')
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'application_migrator')\gexec
      SELECT format('CREATE ROLE application_runtime LOGIN PASSWORD %L', :'local_password')
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'application_runtime')\gexec

      ALTER DATABASE application OWNER TO application_owner;
      GRANT CONNECT ON DATABASE application TO application_migrator, application_runtime;

      \connect application
      CREATE EXTENSION IF NOT EXISTS vector;
      SQL

  # Loads the public gesetze-normen seed (deconstructed norms) on first
  # database initialization. Runs after init.sql created the databases.
  postgresql_seed_gesetze_normen:
    content: |
      echo "Seeding the gesetze-normen database from /seed/gesetze-normen-seed.sql.gz"
      # sed drops pg_dump 17 statements that PostgreSQL 16 does not know:
      # the \restrict guard and the transaction_timeout setting.
      gunzip -c /seed/gesetze-normen-seed.sql.gz \
        | sed -e '/^\\restrict /d' -e '/^\\unrestrict /d' -e '/^SET transaction_timeout/d' \
        | psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname gesetze-normen
      echo "Finished seeding the gesetze-normen database"

  postgresql_init_sql:
    content: |
      SELECT 'CREATE DATABASE "gesetze-normen"'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'gesetze-normen')\gexec
      SELECT 'CREATE DATABASE "begruendungen-db"'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'begruendungen-db')\gexec
      SELECT 'CREATE DATABASE "jura-db"'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'jura-db')\gexec
      SELECT 'CREATE DATABASE "fallvergleichsservice-db"'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'fallvergleichsservice-db')\gexec
      SELECT 'CREATE DATABASE "rechtsaenderungsmonitoring-db"'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'rechtsaenderungsmonitoring-db')\gexec
      SELECT 'CREATE DATABASE rechtsbegriffe'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'rechtsbegriffe')\gexec

      CREATE EXTENSION IF NOT EXISTS vector;

      \connect "gesetze-normen"
      CREATE EXTENSION IF NOT EXISTS vector;
      \connect "begruendungen-db"
      CREATE EXTENSION IF NOT EXISTS vector;
      \connect "jura-db"
      CREATE EXTENSION IF NOT EXISTS vector;
      \connect "fallvergleichsservice-db"
      CREATE EXTENSION IF NOT EXISTS vector;
      \connect "rechtsaenderungsmonitoring-db"
      CREATE EXTENSION IF NOT EXISTS vector;
      \connect rechtsbegriffe
      CREATE EXTENSION IF NOT EXISTS vector;
