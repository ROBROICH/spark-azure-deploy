[project]
name = "internal-auth"
version = "0.1.0"
description = "Shared internal service authentication header utilities."
requires-python = ">=3.13, <3.14"
dependencies = [
    "pydantic>=2.10.6,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
]

[tool.hatch.build.targets.sdist]
include = ["src/internal_auth"]

[tool.hatch.build.targets.wheel]
include = ["src/internal_auth"]

[tool.hatch.build.targets.wheel.sources]
"src/internal_auth" = "internal_auth"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
