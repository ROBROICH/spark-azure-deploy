[project]
name = "audit-client"
version = "0.1.0"
description = "Shared helper for writing audit log entries from BMDS services."
requires-python = ">=3.13, <3.14"
dependencies = [
    "sqlalchemy>=2.0.0,<3.0.0",
    "starlette>=1.0.1",
    "fastapi>=0.120.1",
    "pydantic-settings>=2.0,<3",
    "authentification>=0.1.15,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.1.0,<2",
    "ruff>=0.14.6,<0.15",
    "pyrefly>=0.49.0",
]

[tool.uv]
package = true

[tool.uv.sources]
authentification = { workspace = true }

[tool.hatch.build.targets.sdist]
include = ["src/audit_client"]

[tool.hatch.build.targets.wheel]
include = ["src/audit_client"]

[tool.hatch.build.targets.wheel.sources]
"src/audit_client" = "audit_client"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
