[project]
name = "llm-client"
version = "0.1.0"
description = "Shared lightweight LLM client for LiteLLM proxy — Activity + Client"
requires-python = ">=3.13, <3.14"
dependencies = [
    "openai>=2.26.0,<3.0.0",
    "httpx>=0.28.0,<0.29.0",
    "json-repair>=0.39.0",
    "jsonschema>=4.23.0,<5.0.0",
    "pydantic>=2.10.6,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "temporalio>=1.33.0,<2.0.0",
    "temporal",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "pytest-cov>=6.2.1,<7",
    "ruff>=0.14.6,<0.15",
    "pyrefly>=0.49.0",
]

[tool.hatch.build.targets.sdist]
include = ["src/llm_client"]

[tool.hatch.build.targets.wheel]
include = ["src/llm_client"]

[tool.hatch.build.targets.wheel.sources]
"src/llm_client" = "llm_client"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLC0415"]

[tool.coverage.run]
omit = ["src/llm_client/env.py"]

[tool.uv.sources]
temporal = { workspace = true }

[tool.pyrefly]
search_path = ["."]
project-includes = ["."]
disable-search-path-heuristics = true
[tool.pyrefly.errors]
# Core strict typing - catch implicit Any and missing annotations
implicit-any = "error"
unannotated-parameter = "error"
unannotated-return = "error"
unannotated-attribute = "error"
# Class strictness
implicit-abstract-class = "error"
implicitly-defined-attribute = "error"
missing-override-decorator = "error"
# TypedDict strictness
not-required-key-access = "error"
open-unpacking = "error"
# Import strictness
untyped-import = "error"
missing-source = "error"
missing-source-for-stubs = "error"
# Keep warnings as errors for maximum strictness
deprecated = "error"
redundant-cast = "error"
unnecessary-comparison = "error"
