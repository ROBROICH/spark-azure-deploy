[project]
name = "rechtsaenderungsmonitoring"
version = "0.2.0"
description = "rechtsaenderungsmonitoring"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "db-services-shared",
    "feedparser>=6.0.11,<7",
    "pypdf>=6.19.0,<7",
    "markdownify>=1.2.0,<2",
    "pdfplumber>=0.11.7,<0.12",
    "authentification",
    "temporal",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3,<5",
    "pandas>=2.3.1,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.1.0,<2",
    "pytest-cov>=6.2.1,<7",
    "pytest-env>=1.1.5,<2",
    "pytest-xdist>=3.8.0,<4",
    "pytest-postgresql>=8.0.0,<9",
    "asgi-lifespan>=2.1.0,<3",
    "respx>=0.22.0,<0.23",
    "ruff>=0.14.6,<0.15",
    "pyrefly>=0.49.0",
]

[tool.uv]
package = true

[tool.uv.sources]
db-services-shared = { workspace = true }
authentification = { workspace = true }
temporal = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["integration: mark a test as an integration test (uses real external services)"]
addopts = "-m 'not integration' -p no:warnings -v --ignore=./db-data"
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg"]
postgresql_dbname = "rechtsaenderungsmonitoring-db"
postgresql_port = "15434"
postgresql_password = "postgres"
asyncio_mode = "auto"
env = [
    "D:DB_PORT=15434",
    "D:TEMPORAL_S3_ACCESS_KEY_ID=test",
    "D:TEMPORAL_S3_SECRET_ACCESS_KEY=test",
]

[tool.coverage.report]
exclude_also = [
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.run]
source = ["rechtsaenderungsmonitoring"]
omit = [
    "tests/*",
    "alembic/*",
    "rechtsaenderungsmonitoring/conversion/*",
    "rechtsaenderungsmonitoring/celery/*",
]

[tool.pyrefly]
search_path = ["."]
project-includes = ["."]
disable-search-path-heuristics = true

[tool.pyrefly.errors]
implicit-any = "error"
unannotated-parameter = "error"
unannotated-return = "error"
unannotated-attribute = "error"
implicit-abstract-class = "error"
implicitly-defined-attribute = "error"
missing-override-decorator = "error"
not-required-key-access = "error"
open-unpacking = "error"
untyped-import = "error"
missing-source = "error"
missing-source-for-stubs = "error"
deprecated = "error"
redundant-cast = "error"
unnecessary-comparison = "error"
