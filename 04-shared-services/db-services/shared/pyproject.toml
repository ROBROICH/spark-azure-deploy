[project]
name = "db-services-shared"
version = "0.2.0"
description = "Shared db services code"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic-settings>=2.10.1,<3.0.0",
    "alembic>=1.16.4,<2.0.0",
    "psycopg[binary,pool]>=3.3.3,<4.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "sqlmodel>=0.0.24",
    "fastapi>=0.133.0",
    "starlette>=1.3.1",
    "prometheus-fastapi-instrumentator>=8.0.0,<9.0.0",
    "uvicorn>=0.41.0,<0.42.0",
    "greenlet>=3.3.2",
    "httpx>=0.28.1",
    "cachetools>=7.1.1",
    "types-cachetools>=7.0.0.20260518",
    "event-logging",
    "temporal",
]

[project.optional-dependencies]
llm = [
    "langchain[openai]>=0.3.0",
    "langsmith>=0.8.0",
    "pgvector>=0.4.2,<0.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.6,<0.15",
    "pyrefly>=0.49.0",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.2.1,<7",
    "pytest-xdist>=3.8.0,<4",
    "pytest-postgresql>=8.0.0,<9",
    "respx>=0.22.0",
]

[tool.uv]
package = true

[tool.uv.sources]
event-logging = { workspace = true }
temporal = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

### Tools config

[tool.pytest.ini_options]
markers = ["integration: mark a test as an integration test (uses real external services)"]
addopts = "-m 'not integration' -cov=src -p no:warnings -v"
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    ]

[tool.coverage.run]
source = ["src"]
omit = [
    # omit this single file
    "tests/*",
    ]

[tool.pyrefly]
search_path = ["."]
project-includes = ["."]
disable-search-path-heuristics = true

[tool.pyrefly.errors]
implicit-any = "error"
unannotated-parameter = "error"
unannotated-return = "error"
unannotated-attribute = "error"
implicit-abstract-class = "error"
implicitly-defined-attribute = "error"
missing-override-decorator = "error"
not-required-key-access = "error"
open-unpacking = "error"
untyped-import = "error"
missing-source = "error"
missing-source-for-stubs = "error"
deprecated = "error"
redundant-cast = "error"
unnecessary-comparison = "error"
