[project]
name = "alembic-utils"
version = "0.1.0"
description = "Shared Alembic helpers for safe autogenerated revisions."
requires-python = ">=3.13, <3.14"
dependencies = [
    "alembic>=1.16.4,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.14.6,<0.15",
    "pyrefly>=0.49.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.sdist]
include = ["src/alembic_utils"]

[tool.hatch.build.targets.wheel]
include = ["src/alembic_utils"]

[tool.hatch.build.targets.wheel.sources]
"src/alembic_utils" = "alembic_utils"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["*.sql"]
