workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
    - when: never

stages:
  - test
  - service-pipelines

variables:
  DEVGUARD_WEB_UI: "https://devguard.opencode.de"

include:
  - remote: "https://gitlab.opencode.de/l3montree/devguard-ci-components/-/raw/v1.6.0/templates/secret-scanning.yml"
    inputs: &devguard-test-inputs
      devguard_asset_name: "$DEVGUARD_ASSET_NAME"
      devguard_token: "$DEVGUARD_TOKEN"
      devguard_api_url: "$DEVGUARD_API_URL"
      devguard_web_ui: "$DEVGUARD_WEB_UI"
      stage: "test"

  - remote: "https://gitlab.opencode.de/l3montree/devguard-ci-components/-/raw/v1.6.0/templates/static-application-security-testing.yml"
    inputs:
      <<: *devguard-test-inputs
      stage: "test"

  - remote: "https://gitlab.opencode.de/l3montree/devguard-ci-components/-/raw/v1.6.0/templates/infrastructure-as-code-scanning.yml"
    inputs:
      <<: *devguard-test-inputs
      stage: "test"

  - remote: "https://gitlab.opencode.de/l3montree/devguard-ci-components/-/raw/v1.6.0/templates/software-composition-analysis.yml"
    inputs:
      <<: *devguard-test-inputs
      stage: "test"

.service-child-pipeline:
  stage: service-pipelines

frontend:
  extends: .service-child-pipeline
  trigger:
    include:
      - local: ".gitlab/ci/services/frontend.yml"
    strategy: depend
    forward: { yaml_variables: true, pipeline_variables: true }
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: always
    - changes: [01-frontend/frontend/**/*, .gitlab/ci/services/frontend.yml, .gitlab/ci/templates/devguard-oci-service.yml, .gitlab-ci.yml, pyproject.toml, uv.lock]
      when: always
    - when: never

