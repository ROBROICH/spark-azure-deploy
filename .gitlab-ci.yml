workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
    - when: never

default:
  retry: 2

stages:
  - test
  - service-pipelines-1
  - service-pipelines-2
  - service-pipelines-3
  - service-pipelines-4
  - service-pipelines-5
  - service-pipelines-6

variables:
  DEVGUARD_WEB_UI: "https://devguard.opencode.de"

include:
  - local: ".gitlab/ci/templates/handbuch-pages.yml"

  - remote: "https://gitlab.com/l3montree/devguard/-/raw/v1.16.0/templates/secret-scanning.yml"
    integrity: "sha256-7biJ6CALZ8sAh3VVNB+VbiDoX0yO6Ngq0DGU6NysMAU="
    inputs: &devguard-test-inputs
      devguard_asset_name: "$DEVGUARD_ASSET_NAME"
      devguard_token: "$DEVGUARD_TOKEN"
      devguard_api_url: "$DEVGUARD_API_URL"
      devguard_web_ui: "$DEVGUARD_WEB_UI"
      pull_policy: "if-not-present"
      stage: "test"

  - remote: "https://gitlab.com/l3montree/devguard/-/raw/v1.16.0/templates/static-application-security-testing.yml"
    integrity: "sha256-Y1YfR/T8+U+sxyxJnh8VN/6/Yrpei+bQoPiL9c+eZi0="
    inputs:
      <<: *devguard-test-inputs
      stage: "test"

  - remote: "https://gitlab.com/l3montree/devguard/-/raw/v1.16.0/templates/infrastructure-as-code-scanning.yml"
    integrity: "sha256-VBUChY/NW9gQbOmUehPdjLOyLrFF3kVP8p/Rehj2X5g="
    inputs:
      <<: *devguard-test-inputs
      stage: "test"

  - remote: "https://gitlab.com/l3montree/devguard/-/raw/v1.16.0/templates/software-composition-analysis.yml"
    integrity: "sha256-pmHqL5f9KEY7wcqJa0lUbaJvBR0igCzQWFa+b5ChJYI="
    inputs:
      <<: *devguard-test-inputs
      devguard_artifact_name: "pkg:generic/spark-workflow-monorepo"
      stage: "test"
      fail_on_risk: "critical"
      fail_on_cvss: "critical"

"devguard:secret_scanning":
  allow_failure: true

"devguard:static-application-security-testing":
  allow_failure: true

"devguard:infrastructure_as_code_scanning":
  allow_failure: true

frontend:
  stage: service-pipelines-1
  trigger:
    include:
      - local: ".gitlab/ci/services/frontend.yml"
    strategy: depend
    forward: { yaml_variables: true, pipeline_variables: true }
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: always
    - changes: [01-frontend/frontend/**/*, .gitlab/ci/services/frontend.yml, .gitlab/ci/templates/devguard-oci-service.yml, .gitlab-ci.yml, pyproject.toml, uv.lock]
      when: always
    - when: never

.typescript:
  stage: test
  image: node:22.23.2
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  rules:
    - if: '$CI_COMMIT_TAG'
      exists: [02-backend/apps/spark-backend/package.json]
      when: on_success
    - exists: [02-backend/apps/spark-backend/package.json]
      changes: &spark-backend-changes
        - 02-backend/apps/spark-backend/**/*
        - 02-backend/features/**/*
        - packages/**/*
        - scripts/**/*
        - .gitlab/ci/services/spark-backend.yml
        - .gitlab/ci/templates/devguard-oci-service.yml
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - vite.config.ts
        - 02-backend/apps/Dockerfile
      when: on_success
    - when: never
  before_script:
    - corepack enable
    - corepack prepare --activate
    - pnpm install --frozen-lockfile

typescript-lint:
  extends: .typescript
  script:
    - pnpm run lint
    - pnpm --filter '@spark-workflow/spark-backend' db:generate
    - |
      if [ -n "$(git status --short -- 02-backend/apps/spark-backend/src/migrations)" ]; then
        git status --short -- 02-backend/apps/spark-backend/src/migrations
        exit 1
      fi

typescript-typecheck:
  extends: .typescript
  script:
    - pnpm run typecheck

typescript-test:
  extends: .typescript
  script:
    - pnpm exec -- vp run --filter './02-backend/apps/spark-backend' --filter './02-backend/features/*' --filter './packages/**' --fail-if-no-match --no-cache test

spark-backend:
  stage: service-pipelines-1
  trigger:
    include:
      - local: ".gitlab/ci/services/spark-backend.yml"
    strategy: depend
    forward: { yaml_variables: true, pipeline_variables: true }
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG'
      exists: [02-backend/apps/spark-backend/package.json]
      when: on_success
    - exists: [02-backend/apps/spark-backend/package.json]
      changes: *spark-backend-changes
      when: on_success
    - when: never

