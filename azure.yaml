# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: spark-workflow-azure-demo
metadata:
  template: spark-workflow-azure-demo@0.1

# `azd up` provisions the foundations (infra/main.bicep) into the target
# subscription, then the postprovision hook (scripts/azure/deploy-all.ps1) stands
# up the full SPARK app tier — stores, seed, auth, ~30 Container Apps, frontend,
# temporal-ui — by reusing the proven per-component deploy scripts and Bicep.
#
# There are intentionally no azd `services`: the container images are pre-built
# and published to a public registry (GHCR) by the sync-and-build pipeline, so
# azd does not build or push images itself. See patches/ and README for the flow.
infra:
  provider: bicep
  path: infra
  module: main

hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ./scripts/fetch-upstream.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: ./scripts/fetch-upstream.sh
      interactive: true
      continueOnError: false
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/azure/deploy-all.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: pwsh -NoProfile -File ./scripts/azure/deploy-all.ps1
      interactive: true
      continueOnError: false
