# Public reverse proxy in front of the internal MinIO (S3 API on minio:9000).
# Preserves the Host header so AWS SigV4 presigned URLs (signed by document-management with
# S3_EXTERNAL_URL = this proxy's public FQDN) validate at MinIO. Streams large uploads and
# handles browser CORS preflight so the SPA can PUT/GET documents directly.
server {
    listen 80;
    server_name _;

    # Allow arbitrarily large document uploads; stream instead of buffering to disk.
    client_max_body_size 0;
    proxy_request_buffering off;
    # Stream large downloads too. Without this, nginx buffers the upstream response in the
    # default 8x8k (=64k) in-memory proxy_buffers and, when it cannot spill to a temp file,
    # aborts the connection mid-body (truncating >64k responses such as the extraction
    # _processed.json chunk payloads). Disabling response buffering streams byte-for-byte.
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        # CORS preflight for browser presigned PUT/GET.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "$http_access_control_request_headers" always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://minio:9000;
        # Host must match what document-management signed (the public FQDN) or SigV4 fails.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Present a single, browser-friendly CORS origin (avoid duplicate from MinIO).
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Expose-Headers "ETag, Content-Length" always;
    }
}
