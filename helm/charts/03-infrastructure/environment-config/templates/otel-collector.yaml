{{- if .Values.otel.enabled }}
# Per-environment OTLP collector. Fixed names — Deployment and Service are
# both "otel-collector" — so every workload can use
#   OTEL_ENDPOINT=otel-collector.<namespace>.svc.cluster.local:4317
# Runs as the shared ServiceAccount; with the googlecloud exporter its Google
# identity (e.g. Workload Identity) needs roles/cloudtrace.agent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ include "environment-config.namespace" . }}
  labels:
    {{- include "environment-config.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  replicas: {{ .Values.otel.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: otel-collector
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/otel-collector-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.otel.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "environment-config.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: {{ .Values.otel.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otel/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.otel.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
---
# Service name is load-bearing: apps address the collector as
# otel-collector.<namespace>.svc.cluster.local:4317 (gRPC) / :4318 (HTTP).
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ include "environment-config.namespace" . }}
  labels:
    {{- include "environment-config.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
      appProtocol: grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
