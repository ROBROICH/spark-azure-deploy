{{- if .Values.serviceAccount.create -}}
# Shared per-namespace ServiceAccount: every workload in the environment
# namespace runs as it. With gcp.serviceAccountEmail set (the full email,
# used verbatim), Workload Identity binds it to that Google service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "environment-config.serviceAccountName" . }}
  namespace: {{ include "environment-config.namespace" . }}
  labels:
    {{- include "environment-config.labels" . | nindent 4 }}
  {{- if or .Values.gcp.serviceAccountEmail .Values.serviceAccount.annotations }}
  annotations:
    {{- with .Values.gcp.serviceAccountEmail }}
    iam.gke.io/gcp-service-account: {{ . }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- with .Values.serviceAccount.imagePullSecrets }}
# SA-level pull secrets cover every pod using this ServiceAccount that lists
# no imagePullSecrets of its own (a pod-level list replaces, never merges
# with, the SA-level one).
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
