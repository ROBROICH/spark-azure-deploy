{{- /*
=============================================================================
ExternalSecrets — one per entry of externalSecrets.secrets (values-driven).

Per namespace, each unique secret exists as exactly ONE ExternalSecret and
every consumer references that Kubernetes Secret by its target name.

Remote keys (data.*.remoteKey and every string in dataFrom) are rendered with
tpl against this chart, so environment-specific Vault entries are written
relative to externalSecrets.pathPrefix, e.g.
  remoteKey: '{{ .Values.externalSecrets.pathPrefix }}/database'
A data remote key that renders empty, or with a leading/trailing "/" or "//",
fails the render: it means pathPrefix (or another value it uses) is unset.
=============================================================================
*/ -}}
{{- $root := . }}
{{- $defaults := .Values.externalSecrets }}
{{- range $name, $secret := $defaults.secrets }}
{{- if and $secret (ne (toString (dig "enabled" true $secret)) "false") }}
{{- $where := printf "environment-config: externalSecrets.secrets.%s" $name }}
{{- $target := $secret.targetName | default $name }}
{{- $namespaces := $secret.namespaces | default (list (include "environment-config.namespace" $root)) }}
{{- if not (kindIs "slice" $namespaces) }}
{{- fail (printf "%s.namespaces must be a list" $where) }}
{{- end }}
{{- $store := merge (deepCopy ($secret.secretStore | default dict)) $defaults.secretStore }}
{{- if not $store.name }}
{{- fail (printf "%s: no secret store — set externalSecrets.secretStore.name (or the entry's secretStore)" $where) }}
{{- end }}
{{- if and (not $secret.data) (not $secret.dataFrom) }}
{{- fail (printf "%s has neither data nor dataFrom" $where) }}
{{- end }}
{{- if and $secret.dockerConfigJson $secret.template }}
{{- fail (printf "%s sets both dockerConfigJson and template — set dockerConfigJson: null to use a custom template" $where) }}
{{- end }}
{{- if $secret.dockerConfigJson }}
{{- if not (and (hasKey ($secret.data | default dict) "username") (hasKey ($secret.data | default dict) "password")) }}
{{- fail (printf "%s.dockerConfigJson needs data.username and data.password" $where) }}
{{- end }}
{{- end }}
{{- range $ns := $namespaces }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret.name | default $target }}
  namespace: {{ $ns }}
  labels:
    {{- include "environment-config.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $secret.refreshInterval | default $defaults.refreshInterval }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ $store.kind }}
  target:
    name: {{ $target }}
    creationPolicy: {{ $secret.creationPolicy | default "Owner" }}
    {{- with $secret.deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
    {{- if $secret.dockerConfigJson }}
    {{- $registry := $secret.dockerConfigJson.registry | required (printf "%s.dockerConfigJson.registry must be set" $where) }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              {{ $registry | quote }}: {
                "username": "{{ `{{ .username }}` }}",
                "password": "{{ `{{ .password }}` }}",
                "auth": "{{ `{{ printf "%s:%s" .username .password | b64enc }}` }}"
              }
            }
          }
    {{- else if $secret.template }}
    template:
      {{- if $secret.tpl }}
      {{- tpl (toYaml $secret.template) $root | nindent 6 }}
      {{- else }}
      {{- toYaml $secret.template | nindent 6 }}
      {{- end }}
    {{- end }}
  {{- with $secret.data }}
  data:
    {{- range $secretKey, $ref := . }}
    {{- if not (kindIs "map" $ref) }}
    {{- fail (printf "%s.data.%s must be a map {remoteKey, property}" $where $secretKey) }}
    {{- end }}
    {{- $remoteKey := tpl (toString (required (printf "%s.data.%s.remoteKey is required" $where $secretKey) $ref.remoteKey)) $root | trim }}
    {{- if or (not $remoteKey) (hasPrefix "/" $remoteKey) (hasSuffix "/" $remoteKey) (contains "//" $remoteKey) }}
    {{- fail (printf "%s.data.%s.remoteKey renders to %q — is externalSecrets.pathPrefix set?" $where $secretKey $remoteKey) }}
    {{- end }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $remoteKey }}
        {{- with $ref.property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- with $secret.dataFrom }}
  dataFrom:
    {{- tpl (toYaml .) $root | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
