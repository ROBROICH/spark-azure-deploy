{{- if and .Values.serviceAccount.create (not .Values.serviceAccount.name) (or .Values.cloudSqlProxy.enabled .Values.pgbouncer.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "db-proxy.fullname" . }}
  namespace: {{ include "db-proxy.namespace" . }}
  labels:
    helm.sh/chart: {{ include "db-proxy.chart" . }}
    app.kubernetes.io/name: {{ include "db-proxy.name" . }}
    app.kubernetes.io/instance: {{ include "db-proxy.fullname" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
