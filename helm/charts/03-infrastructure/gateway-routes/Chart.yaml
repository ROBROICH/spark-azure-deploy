apiVersion: v2
name: gateway-routes
description: >-
  Per-environment Envoy Gateway routing for a SPARK environment: HTTPRoutes,
  SecurityPolicies (OIDC + JWT), Keycloak Backend/BackendTLSPolicy. Deployed INTO
  the environment namespace. The Gateway `api-gateway` itself lives in
  envoy-gateway-system and is NOT part of this chart.
