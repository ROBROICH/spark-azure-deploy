{{- if .Values.routes.temporal.enabled }}
{{- /*
temporal.<domain> → the Temporal Web UI Service of the temporal wrapper chart;
the name defaults to "<release>-temporal-web" (.Values.temporalWebService
overrides), the namespace to the release namespace
(backendNamespaces.temporal overrides).
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: temporal-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway-routes.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "gateway-routes.groupParentRefs" (dict "root" . "group" "temporal") | nindent 4 }}
  hostnames:
    {{- include "gateway-routes.hostnameItems" (include "gateway-routes.hostList" (dict "root" . "key" "temporal") | fromJsonArray) | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "gateway-routes.temporalWebService" . }}
          {{- with include "gateway-routes.explicitBackendNamespace" (dict "root" $ "chart" "temporal") }}
          namespace: {{ . }}
          {{- end }}
          port: {{ .Values.temporalWebPort }}
      timeouts:
        request: "125s"
        backendRequest: "120s"
{{- end }}
