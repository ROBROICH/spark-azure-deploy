    # administrative-file-draft
    - matches:
        - path:
            type: PathPrefix
            value: /v2/vae/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/v2/vae/
