          namespace: {{ . }}
          {{- end }}
          port: {{ .Values.backendServicePort }}
      timeouts:
        request: "60s"
        backendRequest: "60s"
    # formal-completeness-check
    - matches:
        - path:
            type: PathPrefix
            value: /v2/fcs/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/v2/fcs/
      backendRefs:
