          {{- with include "gateway-routes.backendNamespace" (dict "root" $ "chart" "administrative-file-draft") }}
          namespace: {{ . }}
          {{- end }}
          port: {{ .Values.backendServicePort }}
      timeouts:
        request: "60s"
        backendRequest: "60s"
    # examination-service
    - matches:
        - path:
            type: PathPrefix
            value: /v2/examination/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/v2/examination/
      backendRefs:
        - name: {{ include "gateway-routes.backendName" (dict "root" $ "chart" "examination-service") }}
          {{- with include "gateway-routes.backendNamespace" (dict "root" $ "chart" "examination-service") }}
          namespace: {{ . }}
          {{- end }}
          port: {{ .Values.backendServicePort }}
      timeouts:
        request: "60s"
        backendRequest: "60s"
    # feedback-service
    - matches:
        - path:
            type: PathPrefix
            value: /v2/feedback/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/v2/feedback/
      backendRefs:
        - name: {{ include "gateway-routes.backendName" (dict "root" $ "chart" "feedback-service") }}
