{{- if .Values.routes.redirect.enabled }}
{{- /*
http → https redirect. One http listener per environment by default (the
Gateway's http-<env>, or the ListenerSet's http listener; wildcard
*.<domain> hostname), so a single parentRef covers every host;
gateway.httpSectionName lists several for Gateways with listeners per
hostname.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway-routes.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "gateway-routes.httpParentRefs" . | nindent 4 }}
  {{- if .Values.routes.redirect.restrictToHosts }}
  {{- $hosts := list }}
  {{- range $site := include "gateway-routes.dashboardSites" . | fromJsonArray }}
  {{- $hosts = concat $hosts $site.hosts }}
  {{- end }}
  {{- if .Values.routes.api.enabled }}
  {{- $hosts = concat $hosts (include "gateway-routes.hostList" (dict "root" . "key" "api") | fromJsonArray) }}
  {{- end }}
  {{- if .Values.routes.temporal.enabled }}
  {{- $hosts = concat $hosts (include "gateway-routes.hostList" (dict "root" . "key" "temporal") | fromJsonArray) }}
  {{- end }}
  {{- range $site := include "gateway-routes.extraSites" . | fromJsonArray }}
  {{- $hosts = concat $hosts $site.hosts }}
  {{- end }}
  hostnames:
    {{- include "gateway-routes.hostnameItems" $hosts | nindent 4 }}
  {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
