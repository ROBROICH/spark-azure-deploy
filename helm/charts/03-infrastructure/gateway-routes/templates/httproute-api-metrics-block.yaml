{{- if .Values.routes.api.enabled }}
{{- /*
Backend-less rules answer 500 for /metrics paths so internal Prometheus endpoints are
never exposed on the public api host (deliberately outside the JWT policy).
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-metrics-block-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway-routes.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "gateway-routes.groupParentRefs" (dict "root" . "group" "api") | nindent 4 }}
  hostnames:
    {{- include "gateway-routes.hostnameItems" (include "gateway-routes.hostList" (dict "root" . "key" "api") | fromJsonArray) | nindent 4 }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /fpp/v1/metrics
        - path:
            type: PathPrefix
            value: /fpp/v1/metrics/
{{- end }}
