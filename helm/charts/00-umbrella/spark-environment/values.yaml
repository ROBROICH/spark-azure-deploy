# ---------------------------------------------------------------------------
# backend-services — the spark-backend modulith (pools)
# ---------------------------------------------------------------------------
#
# The modulith runs as one pool per API surface/worker (alias of
# spark-backend-pool). Everything the pools share is configured once under
# global.backend (see the global block above and
# 02-backend/spark-backend-pool/values.yaml); per-pool keys (replicaCount,
# resources, pool.worker, autoscaling, keda, podMonitoring) go under
# backend-services.<pool>. Pool defaults live in the backend-services chart.
# Namespaces default to "backend-services"; see the service-layer chart.

backend-services:
  # Set to false to exclude the entire backend layer from the release.
  enabled: true

  # Example pool overrides (all 15 pools accept the same keys):
  # document-management-service:
  #   replicaCount: 3
  #   keda:
  #     enabled: true          # requires KEDA in the cluster
  #   podMonitoring:
  #     enabled: true          # GMP; when no namespace-wide PodMonitoring exists

# ---------------------------------------------------------------------------
# frontend-services — user-facing workloads
# ---------------------------------------------------------------------------
#
# Per-chart keys are placed under frontend-services.<chart-name>.
# Namespaces default to "frontend-services"; see the service-layer chart.

frontend-services:
  # Set to false to exclude the entire frontend layer from the release.
  enabled: true

  # --- frontend ---
  # Main web application.
  frontend:
    image:
      repository: <container-registry>/frontend-app
      tag: "<image-tag>"
    extraEnv:
    # API base path used by the frontend to reach backend services.
    - name: VITE_API_BASE_URL
      value: /api
    # Application base path for client-side routing.
    - name: VITE_APP_BASE_PATH
      value: /app
    # Set to "true" to enable the EWMS feature flag.
    - name: VITE_ENABLE_EWMS_FEATURE
      value: "true"
    # Set to "true" to activate maintenance mode in the UI.
    - name: VITE_ENABLE_MAINTENANCE_MODE
      value: "false"
    # Sentry DSN for frontend error reporting.
    - name: VITE_SENTRY_DSN
      value: "<sentry-dsn-url>"
    # Sentry environment tag.
    - name: VITE_SENTRY_ENVIRONMENT
      value: "<sentry-environment>"
    # Base URL of the Temporal UI service.
    - name: VITE_TEMPORAL_UI_BASE_URL
      value: "<temporal-ui-url>"
    # Set to "true" to route file downloads through the backend S3 proxy.
    - name: VITE_USE_S3_PROXY
      value: "false"

  # --- prototype-demo ---
  # Demo and prototype frontend for feature previews.
  prototype-demo:
    image:
      repository: <container-registry>/frontend-demo-app
      tag: "<image-tag>"
    extraEnv: []
