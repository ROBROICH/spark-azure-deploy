# =============================================================================
# spark-environment — values.yaml
# =============================================================================
#
# Generic configuration reference for the SPARK Workflow umbrella chart.
# Replace all <placeholder> values with deployment-specific values before
# installing. See README.md for the full placeholder reference.
#
# Install:
#   helm upgrade --install spark . -f values.yaml --namespace <release-namespace>
#
# =============================================================================

# ---------------------------------------------------------------------------
# Global shared configuration
# ---------------------------------------------------------------------------

global:

  # Stage identifier appended to generated resource names (e.g. "svc-dev").
  # Leave empty to deploy without a name suffix.
  stage:
    name: ""

  # Value of the "environment" pod label applied to every workload.
  labels:
    environment: ""

  # Shared baseline environment variables injected into every container.
  # A chart's own env always takes precedence on name collisions.
  env: []

  # Additional shared environment variables merged after env.
  # A chart's own env / extraEnv always takes precedence on name collisions.
  extraEnv:
    # --- Authentication & authorization (all services) ---
    # JWT audience claim validated by each service.
    - name: AUTH_AUDIENCE
      value: "<auth-audience>"
    # Base URL of the Keycloak server.
    - name: AUTH_BASE_URL
      value: "<keycloak-base-url>"
    # Authentication enforcement mode (e.g. strict, enforce, disabled).
    - name: AUTH_MODE
      value: "<auth-mode>"
    - name: AUTH_ALLOWED_MACHINE_IDENTITIES
      value: "spiffe://cluster.local/ns/*/sa/*"
    # Keycloak realm name used for token validation.
    - name: AUTH_REALM
      value: "<auth-realm>"
    # SpiceDB gRPC endpoint for relationship-based access control.
    - name: AUTH_SPICE_DB_ENDPOINT
      value: "<spicedb-host>"
    # Set to "true" to connect without TLS (development only).
    - name: AUTH_SPICE_DB_INSECURE
      value: "true"
    # SpiceDB pre-shared key; sourced from a Kubernetes Secret.
    - name: AUTH_SPICE_DB_TOKEN
      valueFrom:
        secretKeyRef:
          key: preshared_key
          name: spicedb-config

  # --- spark-backend modulith (all backend-services pools) ---
  backend:
    # Namespace of the pools; empty = the layer / release namespace.
    namespaceOverride: ""
    image:
      repository: <container-registry>/spark-backend
      # Pinned image tag. Use <tag>@sha256:<digest> for reproducible releases.
      tag: "<image-tag>"
    # Non-secret configuration of every pool (ConfigMap spark-backend-config,
    # loaded with envFrom). Values may use Helm templates.
    config:
      ENV: "<environment-name>"
      HOST: 0.0.0.0
      PORT: "8000"
      DB_HOST: "<postgresdb-host>"
      DB_MIGRATE_HOST: "<postgresdb-host>"
      DB_PORT: "5432"
      DB_NAME: "<postgresdb-name-backend>"
      AUTH_CLIENT_ID: "<keycloak-backend-client-id>"
      AUTH_PRIVILEGED_REALM: master
      AUTH_PRIVILEGED_CLIENT_ID: role-changer
      TEMPORAL_HOST: "<temporal-host>"
      TEMPORAL_NAMESPACE: default
      TEMPORAL_S3_BUCKET_NAME: "<temporal-payloads-bucket>"
      TEMPORAL_S3_ENDPOINT_URL: "<object-storage-url>"
      TEMPORAL_S3_REGION: "<s3-region>"
      BUCKET_NAME: "<object-storage-bucket>"
      S3_ENDPOINT_URL: "<object-storage-url>"
      S3_REGION: "<s3-region>"
      UNO_HOST: "<unoserver-host>"
      CLAMAV_BASE_URL: "<kubernetes-http-service-url>"
      LAW_DATABASE_BASE_URL: "<kubernetes-http-service-url>"
      PROJECT_LOGIC_SERVICE_CORS_ORIGINS: "<cors-origins>"
      OTEL_EXPORTER_OTLP_ENDPOINT: "<otel-endpoint>"
    # Secrets: whole Secrets via envFrom (secretRefs) and/or single keys (env).
    secretRefs: []
    # The modulith requires DB_USER, DB_PASSWORD, DB_MIGRATE_USER and
    # DB_MIGRATE_PASSWORD (runtime and migration role; may be the same user),
    # AUTH_CLIENT_SECRET, the S3/Temporal S3 keys and ARCHIVAL_ENCRYPTION_KEY.
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: "<backend-db-secret>"
          key: username
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: "<backend-db-secret>"
          key: password
    - name: DB_MIGRATE_USER
      valueFrom:
        secretKeyRef:
          name: "<backend-db-secret>"
          key: username
    - name: DB_MIGRATE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: "<backend-db-secret>"
          key: password
    # KEDA temporal triggers (only for pools with keda.enabled).
    keda:
      temporal:
        endpoint: "<temporal-host>"

# ---------------------------------------------------------------------------
# agent-services — AI modules and shared agent infrastructure
# ---------------------------------------------------------------------------
#
# Per-chart keys are placed under agent-services.<chart-name>. Any key
# supported by the leaf chart's values.yaml can be set here.
# Namespaces default to "agent-services"; see the service-layer chart.

agent-services:
  # Set to false to exclude the entire agent layer from the release.
  enabled: true

  # --- gesetze-normen-db-service ---
  # Laws and legal norms reference database.
  gesetze-normen-db-service:
    image:
      # Container image for the gesetze-normen-db workload.
      repository: <container-registry>/gesetze-normen-db
      # Pinned image tag. Use <tag>@sha256:<digest> for reproducible releases.
      tag: "<image-tag>"
    extraEnv:
    # PostgreSQL host / pooler hostname.
    - name: DB_HOST
      value: "<postgresdb-host-gesetze-normen>"
    # Database name.
    - name: DB_NAME
      value: "<postgresdb-name-gesetze-normen>"
    # PostgreSQL port.
    - name: DB_PORT
      value: "5432"
    # Database password sourced from the gesetze-normen-db-credentials secret.
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          key: password
          name: gesetze-normen-db-credentials
    # Database username sourced from the gesetze-normen-db-credentials secret.
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          key: username
          name: gesetze-normen-db-credentials
    # Maximum overflow connections beyond pool size.
    - name: DB_MAXOVERFLOW
      value: "10"
    # PostgreSQL connection pool size.
    - name: DB_POOLSIZE
      value: "15"
    # Internal URL of the PDF extraction service (inhaltsextraktion).
    - name: GCP_TEAM2PDFURL
      value: "<inhaltsextraktion-service-url>"
    # Log verbosity level (DEBUG, INFO, WARNING, ERROR).
    - name: LOG_LEVEL
      value: "INFO"
    # GCP project identifier for workload identity and bucket access.
    - name: GCP_GCPPROJECT
      value: "<gcp-project-id>"
    # GCP bucket for incoming PDF extraction data (team 2).
    - name: GCP_BUCKETTEAM2NAME
      value: "<gcp-bucket-team2>"
    # GCP bucket for legal reference database data (team 7).
    - name: GCP_BUCKETTEAM7NAME
      value: "<gcp-bucket-team7>"

  # --- gesetzesbegruendung-db-service ---
  # Legislative reasoning reference database.
  gesetzesbegruendung-db-service:
    image:
      repository: <container-registry>/begruendungen-db
      tag: "<image-tag>"
    extraEnv:
    # PostgreSQL host / pooler hostname.
    - name: DB_HOST
      value: "<postgresdb-host-gesetzesbegruendung>"
    # Database name.
    - name: DB_NAME
      value: "<postgresdb-name-gesetzesbegruendung>"
    # PostgreSQL port.
    - name: DB_PORT
      value: "5432"
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          key: password
          name: gesetzesbegruendung-db-credentials
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          key: username
          name: gesetzesbegruendung-db-credentials
    # LiteLLM proxy base URL.
    - name: CHUNKING_URL
      value: "<litellm-proxy-url>"
    # LiteLLM model name used for text chunking.
    - name: CHUNKING_MODEL
      value: "<llm-model-name>"
    # Token overlap between consecutive chunks.
    - name: CHUNKING_OVERLAP
      value: "256"
    # Chunking backend provider (e.g. litellm).
    - name: CHUNKING_PROVIDER
      value: "litellm"
    # Maximum number of tokens per chunk.
    - name: CHUNKING_SIZE
      value: "2048"
    # LiteLLM API key for chunking requests; sourced from a secret.
    - name: CHUNKING_APIKEY
      valueFrom:
        secretKeyRef:
          name: <chunking-llm-secret>
          key: master-key
    # Maximum overflow connections beyond pool size.
    - name: DB_MAXOVERFLOW
      value: "5"
    # PostgreSQL connection pool size.
    - name: DB_POOLSIZE
      value: "10"
    # Docling hostname.
    - name: DOCLING_HOST
      value: "<docling-host>"
    # Docling OCR engine (e.g. easyocr, tesseract).
    - name: DOCLING_OCR_ENGINE
      value: "easyocr"
    # Docling service port.
    - name: DOCLING_PORT
      value: "443"
    # Docling service protocol (http or https).
    - name: DOCLING_PROTOCOL
      value: "https"
    # Set to "true" to expose Prometheus metrics.
    - name: ENABLE_METRICS
      value: "true"
    # Internal URL of the gesetze-normen-db-service.
    - name: GESETZE_NORMEN_URL
      value: "<gesetze-normen-service-url>"
    # Keycloak token URL for Docling authentication.
    - name: KEYCLOAK_TOKEN_URL
      value: "<keycloak-token-url>"
    # Keycloak client ID for Docling authentication; sourced from a secret.
    - name: KEYCLOAK_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: <docling-keycloak-secret>
          key: KEYCLOAK_CLIENT_ID
    # Keycloak client secret for Docling authentication; sourced from a secret.
    - name: KEYCLOAK_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: <docling-keycloak-secret>
          key: KEYCLOAK_CLIENT_SECRET
    # Log verbosity level (DEBUG, INFO, WARNING, ERROR).
    - name: LOG_LEVEL
      value: "INFO"

