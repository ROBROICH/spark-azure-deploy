      value: "<postgresdb-host-jura>"
    # Database name.
    - name: DB_NAME
      value: "<postgresdb-name-jura>"
    # PostgreSQL port.
    - name: DB_PORT
      value: "5432"
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          key: password
          name: jura-db-credentials
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          key: username
          name: jura-db-credentials
    # LiteLLM proxy base URL.
    - name: CHUNKING_URL
      value: "<litellm-proxy-url>"
    # LiteLLM model name used for text chunking.
    - name: CHUNKING_MODEL
      value: "<llm-model-name>"
    # Token overlap between consecutive chunks.
    - name: CHUNKING_OVERLAP
      value: "256"
    # Chunking backend provider (e.g. litellm).
    - name: CHUNKING_PROVIDER
      value: "litellm"
    # Maximum number of tokens per chunk.
    - name: CHUNKING_SIZE
      value: "2048"
    # LiteLLM API key for chunking requests; sourced from a secret.
    - name: CHUNKING_APIKEY
      valueFrom:
        secretKeyRef:
          name: <chunking-llm-secret>
          key: master-key
    # Maximum overflow connections beyond pool size.
    - name: DB_MAXOVERFLOW
      value: "5"
    # PostgreSQL connection pool size.
    - name: DB_POOLSIZE
      value: "15"
    # Set to "true" to expose Prometheus metrics.
    - name: ENABLE_METRICS
      value: "true"
    # Internal URL of the gesetze-normen-db-service.
    - name: GESETZE_NORMEN_URL
      value: "<gesetze-normen-service-url>"
    # Log verbosity level (DEBUG, INFO, WARNING, ERROR).
    - name: LOG_LEVEL
      value: "INFO"

  # --- llm-client ---
  # LLM gateway client. Routes inference requests to configured model backends.
  llm-client:
    image:
      repository: <container-registry>/llm-client
      tag: "<image-tag>"
    extraEnv:
    # LiteLLM proxy base URL.
    - name: LITELLM_BASE_URL
      value: "<litellm-proxy-url>"
    # LiteLLM proxy master key; sourced from the litellm-proxy-credentials secret.
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          key: LITELLM_MASTER_KEY
          name: litellm-proxy-credentials-llm-custom
    # OpenTelemetry collector gRPC endpoint.
    - name: OTEL_ENDPOINT
      value: "<otel-endpoint>"
    # Temporal gRPC frontend host:port.
    - name: TEMPORAL_HOST
      value: "<temporal-host>"
    # S3 bucket name for Temporal workflow payload storage.
    - name: TEMPORAL_S3_BUCKET_NAME
      value: "temporal-payloads"
    # S3 endpoint URL for Temporal payload storage.
    - name: TEMPORAL_S3_ENDPOINT_URL
      value: "<object-storage-url>"
    # S3 access key for Temporal payload storage.
    - name: TEMPORAL_S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          key: TEMPORAL_S3_ACCESS_KEY_ID
          name: temporal-s3-secrets-llm-custom
    # S3 secret key for Temporal payload storage.
    - name: TEMPORAL_S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          key: TEMPORAL_S3_SECRET_ACCESS_KEY
