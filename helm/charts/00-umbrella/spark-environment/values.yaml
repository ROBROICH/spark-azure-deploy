    # Temporal gRPC frontend host:port.
    - name: TEMPORAL_HOST
      value: "<temporal-host>"
    # S3 bucket name for Temporal workflow payload storage.
    - name: TEMPORAL_S3_BUCKET_NAME
      value: "temporal-payloads"
    # S3 endpoint URL for Temporal payload storage.
    - name: TEMPORAL_S3_ENDPOINT_URL
