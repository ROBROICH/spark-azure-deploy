apiVersion: v2
name: frontend-services
description: Umbrella chart for SPARK Workflow frontend workloads
type: application
version: 0.3.0
appVersion: "1.0.0"
dependencies:
  - name: frontend
    version: "0.3.0"
    repository: "file://../../01-frontend/frontend"
    condition: frontend.enabled
  - name: prototype-demo
    version: "0.3.0"
    repository: "file://../../01-frontend/prototype-demo"
    condition: prototype-demo.enabled
  # Further instances of the frontend chart (off by default): the EWMS product
  # variant of the dashboard (same image, VITE_PRODUCT_MODE) and the user
  # handbook (static site, own image).
  - name: frontend
    alias: frontend-ewms
    version: "0.3.0"
    repository: "file://../../01-frontend/frontend"
    condition: frontend-ewms.enabled
  - name: frontend
    alias: handbuch
    version: "0.3.0"
    repository: "file://../../01-frontend/frontend"
    condition: handbuch.enabled
kubeVersion: ">=1.28.0-0"
home: https://gitlab.opencode.de/bmds/planungs-und-genehmigungsbeschleunigung/charts
sources:
  - https://gitlab.opencode.de/bmds/planungs-und-genehmigungsbeschleunigung/charts
