# =============================================================================
# backend-services — base values
# =============================================================================
#
# The backend layer of the SPARK Workflow platform:
#   - the spark-backend modulith, deployed as independently scaled pools
#     (one alias of 02-backend/spark-backend-pool per pool). All pools run the
#     same image with the same configuration; they differ in API_POOL,
#     ACTIVE_FEATURE_WORKER, replicas, resources and scaling.
#
# Pool defaults below set replicas, resources, workers and task queues.
# Features that need cluster add-ons or environment data are opt-in: KEDA
# ScaledObjects (keda.enabled; task queues are preset for
# agent-orchestration/document-management/project-logic), PodMonitoring, the
# deny-metrics policy, image pull secrets and secret refs. Environments set
# global.backend and enable those.
#
# =============================================================================
# global
# =============================================================================
#
# global.stage.name / global.labels.environment / global.env /
# global.extraEnv / global.namespaceOverride — as in every layer (see the
# spark-environment README).
#
# global.backend — everything the pools share; documented in
# 02-backend/spark-backend-pool/values.yaml. This umbrella additionally
# renders from it:
#   - ConfigMap global.backend.configMapName with global.backend.config
#     (values rendered with tpl), when config is non-empty;
#   - the Istio AuthorizationPolicy denying /metrics on the app port for
#     every pool, when global.backend.denyMetricsPolicy.enabled.
#
# =============================================================================

global:

  # Stage suffix appended to resource names. Leave empty for no suffix.
  stage:
    name: ''

  # "environment" pod label applied to all workloads.
  labels:
    environment: ''

  # Shared environment variables for every container in this layer.
  env: []

  # Additional shared environment variables merged after env.
  extraEnv: []

  # Default namespace for every subchart in this layer. A subchart's own
  # namespaceOverride (and, for the pools, global.backend.namespaceOverride)
  # takes precedence; a parent umbrella's global.namespaceOverride overrides
  # this layer default.
  namespaceOverride: backend-services

  # Shared backend settings — full reference in the spark-backend-pool chart.
  backend:
    namespaceOverride: ''
    configMapName: ''
    config: {}
    denyMetricsPolicy:
      enabled: false
      name: ''

