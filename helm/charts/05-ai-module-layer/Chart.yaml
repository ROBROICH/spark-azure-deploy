apiVersion: v2
name: ai-module-layer
description: >
  Umbrella for all AI (KI) processing modules.
  Each module is a separately configured instance of the shared temporal-worker
  chart. Use the alias as the values key to configure or enable/disable modules
  independently. All modules share the same Deployment/Service/HPA template;
  differences are expressed entirely through per-module values sections.
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  # ── Inhaltsextraktion ───────────────────────────────────────────────────────
  - name: temporal-worker
    version: "0.1.0"
    repository: "file://../sources/internal/05-modulcluster/temporal-worker"
    alias: inhaltsextraktion
    condition: inhaltsextraktion.enabled


  # ── Formale Vollständigkeitsprüfung ─────────────────────────────────────────
  - name: temporal-worker
    version: "0.1.0"
    repository: "file://../sources/internal/05-modulcluster/temporal-worker"
    alias: formale-vollstaendigkeitspruefung
    condition: formale-vollstaendigkeitspruefung.enabled

  # ── Plausibilitätsprüfung ───────────────────────────────────────────────────
  - name: temporal-worker
    version: "0.1.0"
    repository: "file://../sources/internal/05-modulcluster/temporal-worker"
    alias: plausibilitaetspruefung
    condition: plausibilitaetspruefung.enabled

  # ── Materielle Vollständigkeitsprüfung (Suche & Zuordnung) ──────────────────
  - name: temporal-worker
    version: "0.1.0"
    repository: "file://../sources/internal/05-modulcluster/temporal-worker"
    alias: materielle-vollstaendigkeitspruefung
    condition: materielle-vollstaendigkeitspruefung.enabled

  # ── Einwendungsmanagement ───────────────────────────────────────────────────
  - name: temporal-worker
    version: "0.1.0"
    repository: "file://../sources/internal/05-modulcluster/temporal-worker"
    alias: einwendungsmanagement
    condition: einwendungsmanagement.enabled

  # ── Rechtliche Prüfung und Bewertung ────────────────────────────────────────
  - name: temporal-worker
    version: "0.1.0"
    repository: "file://../sources/internal/05-modulcluster/temporal-worker"
    alias: rechtliche-pruefung-und-bewertung
    condition: rechtliche-pruefung-und-bewertung.enabled

  # ── Rechtsmethodik ──────────────────────────────────────────────────────────
  - name: temporal-worker
    version: "0.1.0"
    repository: "file://../sources/internal/05-modulcluster/temporal-worker"
    alias: rechtsmethodik
    condition: rechtsmethodik.enabled

  # ── Anonymisierung ──────────────────────────────────────────────────────────
  - name: temporal-worker
    version: "0.1.0"
    repository: "file://../sources/internal/05-modulcluster/temporal-worker"
    alias: anonymisierung
    condition: anonymisierung.enabled

  # ── Normenermittlung ────────────────────────────────────────────────────────
  - name: temporal-worker
    version: "0.1.0"
    repository: "file://../sources/internal/05-modulcluster/temporal-worker"
    alias: normenermittlung
    condition: normenermittlung.enabled

  # ── Risikohinweiser ─────────────────────────────────────────────────────────
  - name: temporal-worker
    version: "0.1.0"
    repository: "file://../sources/internal/05-modulcluster/temporal-worker"
    alias: risikohinweiser
    condition: risikohinweiser.enabled
