# =============================================================================
# 05-ai-module-layer — AI Processing Module Layer
# =============================================================================
# Deploys all AI processing modules as independently scalable Temporal workers.
# Every module is an instance of the shared temporal-worker source chart
# (sources/internal/temporal-worker), deployed via a separate dependency alias
# in Chart.yaml so that each produces its own Kubernetes Deployment and Service.
#
# Each module registers with the Temporal task queue declared in its TEMPORAL_TASK_QUEUE
# env var and consumes jobs dispatched by the agent-orchestration-service.
# Naming convention — Deployment name per module:
#   {release}-modul-{module}[-stage]
# nameOverride enforces this regardless of Helm alias or release name.
#
# Adding a new worker:
#   1. Declare a new temporal-worker dependency with a unique alias in Chart.yaml
#   2. Add a matching section below with enabled: true and all required config
#
# Module inventory:
#   inhaltsextraktion            Document content extraction (Docling, Qdrant, LLM)
#   formale-pruefung             Formal completeness check
#   plausibilitaetspruefung      Plausibility check and annotation
#   suche-und-zuordnung          Semantic search and norm assignment
#   einwendungsmanagement        Objection classification and routing
#   bewertung                    Legal assessment and evaluation
#   rechtsmethodik               Legal methodology analysis
#   anonymisierung               PII anonymisation for output documents
#   normenermittlung             Norm determination (vector search + LLM)
#   risikohinweiser              Risk identification and flagging
# =============================================================================

global:
  stage:
    name: ""
  labels:
    "spark-workflow.layer/name": ai-module-layer
  # Cluster-wide auth configuration (AUTH_*, TEMPORAL_JOB_SERVICE_URL) is
  # injected via global.extraEnv in 00-spark-workflow — when this layer is
  # installed standalone, supply that block in your install values.

  # ── Inhaltsextraktion ─────────────────────────────────────────────────────────
  # Document content extraction pipeline; uses Docling, Qdrant, LiteLLM.
inhaltsextraktion:
  enabled: true
  labels:
    "spark-workflow.group/name": inhaltsextraktion
  nameOverride: "modul-inhaltsextraktion"
  replicaCount: 2
  image:
    repository: "registry.opencode.de/oc000155419009/spark-workflow/modul-inhaltsextraktion"
    tag: "<image-tag>"
    pullPolicy: IfNotPresent
  # imagePullSecrets:          # Uncomment and set your registry pull secret name.
  #   - name: <registry-pull-secret>
  imagePullSecrets: []
  podLabels:
    app: inhaltsextraktion-backend
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      cpu: "4"
      memory: 16Gi
    requests:
      cpu: "2"
      memory: 6Gi
  containerPorts:
    - containerPort: 8001
      name: http
  service:
    enabled: true
    type: ClusterIP
    port: 80
    ports:
      - port: 80
        targetPort: 8001
        protocol: TCP
        name: http
  env:
    - name: LITELLM_BASE_URL
      value: <litellm-api-url>
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          key: master-key
          name: litellm-proxy-credentials
    # Model names route LLM activities to the llm-client task queue resolved
    # from the prefix (self-hosted/* -> llm-custom); see the llm-client chart.
    - name: VLLM_MODEL
      value: self-hosted/gpt-oss-120b
    - name: METADATA_MODEL_NAME
      value: self-hosted/gpt-oss-120b
    - name: SCHWERPUNKTTHEMA_MODEL_NAME
      value: self-hosted/gpt-oss-120b
    - name: SUMMARIZATION_MODEL_NAME
      value: self-hosted/gpt-oss-120b
    - name: VLM_SUMMARY_MODEL_NAME
      value: self-hosted/gpt-oss-120b
    - name: DMS_BASE_URL
      value: '{{ printf "http://%s-document-management-service%s.%s.svc.cluster.local" .Release.Name (include "temporal-worker.stageSuffix" .) .Release.Namespace }}'
    - name: UNO_HOST
      value: '{{ printf "%s-unoserver%s.%s.svc.cluster.local" .Release.Name (include "temporal-worker.stageSuffix" .) .Release.Namespace }}'
    # Prompt-injection detection on extracted content.
    - name: INJECTION_LLM_MODEL
      value: self-hosted/gpt-oss-120b
    - name: INJECTION_MODEL_URL
      value: "<prompt-injection-url>"
    - name: INJECTION_MODEL_TOKEN
      valueFrom:
        secretKeyRef:
          key: INJECTION_MODEL_TOKEN
          name: injection-model-secret
    - name: TEMPORAL_SERVER_URL
      value: '{{ printf "%s-temporal%s-frontend.%s.svc.cluster.local:7233" .Release.Name (include "temporal-worker.stageSuffix" .) .Release.Namespace }}'
    - name: TEMPORAL_S3_BUCKET_NAME
      value: <temporal-payloads-bucket>
    - name: TEMPORAL_S3_REGION
      value: <s3-region>
    - name: TEMPORAL_S3_ENDPOINT_URL
      value: <object-storage-url>
    - name: TEMPORAL_S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          key: TEMPORAL_S3_ACCESS_KEY_ID
          name: temporal-s3-secrets
    - name: TEMPORAL_S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          key: TEMPORAL_S3_SECRET_ACCESS_KEY
          name: temporal-s3-secrets
    - name: UNO_PORT
      value: "2003"
    - name: UNO_PROTOCOL
      value: http
    - name: QDRANT_BASE_URL
      value: '{{ printf "http://%s-qdrant%s.%s.svc.cluster.local:6333" .Release.Name (include "temporal-worker.stageSuffix" .) .Release.Namespace }}'
    - name: QDRANT_DENSE_VECTOR_SIZE
      value: "1024"
    - name: EMBEDDING_MODEL
      value: self-hosted/bge-m3
    - name: KEYCLOAK_TOKEN_URL
      value: <keycloak-oidc-token-url>
    - name: KEYCLOAK_CLIENT_ID
      valueFrom:
        secretKeyRef:
          key: KEYCLOAK_CLIENT_ID
          name: docling-keycloak-secrets
    - name: KEYCLOAK_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          key: KEYCLOAK_CLIENT_SECRET
          name: docling-keycloak-secrets
    - name: DOCLING_HOST
      value: '{{ printf "%s-docling-rq%s.%s.svc.cluster.local" .Release.Name (include "temporal-worker.stageSuffix" .) .Release.Namespace }}'
    - name: DOCLING_PORT
      value: "80"
    - name: DOCLING_PROTOCOL
      value: http
    - name: DOCLING_OCR_ENGINE
      value: easyocr
    - name: STRUCTURE_MODEL_NAME
      value: mistral-small-2506
    - name: SINGLE_DOCUMENT_WORKFLOW_CONCURRENCY
      value: "20"
    - name: SINGLE_DOCUMENT_EWMS_WORKFLOW_CONCURRENCY
      value: "20"
    - name: EXTRACTION_CHUNK_CONCURRENCY
      value: "1"
    - name: EXTRACTION_PROVIDER
      value: docling
    - name: OTEL_SERVICE_NAME
      value: inhaltsextraktion
    - name: OTEL_ENDPOINT
      value: <otel-collector-endpoint>

