# ── Anonymisierung ────────────────────────────────────────────────────────────
# PII anonymisation; uses Temporal S3 codec, Istio sidecar.
anonymisierung:
  enabled: true
  labels:
    "spark-workflow.group/name": anonymisierung
  nameOverride: "modul-anonymisierung"
  replicaCount: 2
  image:
    repository: "registry.opencode.de/oc000155419009/spark-workflow/modul-anonymisierung"
    tag: "<image-tag>"
    pullPolicy: Always
  # imagePullSecrets:          # Uncomment and set your registry pull secret name.
  #   - name: <registry-pull-secret>
  imagePullSecrets: []
  podAnnotations:
    proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
    sidecar.istio.io/rewriteAppHTTPProbers: "false"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      cpu: 1000m
      memory: 2048Mi
    requests:
      cpu: 350m
      memory: 1536Mi
  service:
    enabled: false
    type: ClusterIP
    port: 80
    ports: []
  env:
    # LLM-assisted PII detection (in addition to the rule-based pass).
    - name: LLM_ENABLED
      value: "true"
    - name: LLM_MODEL
      value: self-hosted/gpt-oss-120b
    # Parallel OCR jobs — size to the CPU allocation.
    - name: OCR_JOBS
      value: "2"
    - name: OTEL_ENDPOINT
      value: <otel-collector-host>
    - name: OTEL_SERVICE_NAME
      value: anonymisierung
    - name: TEMPORAL_HOST
      value: '{{ printf "%s-temporal%s-frontend.%s.svc.cluster.local:7233" .Release.Name (include "temporal-worker.stageSuffix" .) .Release.Namespace }}'
    - name: TEMPORAL_MAX_CONCURRENT_ACTIVITIES
      value: "2"
    - name: TEMPORAL_S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          key: TEMPORAL_S3_ACCESS_KEY_ID
          name: temporal-s3-secrets
    - name: TEMPORAL_S3_BUCKET_NAME
      value: <temporal-payloads-bucket>
    - name: TEMPORAL_S3_ENDPOINT_URL
      value: <https-endpoint-url>
    - name: TEMPORAL_S3_REGION
      value: <s3-region>
    - name: TEMPORAL_S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          key: TEMPORAL_S3_SECRET_ACCESS_KEY
          name: temporal-s3-secrets
    - name: TEMPORAL_THREAD_MAX_WORKERS
      value: "4"

# ── Normenermittlung ──────────────────────────────────────────────────────────
# Norm determination: resolves the norms applicable to a submission via vector
# search (Qdrant) and LLM reasoning. Pure Temporal worker — no HTTP API.
normenermittlung:
  enabled: true
  labels:
    "spark-workflow.group/name": normenermittlung
  nameOverride: "modul-normenermittlung"
  replicaCount: 2
  image:
    repository: "<container-registry>/norm-tbm-spec-module"
    tag: "<image-tag>"
    pullPolicy: IfNotPresent
  # imagePullSecrets:          # Uncomment and set your registry pull secret name.
  #   - name: <registry-pull-secret>
  imagePullSecrets: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      cpu: "2"
      memory: 5Gi
    requests:
      cpu: "1"
      memory: 2Gi
  service:
    enabled: false
    type: ClusterIP
    port: 80
    ports: []
  env:
    - name: TEMPORAL_HOST
      value: '{{ printf "%s-temporal%s-frontend.%s.svc.cluster.local:7233" .Release.Name (include "temporal-worker.stageSuffix" .) .Release.Namespace }}'
    - name: TEMPORAL_S3_BUCKET_NAME
      value: <temporal-payloads-bucket>
    - name: TEMPORAL_S3_ENDPOINT_URL
      value: <object-storage-url>
    - name: TEMPORAL_S3_REGION
      value: <s3-region>
    - name: TEMPORAL_S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          key: TEMPORAL_S3_ACCESS_KEY_ID
          name: temporal-s3-secrets
    - name: TEMPORAL_S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          key: TEMPORAL_S3_SECRET_ACCESS_KEY
          name: temporal-s3-secrets
    # Qdrant collections for norm retrieval.
    - name: QDRANT_URL
      value: '{{ printf "http://%s-qdrant%s.%s.svc.cluster.local:6333" .Release.Name (include "temporal-worker.stageSuffix" .) .Release.Namespace }}'
    - name: COLLECTION_NAME
      value: normermittler
    - name: CHUNK_COLLECTION_NAME
      value: data
    # Model prefixes route to the llm-client task queues (self-hosted/* -> llm-custom).
    - name: EMBEDDING_MODEL
      value: self-hosted/bge-m3
    - name: LLM_MODEL
      value: self-hosted/gpt-oss-120b
    - name: OTEL_SERVICE_NAME
      value: norm-tbm-spec-module
    - name: OTEL_ENDPOINT
      value: <otel-collector-host>

