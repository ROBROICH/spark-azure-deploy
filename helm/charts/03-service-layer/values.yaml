# =============================================================================
# 03-service-layer — Application Service Layer
# =============================================================================
# Deploys all backend microservices of the SPARK Workflow application.
# Services are grouped by functional domain. Each service is an independent
# Helm chart source located under sources/internal/02-backend/ or
# sources/internal/04-shared-services/, and communicates with peers over the
# in-cluster Kubernetes Service DNS.
#
# Service groups and their roles within this layer:
#
#   Workflow-Dienste        — Core workflow lifecycle management
#     project-logic-service         Projects, stages, and state transitions
#     temporal-job-service          HTTP bridge to Temporal task queues
#     document-management-service   File storage, metadata, pre-processing
#     agent-orchestration-service   AI agent dispatch and monitoring
#
#   Interaktionsdienste     — User interaction and participation
#     comment-service               Public comments on draft legislation
#     supplementary-requests-service  Supplementary-information requests
#     identity-management-service   User identity and OIDC integration
#     objections-management-service Public objection management
#
#   Integrationsdienste     — External system integrations
#     fpp-service                   Domain-specific examination sub-tasks
#     llm-client                    proxy for litellm tasks
#
#   Beschlussdienste        — Resolution and document production
#     administrative-file-draft     Administrative draft (Verwaltungsakt) composition
#
#   Datenbankdienste        — Legal knowledge base accessors
#     gesetze-normen-db-service     Legal norms database
#     jura-db-service               Legal case-law database
#     gesetzesbegruendung-db-service  Legislative justification database
#
#   Prüfungsdienste         — Examination and quality checks
#     formal-completeness-check     Formal completeness validation
#     plausibility-notes            AI-assisted plausibility annotations
#     examination-service           Multi-step examination coordination
#     protocol-service              Protocol and record generation
#     feedback-service              User feedback collection and routing
#     rechtsaenderungs-monitoring   Legal-change publication monitoring
#
# Global values are forwarded to all subcharts unchanged.
# =============================================================================

global:
  stage:
    name: ""
  labels:
    "spark-workflow.layer/name": service-layer
  # Cluster-wide auth configuration (AUTH_*, TEMPORAL_JOB_SERVICE_URL) is
  # injected via global.extraEnv in 00-spark-workflow — when this layer is
  # installed standalone, supply that block in your install values.

# ── Workflow-Dienste ──────────────────────────────────────────────────────────

# Service-to-service base URLs are set here under each service's extraEnv:
# block. These values are fully derived from Release.Name and Release.Namespace
# via inline tpl expressions.
#
# extraEnv (not env) is used deliberately: a layer-level env: list would
# REPLACE the source chart's env defaults wholesale (Helm list coalescing),
# wiping the chart's own required variables. extraEnv merges per variable
# name through the chart's containerEnv helper instead.
# Override at 00-spark-workflow level via:
#   service-layer.<service-name>.extraEnv:
#     - name: <ENV_VAR>
#       value: "https://custom-endpoint"

project-logic-service:
  enabled: true
  labels:
    "spark-workflow.group/name": workflow-dienste
  extraEnv:
    # Peer service addresses — resolved from Release.Name and Release.Namespace.
    - name: API__ADMINISTRATIVE_FILE_DRAFT_BASE_URL
      value: '{{ printf "http://%s-administrative-file-draft.%s.svc.cluster.local" .Release.Name .Release.Namespace }}'
    - name: API__DMS_BASE_URL
      value: '{{ printf "http://%s-document-management-service.%s.svc.cluster.local" .Release.Name .Release.Namespace }}'
    - name: API__EXAMINATION_BASE_URL
      value: '{{ printf "http://%s-examination-service.%s.svc.cluster.local" .Release.Name .Release.Namespace }}'
    - name: API__FCS_BASE_URL
      value: '{{ printf "http://%s-formal-completeness-check.%s.svc.cluster.local" .Release.Name .Release.Namespace }}'
    - name: API__OBJECTIONS_BASE_URL
      value: '{{ printf "http://%s-objections-management-service.%s.svc.cluster.local" .Release.Name .Release.Namespace }}'
    - name: API__PLAUSIBILITY_BASE_URL
      value: '{{ printf "http://%s-plausibility-notes.%s.svc.cluster.local" .Release.Name .Release.Namespace }}'
    - name: API__PLS_BASE_URL
      value: '{{ printf "http://%s-project-logic-service.%s.svc.cluster.local" .Release.Name .Release.Namespace }}'

temporal-job-service:
  enabled: true
  labels:
    "spark-workflow.group/name": workflow-dienste

document-management-service:
