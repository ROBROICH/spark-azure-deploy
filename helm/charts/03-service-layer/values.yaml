    value: "<litellm-proxy-url>"
  # LiteLLM proxy master key; sourced from the litellm-proxy-credentials secret.
  - name: LITELLM_MASTER_KEY
    valueFrom:
      secretKeyRef:
        key: LITELLM_MASTER_KEY
        name: litellm-proxy-credentials-llm-custom