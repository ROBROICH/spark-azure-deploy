apiVersion: v2
name: service-layer
description: >
  Service Layer umbrella. Contains all service charts as direct dependencies,
  grouped by their architectural section (grey box) from the SPARK Workflow
  diagram. Each group and individual service can be toggled via conditions.
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:

  # ── Workflow-Dienste ────────────────────────────────────────────────────────
  - name: project-logic-service
    version: "0.1.0"
    repository: "file://../sources/internal/02-backend/project-logic-service"
    condition: project-logic-service.enabled

  - name: temporal-job-service
    version: "0.1.0"
    repository: "file://../sources/internal/02-backend/temporal-job-service"
    condition: temporal-job-service.enabled

  - name: document-management-service
    version: "0.1.0"
    repository: "file://../sources/internal/02-backend/document-management-service"
    condition: document-management-service.enabled

  - name: agent-orchestration-service
    version: "0.1.0"
    repository: "file://../sources/internal/02-backend/agent-orchestration-service"
    condition: agent-orchestration-service.enabled

  - name: protocol-service
    version: "0.1.0"
    repository: "file://../sources/internal/02-backend/protocol-service"
    condition: protocol-service.enabled

  # ── Interaktionsdienste ─────────────────────────────────────────────────────
  - name: comment-service
    version: "0.1.0"
    repository: "file://../sources/internal/02-backend/comment-service"
    condition: comment-service.enabled

  - name: supplementary-requests-service
    version: "0.1.0"
    repository: "file://../sources/internal/02-backend/supplementary-requests-service"
    condition: supplementary-requests-service.enabled

  - name: identity-management-service
    version: "0.1.0"
    repository: "file://../sources/internal/02-backend/identity-management-service"
    condition: identity-management-service.enabled

  - name: objections-management-service
    version: "0.1.0"
    repository: "file://../sources/internal/02-backend/objections-management-service"
    condition: objections-management-service.enabled

  - name: feedback-service
    version: "0.1.0"
    repository: "file://../sources/internal/02-backend/feedback-service"
    condition: feedback-service.enabled

  # ── Integrationsdienste ─────────────────────────────────────────────────────
  - name: fpp-service
    version: "0.1.0"
    repository: "file://../sources/internal/02-backend/fpp-service"
    condition: fpp-service.enabled

  - name: llm-client
    version: "0.1.0"
    repository: "file://../sources/internal/04-shared-services/llm-client"
    condition: llm-client.enabled

  # ── Beschlussdienste ────────────────────────────────────────────────────────
  - name: administrative-file-draft
    version: "0.1.0"
    repository: "file://../sources/internal/02-backend/administrative-file-draft"
    condition: administrative-file-draft.enabled

  # ── Datenbankdienste ────────────────────────────────────────────────────────
  - name: gesetze-normen-db-service
    version: "0.1.0"
    repository: "file://../sources/internal/04-shared-services/gesetze-normen-db-service"
    condition: gesetze-normen-db-service.enabled

  - name: jura-db-service
    version: "0.1.0"
    repository: "file://../sources/internal/04-shared-services/jura-db-service"
    condition: jura-db-service.enabled

  - name: gesetzesbegruendung-db-service
    version: "0.1.0"
    repository: "file://../sources/internal/04-shared-services/gesetzesbegruendung-db-service"
    condition: gesetzesbegruendung-db-service.enabled

  # ── Prüfungsdienste ─────────────────────────────────────────────────────────
  - name: formal-completeness-check
    version: "0.1.0"
    repository: "file://../sources/internal/02-backend/formal-completeness-check"
    condition: formal-completeness-check.enabled

  - name: plausibility-notes
    version: "0.1.0"
    repository: "file://../sources/internal/02-backend/plausibility-notes"
    condition: plausibility-notes.enabled

  - name: examination-service
    version: "0.1.0"
    repository: "file://../sources/internal/02-backend/examination-service"
    condition: examination-service.enabled

  - name: rechtsaenderungs-monitoring
    version: "0.1.0"
    repository: "file://../sources/internal/04-shared-services/rechtsaenderungs-monitoring"
    condition: rechtsaenderungs-monitoring.enabled
