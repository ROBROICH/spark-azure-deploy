# =============================================================================
# temporal-worker — Generic Temporal worker chart
# =============================================================================
# Single reusable base chart for background Temporal task-queue consumers.
# All instance-specific configuration is supplied via values — image, replicas,
# env vars, resources.
#
# Deploy multiple instances of this chart by declaring separate dependencies
# with unique aliases in the parent umbrella's Chart.yaml, and adding a
# matching keyed section in the umbrella's values.yaml.
#
# nameOverride controls the Kubernetes resource name prefix; set it to preserve
# a well-known deployment name regardless of the Helm release or alias.
# =============================================================================

# Desired pod replicas when autoscaling.enabled is false.
replicaCount: 1

# Container image. tag defaults to Chart.appVersion when empty.
image:
  repository: "<container-registry>/<image>"
  tag: "<image-tag>"
  pullPolicy: Always

# Pull secrets for private registries.
# imagePullSecrets:          # Uncomment and set your registry pull secret name.
#   - name: <registry-pull-secret>
imagePullSecrets: []

# Override chart name used in labels and resource names.
# Set to "modul-<name>" in the umbrella to preserve legacy resource naming.
nameOverride: ''

# Override the fully qualified resource name.
# When set, stage suffix is not appended.
fullnameOverride: ''

# Target Kubernetes namespace. Empty → Release.Namespace (set by helm -n).
namespaceOverride: ''

# Stage suffix appended to resource names (e.g. "-dev").
# Propagated automatically via global.stage.name from the umbrella chart.
stage:
  name: ''

# Service classification labels.
labels:
  app.kubernetes.io/component: agent

# Container ports (list). Most workers are background consumers with no exposed port.
containerPorts: []

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ''

# Pod-level annotations (map). Used for Istio sidecar configuration.
# Extra annotations on the Deployment/resource metadata (map).
annotations: {}

podAnnotations: {}

# Extra labels on the pod template (map).
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Service exposure. Disabled by default — most workers are background consumers.
service:
  enabled: false
  type: ClusterIP
  port: 80
  ports: []
  selector: {}

ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts: []
  tls: []

# CPU/memory requests and limits. Set per-module in the umbrella values.
resources: {}

# Base environment variables. Extend per-module via the umbrella values.
env: []

# Extra environment variables merged after env (higher precedence).
extraEnv: []

startupProbe: {}
livenessProbe: {}
readinessProbe: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
