{{- if ((.Values.worker | default dict).enabled) -}}
{{- $workerName := printf "%s-worker" (include "gesetze-normen-db-service.fullname" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $workerName }}
  namespace: {{ include "gesetze-normen-db-service.namespace" . }}
  labels:
    helm.sh/chart: {{ include "gesetze-normen-db-service.chart" . }}
    app.kubernetes.io/name: {{ include "gesetze-normen-db-service.name" . }}
    app.kubernetes.io/instance: {{ $workerName }}
    app.kubernetes.io/component: worker
    {{- if .Chart.AppVersion }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    {{- end }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- $l := .Values.labels | default dict -}}
    {{- if $l.type }}
    type: {{ $l.type | quote }}
    {{- end }}
    {{- $environment := include "gesetze-normen-db-service.environmentLabel" . -}}
    {{- if $environment }}
    environment: {{ $environment | quote }}
    {{- end }}
    {{- $gl := (.Values.global | default dict).labels | default dict -}}
    {{- $l2 := .Values.labels | default dict -}}
    {{- $extra := merge (deepCopy $l2) $gl -}}
    {{- $env2 := include "gesetze-normen-db-service.environmentLabel" . -}}
    {{- if $env2 }}{{- $_ := set $extra "environment" $env2 -}}{{- end }}
    {{- if $extra }}
    {{ toYaml $extra | trim | nindent 4 }}
    {{- end }}
  {{- with include "gesetze-normen-db-service.mergedAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ (.Values.worker).replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gesetze-normen-db-service.name" . }}
      app.kubernetes.io/instance: {{ $workerName }}
  template:
    metadata:
      {{- with include "gesetze-normen-db-service.mergedPodAnnotations" . }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
      labels:
        helm.sh/chart: {{ include "gesetze-normen-db-service.chart" . }}
        app.kubernetes.io/name: {{ include "gesetze-normen-db-service.name" . }}
        app.kubernetes.io/instance: {{ $workerName }}
        app.kubernetes.io/component: worker
        {{- if .Chart.AppVersion }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        {{- end }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        {{- if $l.type }}
        type: {{ $l.type | quote }}
        {{- end }}
        {{- if $environment }}
        environment: {{ $environment | quote }}
        {{- end }}
        {{- $gl2 := (.Values.global | default dict).labels | default dict -}}
        {{- $lp  := .Values.labels | default dict -}}
        {{- $xtra := merge (deepCopy $lp) $gl2 -}}
        {{- $envp := include "gesetze-normen-db-service.environmentLabel" . -}}
        {{- if $envp }}{{- $_ := set $xtra "environment" $envp -}}{{- end }}
        {{- if $xtra }}
        {{ toYaml $xtra | trim | nindent 8 }}
        {{- end }}
        {{- with include "gesetze-normen-db-service.mergedPodLabels" . }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gesetze-normen-db-service.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with (.Values.worker).command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (.Values.worker).args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with include "gesetze-normen-db-service.containerEnv" . }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with (.Values.worker).resources | default .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
