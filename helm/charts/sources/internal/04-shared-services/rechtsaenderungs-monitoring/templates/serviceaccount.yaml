{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rechtsaenderungs-monitoring.serviceAccountName" . }}
  namespace: {{ include "rechtsaenderungs-monitoring.namespace" . }}
  labels:
    {{- include "rechtsaenderungs-monitoring.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
