# =============================================================================
# project-logic-service
# Core project-lifecycle logic: creates, updates, and progresses projects through the SPARK workflow stages.
# =============================================================================

# Desired pod replicas when autoscaling.enabled is false.

replicaCount: 1

# Container image. If tag is empty, Chart.appVersion is used.
image:
  repository: "registry.opencode.de/bmds/planungs-und-genehmigungsbeschleunigung/spark-workflow/project-logic-service"
  tag: "v0.2.1"
  pullPolicy: Always

# Pull secrets for private registries (list).

# imagePullSecrets:          # Uncomment and set your registry pull secret name.
#   - name: <registry-pull-secret>
imagePullSecrets: []

# Override chart name used in labels.

nameOverride: ''

# Override fully qualified resource name.

fullnameOverride: ''

# Namespace override. Empty → uses the release namespace (-n flag).

namespaceOverride: ''

# Stage suffix for resource names (e.g. "dev" → resource-dev). Propagated from global.stage.name; set explicitly for standalone installs.

stage:
  name: ''

# Classification labels applied to all resources.
# app.kubernetes.io/component: workload category (frontend | backend | agent)
# environment: propagated from global.labels.environment; set explicitly only for standalone installs.

labels:
  app.kubernetes.io/component: backend

# Container ports (list).

containerPorts:
- containerPort: 8000
  name: http

# ServiceAccount for the pod (map).
serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ''

# Extra annotations on the pod template (map).

# Extra annotations on the Deployment/resource metadata (map).
annotations: {}

podAnnotations: {}

# Extra labels added to the pod template (map). Pod selectors are set by the
# chart templates using Kubernetes recommended labels (app.kubernetes.io/name,
# app.kubernetes.io/instance) and must not be overridden here.

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
# Service exposure (map). Selector is set by templates (app.kubernetes.io/name + instance).
service:
  enabled: true
  type: ClusterIP
  port: 80
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
  selector: {}

# Ingress (map). Set enabled: true to render.
ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts: []
  tls: []

# CPU/memory requests and limits (map). Use {} when unset.

resources:
  limits:
    cpu: 600m
    memory: 640Mi
  requests:
    cpu: 180m
    memory: 384Mi

# Base environment variables injected into the container (list of EnvVar objects).
# These apply in every stage. Do not set variables to empty string — omit them
# or use a placeholder (<postgresdb-host>, …) until the real value is known.
# Variables from global.env are merged before this list; this list takes
# precedence on name collisions.
env:
  # Browser origins allowed by the service's CORS middleware.
  - name: PROJECT_LOGIC_SERVICE_CORS_ORIGINS
    value: <cors-origins>
  - name: API__PLS_BASE_URL
    value: '{{ printf "http://%s-project-logic-service%s.%s.svc.cluster.local" .Release.Name (include "project-logic-service.stageSuffix" .) .Release.Namespace }}'
  - name: API__PLAUSIBILITY_BASE_URL
    value: '{{ printf "http://%s-plausibility-notes%s.%s.svc.cluster.local" .Release.Name (include "project-logic-service.stageSuffix" .) .Release.Namespace }}'
  - name: API__OBJECTIONS_BASE_URL
    value: '{{ printf "http://%s-objections-management-service%s.%s.svc.cluster.local" .Release.Name (include "project-logic-service.stageSuffix" .) .Release.Namespace }}'
  - name: API__FCS_BASE_URL
    value: '{{ printf "http://%s-formal-completeness-check%s.%s.svc.cluster.local" .Release.Name (include "project-logic-service.stageSuffix" .) .Release.Namespace }}'
  - name: API__EXAMINATION_BASE_URL
    value: '{{ printf "http://%s-examination-service%s.%s.svc.cluster.local" .Release.Name (include "project-logic-service.stageSuffix" .) .Release.Namespace }}'
  - name: API__DMS_BASE_URL
    value: '{{ printf "http://%s-document-management-service%s.%s.svc.cluster.local" .Release.Name (include "project-logic-service.stageSuffix" .) .Release.Namespace }}'
  - name: API__ADMINISTRATIVE_FILE_DRAFT_BASE_URL
    value: '{{ printf "http://%s-administrative-file-draft%s.%s.svc.cluster.local" .Release.Name (include "project-logic-service.stageSuffix" .) .Release.Namespace }}'
  - name: OTEL_ENDPOINT
    value: <otel-collector-host>
  - name: OTEL_SERVICE_NAME
    value: orchestrator
  - name: SERVICE_NAME
    value: project-logic-service
  - name: TEMPORAL__HOST
    value: '{{ printf "%s-temporal%s-frontend.%s.svc.cluster.local:7233" .Release.Name (include "project-logic-service.stageSuffix" .) .Release.Namespace }}'
  - name: TEMPORAL__NAMESPACE
    value: default
  - name: TEMPORAL__S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        key: TEMPORAL_S3_ACCESS_KEY_ID
        name: agent-orchestration-temporal-s3-secrets
  - name: TEMPORAL__S3_BUCKET_NAME
    value: '<temporal-payloads-bucket>'
  - name: TEMPORAL__S3_ENDPOINT_URL
    value: <https-endpoint-url>
  - name: TEMPORAL__S3_REGION
    value: <s3-region>
  - name: TEMPORAL__S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        key: TEMPORAL_S3_SECRET_ACCESS_KEY
        name: agent-orchestration-temporal-s3-secrets
  - name: TEMPORAL__TASK_QUEUE
    value: project_logic_service

  # ── PostgreSQL (CNPG cluster via transaction pooler) ──────────────────────
  # DB_HOST format: {cluster-name}-pooler-rw.{cluster-namespace}.svc.cluster.local
  - name: DB_HOST
    value: ""
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    value: "project-logic-db"
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: project-logic-db-user
        key: username
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: project-logic-db-user
        key: password

  # Additional environment variables merged after env (list of EnvVar objects).
  # Use for stage-specific values: image-specific settings, feature flags, or
  # values that differ between dev / test / prod. This list takes precedence
  # over global.extraEnv on name collisions.
  #
  # In-cluster HTTP peer URLs use a Helm printf template so the address follows
  # the release name, stage suffix, and namespace automatically.
  #
  # Temporal-job-service base URL — required by the application settings.
  - name: TEMPORAL_JOB_SERVICE_URL
    value: '{{ printf "http://%s-temporal-job-service%s.%s.svc.cluster.local" .Release.Name (include "project-logic-service.stageSuffix" .) .Release.Namespace }}'

extraEnv: []

# Startup probe (map). Use {} when unset.

startupProbe:
  failureThreshold: 6
  httpGet:
    path: /startup
    port: 8000
  periodSeconds: 10

# Liveness probe (map). Use {} when unset.

livenessProbe:
  failureThreshold: 3
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# Readiness probe (map). Use {} when unset.

readinessProbe:
  failureThreshold: 3
  httpGet:
    path: /ready
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# HorizontalPodAutoscaler (map).

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Pod volumes (list).

volumes: []

# Container volume mounts (list).

volumeMounts: []

# Node selector (map).

nodeSelector: {}

# Pod tolerations (list).

tolerations: []

# Pod affinity rules (map).

affinity: {}
