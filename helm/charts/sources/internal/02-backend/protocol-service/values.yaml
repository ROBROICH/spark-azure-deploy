# =============================================================================
# protocol-service
# Produces and archives examination protocols and decision records.
# =============================================================================

# Desired pod replicas when autoscaling.enabled is false.

replicaCount: 2

# Container image. If tag is empty, Chart.appVersion is used.
image:
  repository: "registry.opencode.de/oc000155419009/spark-workflow/protocol-service"
  tag: "<image-tag>"
  pullPolicy: Always

# Pull secrets for private registries (list).

# imagePullSecrets:          # Uncomment and set your registry pull secret name.
#   - name: <registry-pull-secret>
imagePullSecrets: []

# Override chart name used in labels.

nameOverride: ''

# Override fully qualified resource name.

fullnameOverride: ''

# Namespace override. Empty → uses the release namespace (-n flag).

namespaceOverride: ''

# Stage suffix for resource names (e.g. "dev" → resource-dev). Propagated from global.stage.name; set explicitly for standalone installs.

stage:
  name: ''

# Classification labels applied to all resources.
# app.kubernetes.io/component: workload category (frontend | backend | agent)
# environment: propagated from global.labels.environment; set explicitly only for standalone installs.

labels:
  app.kubernetes.io/component: backend

# Container ports (list).

containerPorts:
  - containerPort: 8000
    name: http

# ServiceAccount for the pod (map).
serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ''

# Extra annotations on the pod template (map).

# Extra annotations on the Deployment/resource metadata (map).
annotations: {}

podAnnotations: {}

# Extra labels added to the pod template (map). Pod selectors are set by the
# chart templates using Kubernetes recommended labels (app.kubernetes.io/name,
# app.kubernetes.io/instance) and must not be overridden here.

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Service exposure (map). Selector is set by templates (app.kubernetes.io/name + instance).
service:
  enabled: true
  type: ClusterIP
  port: 80
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector: {}

# Ingress (map). Set enabled: true to render.
ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts: []
  tls: []

# CPU/memory requests and limits (map). Use {} when unset.

resources:
  limits:
    cpu: 100m
    memory: 192Mi
  requests:
    cpu: 20m
    memory: 128Mi

# Base environment variables injected into the container (list of EnvVar objects).
# These apply in every stage. Do not set variables to empty string — omit them
# or use a placeholder (<postgresdb-host>, …) until the real value is known.
# Variables from global.env are merged before this list; this list takes
# precedence on name collisions.
env:
  # ── PostgreSQL source databases (all via the same CNPG transaction pooler) ─
  # protocol-service is a read-only consumer of multiple service databases;
  # it has no database of its own.
  # POOLER_HOST format: {cluster-name}-pooler-rw.{cluster-namespace}.svc.cluster.local

  # Source DB: project_logic_service
  - name: PROJECT_LOGIC_DB_HOST
    value: ""
  - name: PROJECT_LOGIC_DB_PORT
    value: "5432"
  - name: PROJECT_LOGIC_DB_NAME
    value: "project-logic-db"
  - name: PROJECT_LOGIC_DB_USER
    valueFrom:
      secretKeyRef:
        name: project-logic-db-user
        key: username
  - name: PROJECT_LOGIC_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: project-logic-db-user
        key: password

  # Source DB: formal_completeness_check
  - name: FORMAL_COMPLETENESS_DB_HOST
    value: ""
  - name: FORMAL_COMPLETENESS_DB_PORT
    value: "5432"
  - name: FORMAL_COMPLETENESS_DB_NAME
    value: "fcs-db"
  - name: FORMAL_COMPLETENESS_DB_USER
    valueFrom:
      secretKeyRef:
        name: formal-check-db-user
        key: username
  - name: FORMAL_COMPLETENESS_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: formal-check-db-user
        key: password

  # Source DB: comment_service
  - name: COMMENT_DB_HOST
    value: ""
  - name: COMMENT_DB_PORT
    value: "5432"
  - name: COMMENT_DB_NAME
    value: "comment-service-db"
  - name: COMMENT_DB_USER
    valueFrom:
      secretKeyRef:
        name: comment-service-db-user
        key: username
  - name: COMMENT_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: comment-service-db-user
        key: password

  # Source DB: supplementary_requests_service
  - name: SUPPLEMENTARY_DB_HOST
    value: ""
  - name: SUPPLEMENTARY_DB_PORT
    value: "5432"
  - name: SUPPLEMENTARY_DB_NAME
    value: "supplementary-requests-db"
  - name: SUPPLEMENTARY_DB_USER
    valueFrom:
      secretKeyRef:
        name: supplementary-requests-db-user
        key: username
  - name: SUPPLEMENTARY_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: supplementary-requests-db-user
        key: password

  # Source DB: plausibility_notes
  - name: PLAUSIBILITY_DB_HOST
    value: ""
  - name: PLAUSIBILITY_DB_PORT
    value: "5432"
  - name: PLAUSIBILITY_DB_NAME
    value: "plausibility-notes-db"
  - name: PLAUSIBILITY_DB_USER
    valueFrom:
      secretKeyRef:
        name: plausibility-notes-db-user
        key: username
  - name: PLAUSIBILITY_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: plausibility-notes-db-user
        key: password

  # Source DB: document_management_service
  - name: DOCUMENT_MANAGEMENT_DB_HOST
    value: ""
  - name: DOCUMENT_MANAGEMENT_DB_PORT
    value: "5432"
  - name: DOCUMENT_MANAGEMENT_DB_NAME
    value: "dms-db"
  - name: DOCUMENT_MANAGEMENT_DB_USER
    valueFrom:
      secretKeyRef:
        name: dms-db-user
        key: username
  - name: DOCUMENT_MANAGEMENT_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: dms-db-user
        key: password

  # Source DB: administrative_file_draft
  - name: ADMINISTRATIVE_DRAFT_DB_HOST
    value: ""
  - name: ADMINISTRATIVE_DRAFT_DB_PORT
    value: "5432"
  - name: ADMINISTRATIVE_DRAFT_DB_NAME
    value: "administrative-file-draft-db"
  - name: ADMINISTRATIVE_DRAFT_DB_USER
    valueFrom:
      secretKeyRef:
        name: admin-file-draft-db-user
        key: username
  - name: ADMINISTRATIVE_DRAFT_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: admin-file-draft-db-user
        key: password

  # Source DB: examination_service
  - name: EXAMINATION_DB_HOST
    value: ""
  - name: EXAMINATION_DB_PORT
    value: "5432"
  - name: EXAMINATION_DB_NAME
    value: "examination"
  - name: EXAMINATION_DB_USER
    valueFrom:
      secretKeyRef:
        name: examination-db-user
        key: username
  - name: EXAMINATION_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: examination-db-user
        key: password

  # Source DB: objections_management_service
  - name: OBJECTIONS_MANAGEMENT_DB_HOST
    value: ""
  - name: OBJECTIONS_MANAGEMENT_DB_PORT
    value: "5432"
  - name: OBJECTIONS_MANAGEMENT_DB_NAME
    value: "objections_management_service"
  - name: OBJECTIONS_MANAGEMENT_DB_USER
    valueFrom:
      secretKeyRef:
        name: objections-service-db-user
        key: username
  - name: OBJECTIONS_MANAGEMENT_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: objections-service-db-user
        key: password

  # Browser origins allowed by the service's CORS middleware.
  - name: PROTOCOL_SERVICE_CORS_ORIGINS
    value: <cors-origins>

  # Temporal-job-service base URL — required by the application settings.
  - name: TEMPORAL_JOB_SERVICE_URL
    value: '{{ printf "http://%s-temporal-job-service%s.%s.svc.cluster.local" .Release.Name (include "protocol-service.stageSuffix" .) .Release.Namespace }}'

# Additional environment variables merged after env (list of EnvVar objects).
# Use for stage-specific values: image-specific settings, feature flags, or
# values that differ between dev / test / prod. This list takes precedence
# over global.extraEnv on name collisions.
#
# In-cluster HTTP peer URLs use a Helm printf template so the address follows
# the release name, stage suffix, and namespace automatically.

extraEnv: []

# Startup probe (map). Use {} when unset.

startupProbe:
  failureThreshold: 6
  httpGet:
    path: /startup
    port: 8000
  periodSeconds: 10

# Liveness probe (map). Use {} when unset.

livenessProbe:
  failureThreshold: 3
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# Readiness probe (map). Use {} when unset.

readinessProbe:
  failureThreshold: 3
  httpGet:
    path: /ready
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# HorizontalPodAutoscaler (map).

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Pod volumes (list).

volumes: []

# Container volume mounts (list).

volumeMounts: []

# Node selector (map).

nodeSelector: {}

# Pod tolerations (list).

tolerations: []

# Pod affinity rules (map).

affinity: {}
