# =============================================================================
# temporal-job-service
# HTTP entry-point for triggering and querying Temporal workflow jobs; bridges REST calls to the Temporal task queue.
# =============================================================================

# Desired pod replicas when autoscaling.enabled is false.

replicaCount: 1

# Container image. If tag is empty, Chart.appVersion is used.
image:
  repository: "registry.opencode.de/oc000155419009/spark-workflow/temporal-jobs-module"
  tag: "<image-tag>"
  pullPolicy: Always

# Pull secrets for private registries (list).

# imagePullSecrets:          # Uncomment and set your registry pull secret name.
#   - name: <registry-pull-secret>
imagePullSecrets: []

# Override chart name used in labels.

nameOverride: ''

# Override fully qualified resource name.

fullnameOverride: ''

# Namespace override. Empty → uses the release namespace (-n flag).

namespaceOverride: ''

# Stage suffix for resource names (e.g. "dev" → resource-dev). Propagated from global.stage.name; set explicitly for standalone installs.

stage:
  name: ''

# Classification labels applied to all resources.
# app.kubernetes.io/component: workload category (frontend | backend | agent)
# environment: propagated from global.labels.environment; set explicitly only for standalone installs.

labels:
  app.kubernetes.io/component: backend

# Container ports (list).

containerPorts:
- containerPort: 8000

# ServiceAccount for the pod (map).
serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ''

# Extra annotations on the pod template (map).

# Extra annotations on the Deployment/resource metadata (map).
annotations: {}

podAnnotations: {}

# Extra labels added to the pod template (map). Pod selectors are set by the
# chart templates using Kubernetes recommended labels (app.kubernetes.io/name,
# app.kubernetes.io/instance) and must not be overridden here.

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
      
# Service exposure (map). Selector is set by templates (app.kubernetes.io/name + instance).
service:
  enabled: true
  type: ClusterIP
  port: 80
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
  selector: {}

# Ingress (map). Set enabled: true to render.
ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts: []
  tls: []

# CPU/memory requests and limits (map). Use {} when unset.

resources:
  limits:
    cpu: 150m
    memory: 320Mi
  requests:
    cpu: 30m
    memory: 160Mi

# Base environment variables injected into the container (list of EnvVar objects).
# These apply in every stage. Do not set variables to empty string — omit them
# or use a placeholder (<postgresdb-host>, …) until the real value is known.
# Variables from global.env are merged before this list; this list takes
# precedence on name collisions.
env:
# ── Temporal workflow engine ─────────────────────────────────────────────────
# TEMPORAL_ADDRESS format: {release}-temporal{stage}-frontend.{namespace}.svc.cluster.local:7233
- name: TEMPORAL_ADDRESS
  value: '{{ printf "%s-temporal%s-frontend.%s.svc.cluster.local:7233" .Release.Name (include "temporal-job-service.stageSuffix" .) .Release.Namespace }}'
- name: TEMPORAL__HOST
  value: '{{ printf "%s-temporal%s-frontend.%s.svc.cluster.local:7233" .Release.Name (include "temporal-job-service.stageSuffix" .) .Release.Namespace }}'
- name: TEMPORAL_NAMESPACE
  value: default
- name: TEMPORAL__TASK_QUEUE
  value: temporal-job-service
# S3 offload for large Temporal payloads + the archival bucket for
# completed-workflow payload retention.
- name: TEMPORAL__S3_BUCKET_NAME
  value: <temporal-payloads-bucket>
- name: TEMPORAL__S3_ARCHIVAL_BUCKET_NAME
  value: <temporal-archival-bucket>
- name: TEMPORAL__S3_ENDPOINT_URL
  value: <object-storage-url>
- name: TEMPORAL__S3_REGION
  value: <s3-region>
- name: TEMPORAL__S3_ACCESS_KEY_ID
  valueFrom:
    secretKeyRef:
      name: temporal-s3-secrets
      key: TEMPORAL_S3_ACCESS_KEY_ID
- name: TEMPORAL__S3_SECRET_ACCESS_KEY
  valueFrom:
    secretKeyRef:
      name: temporal-s3-secrets
      key: TEMPORAL_S3_SECRET_ACCESS_KEY

- name: DB__HOST
  value: ""
- name: DB__NAME
  value: "temporal-job-service-db"
- name: DB__USER
  valueFrom:
    secretKeyRef:
      name: temporal-job-service-db-user
      key: username
- name: DB__PASSWORD
  valueFrom:
    secretKeyRef:
      name: temporal-job-service-db-user
      key: password

# ── System load budgeting ──────────────────────────────────────────────────
# Per-workflow-type complexity weights used to throttle concurrent workflow
# starts against the cluster's processing capacity.
- name: WORKFLOW_COMPLEXITY
  value: '{"FVPWorkflow":5900,"bewertung":130,"suche_zuordnung_norm":50,"BatchMVPWorkflow":800,"process-documents-workflow":900,"single-document-workflow":45,"chunk-metadata-workflow":15,"InhaltsverzeichnisMatchingWorkflow":121,"InhaltsverzeichnisFinderWorkflow":121,"LLMMatchingWorkflow":51,"llm-matching-single-document":2.5,"PlausibilityMainOrchestratorWorkflow":4000,"ClaimExtractionOrchestratorWorkflow":4000,"ClaimExtractionSingleDocumentWorkflow":200,"ClaimExtractionBatchWorkflow":5,"PlausibilityCheckOrchestratorWorkflow":3400,"PlausibilityCheckSingleDocumentWorkflow":170,"PlausibilityScreeningContextBatchWorkflow":13,"ProcessBewertungenWorkflow":80,"bewertungs_workflow":16,"MicroBuilderWorkflow":16,"PlannerWorkflow":13,"WriterWorkflow":11,"satz_orchestrator":300,"tbm_db_research":2,"match_single_tbm":15,"pageindex_svm":8,"MVPWorkflow":1400,"RechtsmethodikWorkflow":800}'
- name: MAX_SYSTEM_COMPLEXITY
  value: "22584.5"
- name: DEFAULT_WORKFLOW_COMPLEXITY_WEIGHT
  value: "3"

extraEnv: []

# Startup probe (map). Use {} when unset.

startupProbe:
  failureThreshold: 6
  httpGet:
    path: /startup
    port: 8000
  periodSeconds: 10

# Liveness probe (map). Use {} when unset.

livenessProbe:
  failureThreshold: 3
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# Readiness probe (map). Use {} when unset.

readinessProbe:
  failureThreshold: 3
  httpGet:
    path: /ready
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# HorizontalPodAutoscaler (map).

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Pod volumes (list).

volumes: []

# Container volume mounts (list).

volumeMounts: []

# Node selector (map).

nodeSelector: {}

# Pod tolerations (list).

tolerations: []

# Pod affinity rules (map).

affinity: {}
