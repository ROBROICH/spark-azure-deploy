# =============================================================================
# agent-orchestration-service
# Dispatches and monitors AI-agent Temporal workflow runs, translating HTTP requests into workflow job submissions.
# =============================================================================

# Desired pod replicas when autoscaling.enabled is false.

replicaCount: 2

# Container image. If tag is empty, Chart.appVersion is used.
image:
  repository: "registry.opencode.de/oc000155419009/spark-workflow/agent-orchestration-service"
  tag: "<image-tag>"
  pullPolicy: Always

# Pull secrets for private registries (list).

# imagePullSecrets:          # Uncomment and set your registry pull secret name.
#   - name: <registry-pull-secret>
imagePullSecrets: []

# Override chart name used in labels.

nameOverride: ''

# Override fully qualified resource name.

fullnameOverride: ''

# Namespace override. Empty → uses the release namespace (-n flag).

namespaceOverride: ''

# Stage suffix for resource names (e.g. "dev" → resource-dev). Propagated from global.stage.name; set explicitly for standalone installs.

stage:
  name: ''

# Classification labels applied to all resources.
# app.kubernetes.io/component: workload category (frontend | backend | agent)
# environment: propagated from global.labels.environment; set explicitly only for standalone installs.

labels:
  app.kubernetes.io/component: backend

# Container ports (list).

containerPorts:
  - containerPort: 8000

# ServiceAccount for the pod (map).
serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ''

# Extra annotations on the pod template (map).

# Extra annotations on the Deployment/resource metadata (map).
annotations: {}

podAnnotations: {}

# Extra labels added to the pod template (map). Pod selectors are set by the
# chart templates using Kubernetes recommended labels (app.kubernetes.io/name,
# app.kubernetes.io/instance) and must not be overridden here.

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
# Service exposure (map). Selector is set by templates (app.kubernetes.io/name + instance).
service:
  enabled: true
  type: ClusterIP
  port: 80
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector: {}

# Ingress (map). Set enabled: true to render.
ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts: []
  tls: []

# CPU/memory requests and limits (map). Use {} when unset.

resources:
  limits:
    cpu: 1600m
    memory: 2560Mi
  requests:
    cpu: 700m
    memory: 1280Mi

# Base environment variables injected into the container (list of EnvVar objects).
# These apply in every stage. Do not set variables to empty string — omit them
# or use a placeholder (<postgresdb-host>, …) until the real value is known.
# Variables from global.env are merged before this list; this list takes
# precedence on name collisions.
env:
  - name: API__PLS_BASE_URL
    value: '{{ printf "http://%s-project-logic-service%s.%s.svc.cluster.local" .Release.Name (include "agent-orchestration-service.stageSuffix" .) .Release.Namespace }}'
  - name: API__PLAUSIBILITY_NOTES_BASE_URL
    value: '{{ printf "http://%s-plausibility-notes%s.%s.svc.cluster.local" .Release.Name (include "agent-orchestration-service.stageSuffix" .) .Release.Namespace }}'
  - name: API__OBJECTIONS_SERVICE_BASE_URL
    value: '{{ printf "http://%s-objections-management-service%s.%s.svc.cluster.local" .Release.Name (include "agent-orchestration-service.stageSuffix" .) .Release.Namespace }}'
  - name: API__FVP_BASE_URL
    value: '{{ printf "http://%s-formal-completeness-check%s.%s.svc.cluster.local" .Release.Name (include "agent-orchestration-service.stageSuffix" .) .Release.Namespace }}'
  - name: API__FPP_BASE_URL
    value: '{{ printf "http://%s-fpp-service%s.%s.svc.cluster.local" .Release.Name (include "agent-orchestration-service.stageSuffix" .) .Release.Namespace }}'
  - name: API__EXAMINATION_SERVICE_BASE_URL
    value: '{{ printf "http://%s-examination-service%s.%s.svc.cluster.local" .Release.Name (include "agent-orchestration-service.stageSuffix" .) .Release.Namespace }}'
  - name: API__DMS_BASE_URL
    value: '{{ printf "http://%s-document-management-service%s.%s.svc.cluster.local" .Release.Name (include "agent-orchestration-service.stageSuffix" .) .Release.Namespace }}'
  - name: API__DIPLAN_BASE_URL
    value: '{{ printf "http://%s-diplan-service%s.%s.svc.cluster.local" .Release.Name (include "agent-orchestration-service.stageSuffix" .) .Release.Namespace }}'
  - name: API__ADMINISTRATIVE_FILE_DRAFT_BASE_URL
    value: '{{ printf "http://%s-administrative-file-draft%s.%s.svc.cluster.local" .Release.Name (include "agent-orchestration-service.stageSuffix" .) .Release.Namespace }}'
  - name: CORS_ORIGINS
    value: <cors-origins>
  - name: OTEL_ENDPOINT
    value: <otel-collector-host>
  - name: OTEL_SERVICE_NAME
    value: orchestrator
  - name: SERVICE_NAME
    value: agent-orchestration-service
  - name: TEMPORAL__S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        key: TEMPORAL_S3_ACCESS_KEY_ID
        name: agent-orchestration-temporal-s3-secrets
  - name: TEMPORAL__S3_BUCKET_NAME
    value: '<temporal-payloads-bucket>'
  - name: TEMPORAL__S3_ENDPOINT_URL
    value: <https-endpoint-url>
  - name: TEMPORAL__S3_REGION
    value: <s3-region>
  - name: TEMPORAL__S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        key: TEMPORAL_S3_SECRET_ACCESS_KEY
        name: agent-orchestration-temporal-s3-secrets
  - name: USE_TRANSFER_ENCODING_CHUNKED
    value: 'true'

  # Additional environment variables merged after env (list of EnvVar objects).
  # Use for stage-specific values: image-specific settings, feature flags, or
  # values that differ between dev / test / prod. This list takes precedence
  # over global.extraEnv on name collisions.
  #
  # In-cluster HTTP peer URLs use a Helm printf template so the address follows
  # the release name, stage suffix, and namespace automatically.
  #
  # DiPlan integration base URL (optional external system). The setting is
  # required at boot — keep the dummy value when DiPlan is not connected.
  - name: API__DIPLAN_BASE_URL
    value: "http://diplan-disabled.invalid"

  # ── Temporal workflow engine ─────────────────────────────────────────────────
  # TEMPORAL__HOST format: {release}-temporal{stage}-frontend.{namespace}.svc.cluster.local:7233
  - name: TEMPORAL__HOST
    value: '{{ printf "%s-temporal%s-frontend.%s.svc.cluster.local:7233" .Release.Name (include "agent-orchestration-service.stageSuffix" .) .Release.Namespace }}'
  - name: TEMPORAL__NAMESPACE
    value: default
  - name: TEMPORAL__TASK_QUEUE
    value: orchestration

  # ── FPP portal integration (OIDC client credentials + technical user) ─────
  # Required by the application settings; values live in the fpp-secrets Secret.
  - name: FPP__CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: fpp-secrets
        key: oidc_client_id
  - name: FPP__CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: fpp-secrets
        key: oidc_client_secret
  - name: FPP__KEYCLOAK_TOKEN_URL
    valueFrom:
      secretKeyRef:
        name: fpp-secrets
        key: oidc_token_url
  - name: FPP__USERNAME
    valueFrom:
      secretKeyRef:
        name: fpp-secrets
        key: oidc_user
  - name: FPP__PASSWORD
    valueFrom:
      secretKeyRef:
        name: fpp-secrets
        key: oidc_password

  # Temporal-job-service base URL — required by the application settings.
  - name: TEMPORAL_JOB_SERVICE_URL
    value: '{{ printf "http://%s-temporal-job-service%s.%s.svc.cluster.local" .Release.Name (include "agent-orchestration-service.stageSuffix" .) .Release.Namespace }}'

extraEnv: []

# Startup probe (map). Use {} when unset.

startupProbe:
  failureThreshold: 6
  httpGet:
    path: /startup
    port: 8000
  periodSeconds: 10

# Liveness probe (map). Use {} when unset.

livenessProbe:
  failureThreshold: 3
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# Readiness probe (map). Use {} when unset.

readinessProbe:
  failureThreshold: 3
  httpGet:
    path: /ready
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# HorizontalPodAutoscaler (map).

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Pod volumes (list).

volumes: []

# Container volume mounts (list).

volumeMounts: []

# Node selector (map).

nodeSelector: {}

# Pod tolerations (list).

tolerations: []

# Pod affinity rules (map).

affinity: {}
