# =============================================================================
# document-management-service
# Central file store for all project documents; handles upload, download, metadata indexing, and pre-processing hand-off.
# =============================================================================

# Desired pod replicas when autoscaling.enabled is false.

replicaCount: 2

# Container image. If tag is empty, Chart.appVersion is used.
image:
  repository: "registry.opencode.de/bmds/planungs-und-genehmigungsbeschleunigung/spark-workflow/document-management-service"
  tag: "v0.2.1"
  pullPolicy: Always

# Pull secrets for private registries (list).

# imagePullSecrets:          # Uncomment and set your registry pull secret name.
#   - name: <registry-pull-secret>
imagePullSecrets: []

# Override chart name used in labels.

nameOverride: ''

# Override fully qualified resource name.

fullnameOverride: ''

# Namespace override. Empty → uses the release namespace (-n flag).

namespaceOverride: ''

# Stage suffix for resource names (e.g. "dev" → resource-dev). Propagated from global.stage.name; set explicitly for standalone installs.

stage:
  name: ''

# Classification labels applied to all resources.
# app.kubernetes.io/component: workload category (frontend | backend | agent)
# environment: propagated from global.labels.environment; set explicitly only for standalone installs.

labels:
  app.kubernetes.io/component: backend

# Container ports (list).

containerPorts:
  - containerPort: 8000
    name: http

# ServiceAccount for the pod (map).
serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ''

# Extra annotations on the pod template (map).

# Extra annotations on the Deployment/resource metadata (map).
annotations: {}

podAnnotations: {}

# Extra labels added to the pod template (map). Pod selectors are set by the
# chart templates using Kubernetes recommended labels (app.kubernetes.io/name,
# app.kubernetes.io/instance) and must not be overridden here.

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Service exposure (map). Selector is set by templates (app.kubernetes.io/name + instance).
service:
  enabled: true
  type: ClusterIP
  port: 80
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector: {}

# Ingress (map). Set enabled: true to render.
ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts: []
  tls: []

# CPU/memory requests and limits (map). Use {} when unset.

resources:
  limits:
    cpu: 300m
    memory: 1024Mi
  requests:
    cpu: 120m
    memory: 384Mi

# Base environment variables injected into the container (list of EnvVar objects).
# These apply in every stage. Do not set variables to empty string — omit them
# or use a placeholder (<postgresdb-host>, …) until the real value is known.
# Variables from global.env are merged before this list; this list takes
# precedence on name collisions.
env:
  - name: PROJECT_LOGIC_SERVICE_URL
    value: '{{ printf "http://%s-project-logic-service%s.%s.svc.cluster.local" .Release.Name (include "document-management-service.stageSuffix" .) .Release.Namespace }}'
  - name: CHECKPOINT_RETENTION_PERIOD_DAYS
    value: '60'
  - name: CORS_ORIGINS
    value: <cors-origins>
  - name: DOC_STORE_PATH
    value: dms_data
  - name: SERVICE_NAME
    value: dms
  # Deployment environment label (required). Controls the malware-scanning
  # guard: only `local`, `development` and `dev` may run with
  # CLAMAV__ENABLED=false — in every other environment the service refuses to
  # start without scanning.
  - name: ENV
    value: production
  - name: OTEL_SERVICE_NAME
    value: dms
  - name: OTEL_ENDPOINT
    value: <otel-collector-host>

  # ── Upload hardening (zip-bomb protection) ────────────────────────────────
  - name: MAX_ZIP_EXTRACTION_SIZE_GB
    value: "10"
  - name: MAX_SINGLE_ENTRY_SIZE_MB
    value: "1024"
  - name: MAX_ZIP_ENTRIES
    value: "1000"
  - name: MAX_COMPRESSION_RATIO
    value: "100"

  # ── Document storage (S3-compatible, required) ────────────────────────────
  - name: BUCKET_NAME
    value: <dms-bucket-name>
  - name: S3_ENDPOINT_URL
    value: <object-storage-url>
  # Publicly reachable URL for presigned upload/download links.
  - name: S3_EXTERNAL_URL
    value: <s3-external-url>
  - name: S3_REGION
    value: <s3-region>
  - name: S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: dms-secrets
        key: S3_ACCESS_KEY_ID
  - name: S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: dms-secrets
        key: S3_SECRET_ACCESS_KEY

  # ── ClamAV antivirus scanning ─────────────────────────────────────────────
  # Enabled by default — the 01-basisdienste layer ships ClamAV and the service
  # fails closed: no file is stored without a clean scan. Scanning can only be
  # disabled (CLAMAV__ENABLED=false) when ENV is local/development/dev; with
  # any other ENV the service refuses to start unscanned.
  - name: CLAMAV__ENABLED
    value: "true"
  - name: CLAMAV__BASE_URL
    value: '{{ printf "http://%s-clamav%s.%s.svc.cluster.local:6000" .Release.Name (include "document-management-service.stageSuffix" .) .Release.Namespace }}'
  - name: CLAMAV__TIMEOUT_SECONDS
    value: "600"
  # Quarantine storage for scan-flagged uploads — must be a different bucket
  # than BUCKET_NAME (the service refuses identical clean/quarantine storage).
  - name: QUARANTINE_BUCKET_NAME
    value: <quarantine-bucket-name>
  - name: QUARANTINE_S3_ENDPOINT_URL
    value: <object-storage-url>
  - name: QUARANTINE_S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: dms-quarantine-bucket-credentials
        key: access-key
  - name: QUARANTINE_S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: dms-quarantine-bucket-credentials
        key: secret-key

  # ── PostgreSQL (CNPG cluster via transaction pooler) ──────────────────────
  # DB_HOST format: {cluster-name}-pooler-rw.{cluster-namespace}.svc.cluster.local
  - name: DB_HOST
    value: ""
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    value: "dms-db"
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: dms-db-user
        key: username
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: dms-db-user
        key: password

  # Additional environment variables merged after env (list of EnvVar objects).
  # Use for stage-specific values: image-specific settings, feature flags, or
  # values that differ between dev / test / prod. This list takes precedence
  # over global.extraEnv on name collisions.
  #
  # In-cluster HTTP peer URLs use a Helm printf template so the address follows
  # the release name, stage suffix, and namespace automatically.
  #
  # ── Temporal workflow engine ─────────────────────────────────────────────────
  # TEMPORAL__HOST format: {release}-temporal{stage}-frontend.{namespace}.svc.cluster.local:7233
  - name: TEMPORAL__HOST
    value: '{{ printf "%s-temporal%s-frontend.%s.svc.cluster.local:7233" .Release.Name (include "document-management-service.stageSuffix" .) .Release.Namespace }}'
  - name: TEMPORAL__NAMESPACE
    value: default
  - name: TEMPORAL__TASK_QUEUE
    value: dms
  - name: TEMPORAL__PLS_TASK_QUEUE
    value: project_logic_service
  - name: TEMPORAL__ENABLE_APPROVAL
    value: "false"
  # S3 offload for large Temporal payloads.
  - name: TEMPORAL__S3_BUCKET_NAME
    value: <temporal-payloads-bucket>
  - name: TEMPORAL__S3_ENDPOINT_URL
    value: <object-storage-url>
  - name: TEMPORAL__S3_REGION
    value: <s3-region>
  - name: TEMPORAL__S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: temporal-s3-secrets
        key: TEMPORAL_S3_ACCESS_KEY_ID
  - name: TEMPORAL__S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: temporal-s3-secrets
        key: TEMPORAL_S3_SECRET_ACCESS_KEY
  - name: TEMPORAL_JOB_SERVICE_URL
    value: '{{ printf "http://%s-temporal-job-service%s.%s.svc.cluster.local" .Release.Name (include "document-management-service.stageSuffix" .) .Release.Namespace }}'

extraEnv: []

# Startup probe (map). Use {} when unset.

startupProbe:
  failureThreshold: 6
  httpGet:
    path: /startup
    port: 8000
  periodSeconds: 10

# Liveness probe (map). Use {} when unset.

livenessProbe:
  failureThreshold: 3
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# Readiness probe (map). Use {} when unset.

readinessProbe:
  failureThreshold: 3
  httpGet:
    path: /ready
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# HorizontalPodAutoscaler (map).

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Pod volumes (list).

volumes: []

# Container volume mounts (list).

volumeMounts: []

# Node selector (map).

nodeSelector: {}

# Pod tolerations (list).

tolerations: []

# Pod affinity rules (map).

affinity: {}
