# =============================================================================
# unoserver — values.yaml
# =============================================================================
#
# LibreOffice-based document conversion service (DOCX → PDF, etc.) on port 2003.
# No workers, no external dependencies beyond the imagePullSecret.
#
# Kustomize source: repo/04-shared-services/basiskomponenten/unoserver/
# Image: <container-registry>/unoserver
#
# Kustomize overlay differences (handled via values):
#   testing:    nameSuffix -test, tag "58"
#   staging:    nameSuffix -prod, tag autoset_by_jenkins
#   production: nameSuffix -prod, tag autoset_by_jenkins
# In Helm the release name provides equivalent naming context.
# =============================================================================

# ── Naming / override ─────────────────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

# ── Image ─────────────────────────────────────────────────────────────────────
image:
  repository: "<container-registry>/unoserver"
  tag: "<image-tag>"
  pullPolicy: Always

# imagePullSecrets:          # Uncomment and set your registry pull secret name.
#   - name: <registry-pull-secret>
imagePullSecrets: []

# ── Replicas ──────────────────────────────────────────────────────────────────
replicaCount: 1

# ── Application config ────────────────────────────────────────────────────────
# Maps to the CONVERSION_TIMEOUT env var.
conversionTimeout: "120"

# ── Pod / container security contexts ────────────────────────────────────────
# runAsUser 100 / runAsGroup 101 match the unoserver container user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# ── Probes ────────────────────────────────────────────────────────────────────
# Kustomize base has no probes; leave empty to skip rendering.
livenessProbe: {}
readinessProbe: {}

# ── Pod annotations ──────────────────────────────────────────────────────────
podAnnotations: {}

# ── Labels ────────────────────────────────────────────────────────────────────
# Extra labels applied to resources managed by this chart.
# Use this map for any additional key-value labels.
labels: {}

# ── Stage ─────────────────────────────────────────────────────────────────────
stage:
  name: ""

# ── Service ───────────────────────────────────────────────────────────────────
service:
  enabled: true
  ports:
    - port: 80
      targetPort: 2003
      protocol: TCP
      name: http
  annotations: {}

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
  hosts: []
  tls: []

# ── HPA ───────────────────────────────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ""

# ── ServiceAccount ────────────────────────────────────────────────────────────
# Kustomize sets automountServiceAccountToken: false — reflected here.
serviceAccount:
  create: false
  automount: false
  name: ""
  annotations: {}

# ── Node scheduling ───────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ── Extra env vars ────────────────────────────────────────────────────────────
env: []
extraEnv: []
