# =============================================================================
# qdrant — values.yaml
# =============================================================================
#
# Thin project wrapper around the official qdrant/qdrant Helm chart.
# All keys under "qdrant:" are forwarded verbatim to the upstream chart.
#
# Upstream chart:
#   https://qdrant.github.io/qdrant-helm  version 1.17.0  (appVersion v1.17.0)
#
# Bootstrap:
#   helm repo add qdrant https://qdrant.github.io/qdrant-helm
#   helm dep update charts/03-infrastructure/qdrant
#
# Qdrant resources use .Release.Namespace — install with the desired namespace:
#   helm upgrade --install qdrant charts/03-infrastructure/qdrant \
#     -f values.yaml -n <release-namespace> --create-namespace
# =============================================================================

# ── Upstream chart values ─────────────────────────────────────────────────────
# All keys below are passed through verbatim to the qdrant/qdrant upstream chart.
# Full value reference: https://github.com/qdrant/qdrant-helm/blob/main/charts/qdrant/values.yaml
# ---------------------------------------------------------------------------
# Stage name appended to wrapper-level resource names as a suffix (e.g. "-dev").
# Propagated automatically via global.stage.name when deployed inside an umbrella chart.
stage:
  name: ""

# Namespace override. Empty → uses the release namespace (-n flag).
# Resources within the upstream subchart use their own namespace configuration.
namespaceOverride: ""

# Service classification labels applied to wrapper-level resources.
# Extra labels applied to resources managed by this chart.
# Use this map for any additional key-value labels.
labels: {}

# ---------------------------------------------------------------------------
qdrant:

  # ── Replicas ───────────────────────────────────────────────────────────────
  replicaCount: 3

  # ── Image ──────────────────────────────────────────────────────────────────
  image:
    repository: "docker.io/qdrant/qdrant"
    # Must be a valid semver string — the upstream chart uses semverCompare on this
    # value to gate snapshot-API behaviour. Leave empty to use the chart's appVersion
    # (v1.17.0), or set an explicit tag such as "v1.17.0".
    tag: "v1.17.0"
    pullPolicy: IfNotPresent

  # imagePullSecrets:          # Uncomment and set your registry pull secret name.
  #   - name: <registry-pull-secret>
  imagePullSecrets: []

  # ── Resources ──────────────────────────────────────────────────────────────
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 8Gi

  # ── Persistence ────────────────────────────────────────────────────────────
  persistence:
    accessModes:
      - ReadWriteOnce
    size: 100Gi
    # Adjust storageClassName for the target cluster:
    #   testing/staging:   "standard"
    #   generic RWO:       "standard-rwo"
    storageClassName: ""

  # ── Qdrant Configuration ───────────────────────────────────────────────────
  config:
    cluster:
      enabled: true
      p2p:
        port: 6335
        enable_tls: false
      consensus:
        tick_period_ms: 100

    service:
      enable_tls: false
      host: "0.0.0.0"
      http_port: 6333
      grpc_port: 6334

    telemetry_disabled: true

    # Reserve CPUs for search; indexing uses the remaining budget.
    # 0 or negative values reserve cores for the OS/search path.
    optimizer_cpu_budget: 0

    storage:
      on_disk_payload: true
      optimizers:
        deleted_threshold: 0.5
        vacuum_min_vector_number: 1500
        default_segment_number: 2
        max_segment_size_kb: null
        memmap_threshold_kb: 20000
        indexing_threshold_kb: 25000
        flush_interval_sec: 5
        max_optimization_threads: 1

  # ── API Key ─────────────────────────────────────────────────────────────────
  # false:  no API key (open access — suitable for in-cluster only deployments)
  # true:   auto-generate an API key (stored in a Kubernetes Secret)
  # string: set a literal API key value (dev/test only)
  # valueFrom.secretKeyRef: reference a pre-existing Secret (ESO-managed):
  #   apiKey:
  #     valueFrom:
  #       secretKeyRef:
  #         name: qdrant-api-key
  #         key: api-key
  apiKey: false

  # ── Pod Disruption Budget ──────────────────────────────────────────────────
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  chartTests:
    dbInteraction:
      image: ""
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
        limits:
          cpu: 100m
          memory: 200Mi
