apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
data:
  redis.conf: |
    port {{ .Values.service.port }}
    {{- if .Values.persistence.enabled }}
    dir /data
    save 900 1
    save 300 10
    save 60 10000
    {{- else }}
    save ""
    {{- end }}
    {{- if not .Values.auth.enabled }}
    protected-mode no
    {{- end }}
    {{- with .Values.extraConfig }}
    {{ . | nindent 4 | trim }}
    {{- end }}
