# =============================================================================
# temporal — values.yaml
# =============================================================================
#
# Thin project wrapper around the official temporalio/temporal Helm chart.
# All keys under "temporal:" are forwarded verbatim to the upstream chart.
#
# Upstream chart:
#   https://go.temporal.io/helm-charts  version 0.73.2  (appVersion 1.30.2)
#
# Bootstrap:
#   helm repo add temporal https://go.temporal.io/helm-charts
#   helm dep update charts/04-shared-services/temporal
#
# Temporal resources use .Release.Namespace — install with the desired namespace:
#   helm upgrade --install temporal charts/04-shared-services/temporal \
#     -f values.yaml -n <release-namespace> --create-namespace
# =============================================================================

# ── Search-attributes post-install Job ───────────────────────────────────────
# Registers project-specific custom search attributes (ProjectId, ProjectVersion)
# into the "default" Temporal namespace as a Helm post-install/post-upgrade hook.
# ---------------------------------------------------------------------------
# Stage name appended to wrapper-level resource names as a suffix (e.g. "-dev").
# Propagated automatically via global.stage.name when deployed inside an umbrella chart.
stage:
  name: ""

# Namespace override. Empty → uses the release namespace (-n flag).
# Resources within the upstream subchart use their own namespace configuration.
namespaceOverride: ""

# Extra labels applied to wrapper-level resources (e.g. search-attributes Job).
# The layer umbrella injects spark-workflow.layer/name via global.labels.
# Use this map for any additional resource-level labels specific to this chart.
labels: {}

annotations: {}

# ---------------------------------------------------------------------------
searchAttributesJob:
  enabled: true
  image:
    repository: "temporalio/admin-tools"
    tag: "1.29.1-tctl-1.18.4-cli-1.5.0"
  # In-cluster address of the Temporal frontend service.
  # Leave empty to auto-derive from the release name and namespace:
  #   {release-name}-temporal-frontend.{release-namespace}.svc.cluster.local:7233
  # Set explicitly only when installing the job into a different namespace than
  # the Temporal server.
  temporalAddress: ""
  # imagePullSecrets:          # Uncomment and set your registry pull secret name.
  #   - name: <registry-pull-secret>
  imagePullSecrets: []

# ── Upstream chart values ─────────────────────────────────────────────────────
temporal:

  # ── Disable all bundled infrastructure subcharts ───────────────────────────
  # All persistence is provided by an external CNPG PostgreSQL cluster.
  cassandra:
    enabled: false
  elasticsearch:
    enabled: false
  mysql:
    enabled: false
  postgresql:
    enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false

  # ── Schema management ─────────────────────────────────────────────────────
  # Disabled: the database schema is managed externally via CNPG / migrations.
  # The upstream chart runs setup/update Jobs by default — turn them all off.
  schema:
    createDatabase:
      enabled: false
    setup:
      enabled: false
    update:
      enabled: false

  # ── Image pull secrets ─────────────────────────────────────────────────────
  # imagePullSecrets:          # Uncomment and set your registry pull secret name.
  #   - name: <registry-pull-secret>
  imagePullSecrets: []

  # ── Server ────────────────────────────────────────────────────────────────
  server:
    image:
      repository: "temporalio/server"
      tag: "1.29.1"

    useEntrypointScript: true
    configMapsToMount: "both"
    setConfigFilePath: false

    # Dynamic config values applied at runtime without server restart.
    # These matching flags were active in all deployment environments:
    #   useNewMatcher   — use the new task-queue matching implementation
    #   enableFairness  — fair weighted task dispatching across task queues
    #   enableMigration — allows online migration of task-queue data
    dynamicConfig:
      matching.useNewMatcher:
        - value: true
          constraints: {}
      matching.enableFairness:
        - value: true
          constraints: {}
      matching.enableMigration:
        - value: true
          constraints: {}

    config:
      # numHistoryShards lives at server.config level (not inside persistence).
      # IMPORTANT: this value is immutable after the first deployment.
      numHistoryShards: 512

      persistence:
        # defaultStore must reference the name of a datastores entry below.
        defaultStore: default
        # visibilityStore is hardcoded to "visibility" in the chart template.

        default:
          driver: "sql"
          sql:
            driver: postgres12
            host: "<db-host>"
            port: 5432
            database: "temporal"
            user: "<db-user>"
            # Name of a Kubernetes Secret (key: password) managed externally
            # via ESO or user-created. This chart does not generate DB secrets.
            existingSecret: "<db-secret>"
            maxConns: 5
            maxIdleConns: 2
            maxConnLifetime: "1h"

        visibility:
          driver: "sql"
          sql:
            driver: postgres12
            host: "<db-host>"
            port: 5432
            database: "temporal_visibility"
            user: "<db-user>"
            existingSecret: "<db-secret>"
            maxConns: 5
            maxIdleConns: 2
            maxConnLifetime: "1h"

      namespaces:
        create: true
        namespace:
          - name: default
            retention: 60d

    # ── Replica counts & resources ───────────────────────────────────────────
    # Service-level replicaCount falls back to server.replicaCount (default 1)
    # when not set. Only set here what deviates from the default.
    history:
      replicaCount: 2
      resources:
        requests:
          cpu: "2"
          memory: "6Gi"
        limits:
          cpu: "4"
          memory: "8Gi"

    frontend:
      replicaCount: 1
      service:
        type: ClusterIP
        port: 7233

    # Separate internal-frontend process for Temporal cluster-internal gRPC traffic
    # (port 7236). Enabling this gives the internal-frontend Service a matching
    # Deployment and activates USE_INTERNAL_FRONTEND on all server processes so
    # they communicate via the dedicated endpoint instead of the public frontend.
    internalFrontend:
      enabled: true
      replicaCount: 1
      service:
        type: ClusterIP
        port: 7236
        membershipPort: 6936
        httpPort: 7246

    matching:
      replicaCount: 1

    worker:
      replicaCount: 1

  # ── Admin tools ───────────────────────────────────────────────────────────
  admintools:
    image:
      repository: "temporalio/admin-tools"
      tag: "1.29.1-tctl-1.18.4-cli-1.5.0"

  # ── Web UI ────────────────────────────────────────────────────────────────
  web:
    enabled: true
    replicaCount: 1
    image:
      repository: "temporalio/ui"
      tag: "2.48.1"
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false  # Exposed via Istio / EnvoyGateway instead.
    additionalEnv:
      - name: TEMPORAL_CORS_ORIGINS
        value: "<temporal-cors-origin>"
