{{- if .Values.cluster.enabled }}
{{- $clusterNS := .Values.cluster.namespace | default .Release.Namespace }}
# SpiceDBCluster CR — reconciled by the spicedb-operator into a SpiceDB
# Deployment, headless Service, migration Job, and required RBAC.
# Source: repo/03-infrastructure-resources/tooling/spicedb/k8s/base/spicedbcluster.yaml
apiVersion: authzed.com/v1alpha1
kind: SpiceDBCluster
metadata:
  name: {{ include "spicedb.fullname" . }}
  namespace: {{ $clusterNS }}
  labels:
    {{- include "spicedb.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: spicedb
spec:
  {{- if .Values.cluster.channel }}
  channel: {{ .Values.cluster.channel | quote }}
  {{- else }}
  channel: ""
  {{- end }}
  secretName: {{ .Values.cluster.secretName }}
  config:
    datastoreEngine: {{ .Values.cluster.config.datastoreEngine }}
    logLevel: {{ .Values.cluster.config.logLevel }}
    replicas: {{ .Values.cluster.config.replicas }}
    {{- with .Values.cluster.config.image }}
    image: {{ . }}
    {{- end }}
    {{- with .Values.cluster.config.imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.cluster.config.extraConfig }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
