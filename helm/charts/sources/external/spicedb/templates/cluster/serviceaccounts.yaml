{{- if .Values.cluster.enabled }}
{{- $clusterNS := .Values.cluster.namespace | default .Release.Namespace }}
# ServiceAccount for the SpiceDB pods themselves (operator creates pods that
# use this SA). The default SA also needs the pull secret for init containers.
# Source: repo/03-infrastructure-resources/tooling/spicedb/k8s/overlays/production/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spicedb
  namespace: {{ $clusterNS }}
  labels:
    {{- include "spicedb.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: spicedb
{{- with .Values.cluster.serviceAccounts.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: {{ $clusterNS }}
  labels:
    {{- include "spicedb.labels" . | nindent 4 }}
{{- with .Values.cluster.serviceAccounts.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
