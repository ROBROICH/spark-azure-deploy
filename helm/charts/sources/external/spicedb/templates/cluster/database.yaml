{{- if and .Values.cluster.enabled .Values.cluster.database.enabled }}
{{- $clusterNS := .Values.cluster.namespace | default .Release.Namespace }}
# CNPG Cluster — PostgreSQL backend for SpiceDB.
# Managed by the CloudNativePG operator (must be installed separately).
# Source: repo/03-infrastructure-resources/tooling/spicedb/k8s/overlays/*/database.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "spicedb.fullname" . }}-postgres
  namespace: {{ $clusterNS }}
  labels:
    {{- include "spicedb.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: spicedb
spec:
  instances: {{ .Values.cluster.database.instances }}

  {{- with .Values.cluster.database.imageCatalogRef }}
  imageCatalogRef:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cluster.database.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cluster.database.inheritedMetadata }}
  inheritedMetadata:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  bootstrap:
    initdb:
      database: spicedb
      owner: spicedb

  storage:
    size: {{ .Values.cluster.database.storage.size }}
    storageClass: {{ .Values.cluster.database.storage.storageClass | quote }}

  postgresql:
    parameters:
      max_connections: {{ .Values.cluster.database.postgresql.max_connections | quote }}
      shared_buffers: {{ .Values.cluster.database.postgresql.shared_buffers | quote }}
      effective_cache_size: {{ .Values.cluster.database.postgresql.effective_cache_size | quote }}
      work_mem: {{ .Values.cluster.database.postgresql.work_mem | quote }}

  monitoring:
    enablePodMonitor: {{ .Values.cluster.database.monitoring.enablePodMonitor }}
{{- end }}
