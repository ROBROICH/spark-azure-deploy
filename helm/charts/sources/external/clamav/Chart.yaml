apiVersion: v2
name: clamav
description: |
  Cluster-internal antivirus scanning service (ClamAV + Go REST proxy).

  Resources created:
    - StatefulSet            clamav daemon (Go REST API + clamd engine + freshclam)
    - Service                ClusterIP on port 6000 for consumer access
    - ConfigMap              clamd.conf tuned for 2 GB streaming with zip-bomb protection
    - HorizontalPodAutoscaler  scales on CPU (50%) and memory (70%)
    - PodDisruptionBudget    maxUnavailable=1 for safe node drains

  All resources are created in the Helm release namespace.

  Image: ghcr.io/devhatro/clamav-api (replace with internal mirror via image.repository).
type: application
version: 0.1.0
appVersion: "v2.0.0"
