{{/*
Rendered only when this chart creates its own ServiceAccount — see
"landingpage.serviceAccountCreate". Suppressed when global.serviceAccount.name is
set (shared SA managed elsewhere) or global.serviceAccount.create is false.
*/}}
{{- if include "landingpage.serviceAccountCreate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "landingpage.serviceAccountName" . }}
  namespace: {{ include "landingpage.namespace" . }}
  labels:
    {{- include "landingpage.labels" . | nindent 4 }}
  {{- with include "landingpage.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
