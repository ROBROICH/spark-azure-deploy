{{/*
Rendered only when this chart creates its own ServiceAccount — see
"prototype-demo.serviceAccountCreate". Suppressed when global.serviceAccount.name is
set (shared SA managed elsewhere) or global.serviceAccount.create is false.
*/}}
{{- if include "prototype-demo.serviceAccountCreate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "prototype-demo.serviceAccountName" . }}
  namespace: {{ include "prototype-demo.namespace" . }}
  labels:
    {{- include "prototype-demo.labels" . | nindent 4 }}
  {{- with include "prototype-demo.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ include "prototype-demo.automountToken" . }}
{{- end }}
