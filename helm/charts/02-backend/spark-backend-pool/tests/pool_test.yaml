suite: spark-backend-pool
release: {name: rel, namespace: ci}
values: [../ci/full-values.yaml]
tests:
  - it: renders the pool Deployment with the shared image
    template: templates/deployment.yaml
    asserts:
      - isKind: {of: Deployment}
      - equal: {path: 'spec.template.spec.containers[0].image', value: 'registry.example.com/spark/spark-backend:1.0.0'}

  - it: global.backend.namespaceOverride wins over global.namespaceOverride
    template: templates/deployment.yaml
    set:
      global.namespaceOverride: shared
      global.backend.namespaceOverride: backend
    asserts:
      - equal: {path: metadata.namespace, value: backend}

  - it: HPA and KEDA are mutually exclusive
    template: templates/hpa.yaml
    set:
      keda: {enabled: true, triggers: [{type: cpu, metricType: Utilization, metadata: {value: "70"}}]}
    asserts:
      - failedTemplate: {errorPattern: mutually exclusive}

  - it: omits replicas when the HPA owns them
    template: templates/deployment.yaml
    asserts:
      - notExists: {path: spec.replicas}

  - it: composes registry and digest for the pool image
    template: templates/deployment.yaml
    set:
      global.imageRegistry: mirror.example.com
      global.backend.image: {repository: spark/spark-backend, tag: "1.0.0", digest: "sha256:abc"}
    asserts:
      - equal: {path: 'spec.template.spec.containers[0].image', value: 'mirror.example.com/spark/spark-backend:1.0.0@sha256:abc'}

  - it: uses the pool's scheduling and extra containers
    template: templates/deployment.yaml
    asserts:
      - equal: {path: spec.template.spec.nodeSelector, value: {kubernetes.io/os: linux}}
      - equal: {path: spec.template.spec.terminationGracePeriodSeconds, value: 60}
      - equal: {path: 'spec.template.spec.containers[1].name', value: sidecar}
      - contains: {path: 'spec.template.spec.containers[0].volumeMounts', content: {name: tmp, mountPath: /tmp}}

  - it: falls back to the shared global.backend values
    template: templates/deployment.yaml
    set:
      nodeSelector: null
      global.backend.nodeSelector: {pool: shared}
    asserts:
      - equal: {path: spec.template.spec.nodeSelector, value: {pool: shared}}

  - it: keeps the chart's labels over podLabels
    template: templates/deployment.yaml
    asserts:
      - equal: {path: 'spec.template.metadata.labels["app.kubernetes.io/name"]', value: spark-backend-pool}
      - equal: {path: spec.template.metadata.labels.team, value: backend}

  - it: applies the restricted Pod Security Standard by default
    template: templates/deployment.yaml
    asserts:
      - equal: {path: spec.template.spec.securityContext.runAsUser, value: 65532}
      - equal: {path: 'spec.template.spec.containers[0].securityContext.capabilities.drop', value: [ALL]}
      - contains: {path: spec.template.spec.volumes, content: {name: tmp, emptyDir: {}}}
      - equal: {path: spec.template.spec.automountServiceAccountToken, value: false}

  - it: global.backend switches the pools on over a global opt-out
    template: templates/deployment.yaml
    set:
      global.podSecurity.restricted: false
      global.backend.podSecurity.restricted: true
      global.backend.securityContext: {readOnlyRootFilesystem: false}
      extraVolumes: null
      extraVolumeMounts: null
    asserts:
      - equal: {path: spec.template.spec.securityContext.runAsNonRoot, value: true}
      - equal: {path: 'spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem', value: false}
      - notExists: {path: spec.template.spec.volumes}

  - it: renders no security context when restricted is off
    template: templates/deployment.yaml
    set:
      global.podSecurity.restricted: false
    asserts:
      - notExists: {path: spec.template.spec.securityContext}

  - it: lets a pool run its own image and container name
    template: templates/deployment.yaml
    set:
      image: {repository: registry.example.com/spark/dms-module, tag: "2.0.0", pullPolicy: IfNotPresent}
      containerName: dms-module
    asserts:
      - equal: {path: 'spec.template.spec.containers[0].name', value: dms-module}
      - equal: {path: 'spec.template.spec.containers[0].image', value: 'registry.example.com/spark/dms-module:2.0.0'}
      - equal: {path: 'spec.template.spec.containers[0].imagePullPolicy', value: IfNotPresent}

  - it: injects the pool env unless switched off
    template: templates/deployment.yaml
    set:
      pool.injectEnv: false
    asserts:
      - notContains: {path: 'spec.template.spec.containers[0].env', content: {name: API_POOL, value: document-management-service}}

  - it: loads no shared ConfigMap when configEnabled is false
    template: templates/deployment.yaml
    set:
      global.backend.config: {A: "1"}
      global.backend.configEnabled: false
    asserts:
      - notExists: {path: 'spec.template.spec.containers[0].envFrom'}
