{{- if (.Values.podMonitoring | default dict).enabled }}
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: {{ .Values.podMonitoring.name | default (include "gesetzesbegruendung-db-service.fullname" .) }}
  namespace: {{ include "gesetzesbegruendung-db-service.namespace" . }}
  labels:
    {{- include "gesetzesbegruendung-db-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- with .Values.podMonitoring.selector }}
      {{- toYaml . | nindent 6 }}
      {{- else }}
      {{- include "gesetzesbegruendung-db-service.selectorLabels" . | nindent 6 }}
      {{- end }}
  {{- if not .Values.podMonitoring.endpoints }}
  {{- fail (printf "%s: podMonitoring.endpoints is required when podMonitoring.enabled" .Chart.Name) }}
  {{- end }}
  endpoints:
    {{- toYaml .Values.podMonitoring.endpoints | nindent 4 }}
{{- end }}
