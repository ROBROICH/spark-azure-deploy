{{/*
Rendered only when this chart creates its own ServiceAccount — see
"fallvergleichsservice.serviceAccountCreate". Suppressed when global.serviceAccount.name is
set (shared SA managed elsewhere) or global.serviceAccount.create is false.
*/}}
{{- if include "fallvergleichsservice.serviceAccountCreate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fallvergleichsservice.serviceAccountName" . }}
  namespace: {{ include "fallvergleichsservice.namespace" . }}
  labels:
    {{- include "fallvergleichsservice.labels" . | nindent 4 }}
  {{- with include "fallvergleichsservice.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ include "fallvergleichsservice.automountToken" . }}
{{- end }}
