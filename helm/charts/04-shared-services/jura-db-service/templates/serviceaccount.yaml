{{/*
Rendered only when this chart creates its own ServiceAccount — see
"jura-db-service.serviceAccountCreate". Suppressed when global.serviceAccount.name is
set (shared SA managed elsewhere) or global.serviceAccount.create is false.
*/}}
{{- if include "jura-db-service.serviceAccountCreate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jura-db-service.serviceAccountName" . }}
  namespace: {{ include "jura-db-service.namespace" . }}
  labels:
    {{- include "jura-db-service.labels" . | nindent 4 }}
  {{- with include "jura-db-service.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ include "jura-db-service.automountToken" . }}
{{- end }}
