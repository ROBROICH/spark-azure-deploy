{{/*
Rendered only when this chart creates its own ServiceAccount — see
"clamav.serviceAccountCreate". Suppressed when global.serviceAccount.name is
set (shared SA managed elsewhere) or global.serviceAccount.create is false.
*/}}
{{- if include "clamav.serviceAccountCreate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "clamav.serviceAccountName" . }}
  namespace: {{ include "clamav.namespace" . }}
  labels:
    {{- include "clamav.labels" . | nindent 4 }}
  {{- with include "clamav.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
