{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "clamav.fullname" . }}
  namespace: {{ include "clamav.namespace" . }}
  labels:
    {{- include "clamav.labels" . | nindent 4 }}
spec:
  # maxUnavailable=1 allows node drains and cluster autoscaler to work
  # even at minReplicas=2, without blocking all maintenance operations.
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "clamav.selectorLabels" . | nindent 6 }}
{{- end }}
