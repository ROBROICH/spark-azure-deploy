apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clamav.fullname" . }}-clamd-config
  namespace: {{ include "clamav.namespace" . }}
  labels:
    {{- include "clamav.labels" . | nindent 4 }}
data:
  clamd.conf: |
    ##############################################
    # ClamAV Daemon Configuration
    # Tuned for 2 GB streaming + zip-bomb protection
    ##############################################

    # --- Daemon ---
    Foreground yes
    LogTime yes
    LogClean yes
    LogVerbose no
    DatabaseDirectory /var/lib/clamav
    TemporaryDirectory /tmp

    # --- Listening ---
    # The Go API connects via Unix socket (CLAMAV_SOCKET env).
    # TCP is a fallback bound to localhost only.
    LocalSocket {{ .Values.config.socket }}
    TCPSocket 3310
    TCPAddr 127.0.0.1

    # --- Streaming: accept up to 2 GB ---
    StreamMaxLength {{ .Values.clamd.streamMaxLength }}

    # --- Archive bomb protection ---
    MaxScanSize {{ .Values.clamd.maxScanSize }}
    MaxFileSize {{ .Values.clamd.maxFileSize }}
    MaxRecursion {{ .Values.clamd.maxRecursion }}
    MaxFiles {{ .Values.clamd.maxFiles }}
    MaxPartitions 50
    MaxIconsPE 100

    # --- Timeouts ---
    MaxScanTime {{ .Values.clamd.maxScanTime }}
    ReadTimeout 600
    CommandReadTimeout 60
    IdleTimeout 300

    # --- Subscan memory limits ---
    MaxEmbeddedPE 40M
    MaxHTMLNormalize 10M
    MaxHTMLNoTags 2M
    MaxScriptNormalize 5M
    MaxZipTypeRcg 1M

    # --- Threading ---
    MaxThreads {{ .Values.clamd.maxThreads }}
    MaxQueue {{ .Values.clamd.maxQueue }}

    # --- Scan features ---
    ScanMail yes
    PhishingSignatures yes
    PhishingScanURLs yes
    ScanOnAccess no
    HeuristicAlerts yes
    ScanPE yes
    ScanELF yes
    ScanOLE2 yes
    ScanPDF yes
    ScanSWF yes
    ScanXMLDOCS yes
    ScanHWP3 yes
    ScanArchive yes

    # --- Signature reload ---
    # freshclam sends RELOAD via socket; SelfCheck is a safety net.
    SelfCheck 600
