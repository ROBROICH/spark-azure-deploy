suite: temporal search-attributes hook
release: {name: rel, namespace: ci}
templates: [templates/search-attributes-job.yaml]
tests:
  - it: is a bounded post-install/upgrade hook
    asserts:
      - isKind: {of: Job}
      - equal: {path: spec.activeDeadlineSeconds, value: 900}
      - equal: {path: 'metadata.annotations["helm.sh/hook"]', value: "post-install,post-upgrade"}

  - it: fails on errors other than an existing attribute of the same type
    asserts:
      - matchRegex: {path: 'spec.template.spec.containers[0].command[2]', pattern: 'exit 1'}
      - notMatchRegex: {path: 'spec.template.spec.containers[0].command[2]', pattern: '\|\| echo'}

  - it: addresses the frontend in the namespace the Job runs in
    set:
      global.namespaceOverride: shared
    asserts:
      - equal: {path: metadata.namespace, value: shared}
      - equal: {path: 'spec.template.spec.containers[0].env[0].value', value: rel-temporal-frontend.shared.svc.cluster.local:7233}

  - it: runs without capabilities, escalation or token
    asserts:
      - equal: {path: spec.template.spec.automountServiceAccountToken, value: false}
      - equal: {path: spec.template.spec.securityContext.seccompProfile.type, value: RuntimeDefault}
      - equal: {path: 'spec.template.spec.containers[0].securityContext.capabilities.drop', value: [ALL]}

  - it: addresses the upstream fullname when the release is named after the chart
    release: {name: temporal, namespace: temporal}
    asserts:
      - equal: {path: 'spec.template.spec.containers[0].env[0].value', value: temporal-frontend.temporal.svc.cluster.local:7233}
