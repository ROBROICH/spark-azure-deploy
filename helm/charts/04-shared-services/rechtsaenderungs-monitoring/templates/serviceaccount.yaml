{{/*
Rendered only when this chart creates its own ServiceAccount — see
"rechtsaenderungs-monitoring.serviceAccountCreate". Suppressed when global.serviceAccount.name is
set (shared SA managed elsewhere) or global.serviceAccount.create is false.
*/}}
{{- if include "rechtsaenderungs-monitoring.serviceAccountCreate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rechtsaenderungs-monitoring.serviceAccountName" . }}
  namespace: {{ include "rechtsaenderungs-monitoring.namespace" . }}
  labels:
    {{- include "rechtsaenderungs-monitoring.labels" . | nindent 4 }}
  {{- with include "rechtsaenderungs-monitoring.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ include "rechtsaenderungs-monitoring.automountToken" . }}
{{- end }}
