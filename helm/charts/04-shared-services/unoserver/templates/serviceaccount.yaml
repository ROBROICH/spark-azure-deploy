{{/*
Rendered only when this chart creates its own ServiceAccount — see
"unoserver.serviceAccountCreate". Suppressed when global.serviceAccount.name is
set (shared SA managed elsewhere) or global.serviceAccount.create is false.
*/}}
{{- if include "unoserver.serviceAccountCreate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "unoserver.serviceAccountName" . }}
  namespace: {{ include "unoserver.namespace" . }}
  labels:
    {{- include "unoserver.labels" . | nindent 4 }}
  {{- with include "unoserver.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
