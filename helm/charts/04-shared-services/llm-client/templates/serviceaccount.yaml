{{/*
Rendered only when this chart creates its own ServiceAccount — see
"llm-client.serviceAccountCreate". Suppressed when global.serviceAccount.name is
set (shared SA managed elsewhere) or global.serviceAccount.create is false.
*/}}
{{- if include "llm-client.serviceAccountCreate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "llm-client.serviceAccountName" . }}
  namespace: {{ include "llm-client.namespace" . }}
  labels:
    {{- include "llm-client.labels" . | nindent 4 }}
  {{- with include "llm-client.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ include "llm-client.automountToken" . }}
{{- end }}
