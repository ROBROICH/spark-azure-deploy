# =============================================================================
# modul-einwendungsmanagement — Helm values (base layer, 05-modulcluster)
# =============================================================================
# Category: agent (labels.type). Chart:05-modulcluster/modul-einwendungsmanagement/
#
# Override per environment with a values file of your own:
#   helm upgrade --install <release> . -f my-values.yaml
#
# All Helm template keys are listed below. Unused keys use "" for strings, [] for lists, {} for maps.
# Environment variables must not use empty value: omit unused vars or use placeholders (<postgresdb-host>, …).
# Environment-specific settings (extraEnv, podLabels, image, …) belong in that file.
# =============================================================================


# Desired pod replicas when autoscaling.enabled is false.
# Example: 3

replicaCount: 2

# Container image. If tag is empty, Chart.appVersion is used.
# Example:
#   repository: registry.example.com/my-team/my-service
#   tag: "1.2.3"
#   pullPolicy: Always

image:
  # Registry prefixed to repository (empty: global.imageRegistry, used only
  # when repository names no registry itself).
  registry: ""
  repository: einwendungsmanagement
  tag: latest
  pullPolicy: Always
  # false: keep this chart's own tag when global.imageTag is set (images
  # a branch environment's pipeline does not build)
  followGlobalTag: true
  # Digest pinned next to the tag (e.g. sha256:…); not applied to a
  # global.imageTag.
  digest: ""

# Pull secrets for private registries (list).
# Example: [{name: my-registry-credentials}]

imagePullSecrets: []

# Override chart name used in labels.
# Example: my-short-name

nameOverride: ''

# Override fully qualified resource name.
# Example: my-service-prod

fullnameOverride: ''

# Target Kubernetes namespace for all resources of this chart.
#
# When non-empty, every resource (Deployment, Service, ServiceAccount, HPA)
# is placed in the named namespace. When empty, the release namespace is used
# — the value supplied via helm install --namespace.
#
# When this chart is deployed as part of an umbrella, the parent chart sets
# this value in its own values.yaml. Override it per chart in your install
# values when a dedicated namespace is required.
#
# The namespace must exist in the cluster before installation; this chart does
# not create namespace objects.

namespaceOverride: ''

# Stage name appended to generated resource names as a suffix (e.g. "-dev").
# When this chart is deployed inside an umbrella, the stage is propagated via
# global.stage.name. Set it here only for standalone installs.
# Leave empty to omit the suffix.

stage:
  name: ''

# Service classification labels applied to Deployment, Service, ServiceAccount, and HPA.
#
# labels.type        — workload category: frontend | backend | agent
# labels.environment — environment tag on pods. When deployed inside an
#                      umbrella, this is provided via global.labels.environment.
#                      Set it here for standalone installs.

labels:
  type: agent
  environment: ''

# Container ports (list).
# Example: [{containerPort: 8000, name: http}]

containerPorts: []

# ServiceAccount for the pod (map).
# Example:
#   create: true
#   automount: false   # null: global.serviceAccount.automount, else false
#   annotations: {}
#   name: 

serviceAccount:
  create: true
  automount: null
  annotations: {}
  name: ''

# Extra annotations on the pod template (map).
# Example: {prometheus.io/scrape: "true"}

podAnnotations: {}

# Extra labels added to the pod template (map). The chart's own labels win on
# key collisions, so the selector cannot be overridden here. Selector labels:
# app.kubernetes.io/name + app.kubernetes.io/instance by default; with
# global.legacyAppSelector (umbrella-wide switch for migration from a
# Kustomize-based deployment, adopting its Deployments) app: <fullname>. The selector is
# immutable: switching the flag on an existing Helm release makes the upgrade
# fail — the Deployments have to be recreated.

podLabels: {}

# Selector labels used verbatim instead of the chart's (map), for adopting a
# Deployment whose existing (immutable) selector follows neither the
# standard nor the legacy scheme. The labels are added to every resource.
# Example: {app: queue-worker, queue: llm-custom}

selectorLabelsOverride: {}

# Pod-level securityContext (map).
# Example: {fsGroup: 2000}

podSecurityContext: {}

# Container-level securityContext (map).
# Example: {runAsNonRoot: true, runAsUser: 1000}

securityContext: {}

# Service exposure (map). The selector is always the chart's selector labels.
# service.ports is authoritative; service.port is DEPRECATED (read only when
# ports is empty) and service.selector is DEPRECATED and ignored.
# Example:
#   type: ClusterIP
#   port: 80
#   ports:
#     - {port: 80, targetPort: 8000, protocol: TCP, name: http}

service:
  enabled: true
  type: ClusterIP
  port: 80
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
  selector: {}

# Ingress (map). Set enabled: true to render.
# Example:
#   enabled: true
#   className: nginx
#   annotations: {}
#   hosts: []
#   tls: []

ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts: []
  tls: []

# CPU/memory requests and limits (map). Use {} when unset.
# Example: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 200Mi

# Base environment variables injected into the container (list of EnvVar objects).
# These apply in every stage. Do not set variables to empty string — omit them
# or use a placeholder (<postgresdb-host>, …) until the real value is known.
# Variables from global.env are merged before this list; this list takes
# precedence on name collisions.
# Example:
#   - name: LOG_LEVEL
#     value: INFO
#   - name: DB_PASSWORD
#     valueFrom:
#       secretKeyRef:
#         name: db-credentials
#         key: password

env:
- name: DMS_BASE_URL
  value: '{{ printf "http://%s-document-management-service%s.%s.svc.cluster.local%s" .Release.Name (include "modul-einwendungsmanagement.stageSuffix" .) (include "modul-einwendungsmanagement.namespace" .) "" }}'
- name: LITELLM_MODEL_NAME
  value: <llm-model>
- name: OTEL_ENDPOINT
  value: <otel-collector-host>
- name: OTEL_SERVICE_NAME
  value: einwendungsmanagement
- name: TEMPORAL_HOST
  value: <temporal-host>
- name: TEMPORAL_LLM_MAX_PER_SECOND
  value: '4'
- name: TEMPORAL_S3_ACCESS_KEY_ID
  valueFrom:
    secretKeyRef:
      key: TEMPORAL_S3_ACCESS_KEY_ID
      name: temporal-s3-secrets
- name: TEMPORAL_S3_BUCKET_NAME
  value: '<temporal-payloads-bucket>'
- name: TEMPORAL_S3_ENDPOINT_URL
  value: <https-endpoint-url>
- name: TEMPORAL_S3_REGION
  value: <s3-region>
- name: TEMPORAL_S3_SECRET_ACCESS_KEY
  valueFrom:
    secretKeyRef:
      key: TEMPORAL_S3_SECRET_ACCESS_KEY
      name: temporal-s3-secrets

# Additional environment variables merged after env (list of EnvVar objects).
# Use for stage-specific values: image-specific settings, feature flags, or
# values that differ between dev / test / prod. This list takes precedence
# over global.extraEnv on name collisions.
#
# In-cluster HTTP peer URLs use a Helm printf template so the address follows
# the release name, stage suffix, and namespace automatically.
#
# Example:
#   - name: DB_HOST
#     value: <postgresdb-host>

extraEnv: []

# Startup probe (map). Use {} when unset.
# Example: {httpGet: {path: /startup, port: 8000}, periodSeconds: 10, failureThreshold: 6}

startupProbe: {}

# Liveness probe (map). Use {} when unset.
# Example: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 10}

livenessProbe: {}

# Readiness probe (map). Use {} when unset.
# Example: {httpGet: {path: /ready, port: 8000}, periodSeconds: 10}

readinessProbe: {}

# HorizontalPodAutoscaler (map).
# Example: {enabled: true, minReplicas: 2, maxReplicas: 10, targetCPUUtilizationPercentage: 80}
# name: '' = the fullname. behavior: HPA scaling behavior (map). metrics:
# raw HPA metrics list; replaces the target*UtilizationPercentage shortcuts.

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Container name (string). Empty = the chart (alias) name.

containerName: ''

# Entrypoint override and arguments (lists). Empty = the image defaults.
# Example: command: [python, -m, app.worker]

command: []
args: []

# KEDA ScaledObject (map; requires KEDA in the cluster). Mutually exclusive
# with autoscaling — KEDA manages its own HPA and owns the replica count.
# name: '' = the fullname. triggers: KEDA trigger list (required); trigger
# metadata values must be strings (quote numbers).
# Example: {enabled: true, minReplicaCount: 2, maxReplicaCount: 8,
#           triggers: [{type: temporal, metadata: {...}}]}

keda:
  enabled: false
  name: ''
  minReplicaCount: 1
  maxReplicaCount: 4
  pollingInterval: 30
  cooldownPeriod: 300
  advanced: {}
  triggers: []

# GMP PodMonitoring for this workload (map; requires Google Managed
# Prometheus). name: '' = the fullname; selector: {} = the workload's
# selector labels. Endpoints need a NAMED container port.

podMonitoring:
  enabled: false
  name: ''
  selector: {}
  endpoints:
  - port: http
    path: /metrics
    interval: 30s

# Pod volumes (list).
# Example: [{name: config, configMap: {name: my-config}}]

volumes: []

# Container volume mounts (list).
# Example: [{name: config, mountPath: /etc/config, readOnly: true}]

volumeMounts: []

# Node selector (map).
# Example: {kubernetes.io/os: linux}

nodeSelector: {}

# Pod tolerations (list).
# Example: [{key: dedicated, operator: Equal, value: backend, effect: NoSchedule}]

tolerations: []

# Pod affinity rules (map).

affinity: {}

# ---------------------------------------------------------------------------
# Escape hatches (empty by default). Lists of the Kubernetes types named;
# initContainers, extraContainers, extraEnvFrom, topologySpreadConstraints
# and extraObjects are rendered with tpl.
# ---------------------------------------------------------------------------

# EnvFromSource entries of the main container, e.g. [{secretRef: {name: app-env}}].
extraEnvFrom: []

# Init containers, e.g. a migration run before the app starts.
initContainers: []

# Sidecar containers next to the main one.
extraContainers: []

# Pod volumes / main-container mounts appended to volumes / volumeMounts.
extraVolumes: []
extraVolumeMounts: []

# Pod scheduling: spread over zones or nodes, scheduling priority.
topologySpreadConstraints: []
priorityClassName: ""

# Seconds a pod gets to shut down (null: Kubernetes default, 30) and the main
# container's lifecycle hooks (e.g. a preStop sleep for graceful drains).
terminationGracePeriodSeconds: null
lifecycle: {}

# Additional manifests released with the chart (maps or YAML strings).
extraObjects: []

# PodDisruptionBudget (map). minAvailable (default 1) or maxUnavailable.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

# NetworkPolicy isolating the workload's ingress (map): allowSameNamespace
# admits the namespace's pods; ingress / egress add NetworkPolicy rules
# (tpl-rendered; egress empty = unrestricted).
networkPolicy:
  enabled: false
  allowSameNamespace: true
  ingress: []
  egress: []

# Prometheus Operator ServiceMonitor (map) — needs the Service and a named
# port; labels select the Prometheus instance.
serviceMonitor:
  enabled: false
  labels: {}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s

# Restricted Pod Security Standard defaults (map): non-root uid/gid 65532,
# RuntimeDefault seccomp, no privilege escalation, all capabilities dropped,
# read-only root filesystem with an emptyDir on /tmp. podSecurityContext and
# securityContext override single keys. restricted: null follows
# global.podSecurity.restricted (default true); false applies none of them.
podSecurity:
  restricted: null
