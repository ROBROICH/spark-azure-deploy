{{/*
Rendered only when this chart creates its own ServiceAccount — see
"modul-einwendungsmanagement.serviceAccountCreate". Suppressed when global.serviceAccount.name is
set (shared SA managed elsewhere) or global.serviceAccount.create is false.
*/}}
{{- if include "modul-einwendungsmanagement.serviceAccountCreate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "modul-einwendungsmanagement.serviceAccountName" . }}
  namespace: {{ include "modul-einwendungsmanagement.namespace" . }}
  labels:
    {{- include "modul-einwendungsmanagement.labels" . | nindent 4 }}
  {{- with include "modul-einwendungsmanagement.serviceAccountAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ include "modul-einwendungsmanagement.automountToken" . }}
{{- end }}
