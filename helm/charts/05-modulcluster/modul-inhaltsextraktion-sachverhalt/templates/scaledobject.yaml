{{- if (.Values.keda | default dict).enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Values.keda.name | default (include "modul-inhaltsextraktion-sachverhalt.fullname" .) }}
  namespace: {{ include "modul-inhaltsextraktion-sachverhalt.namespace" . }}
  labels:
    {{- include "modul-inhaltsextraktion-sachverhalt.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "modul-inhaltsextraktion-sachverhalt.fullname" . }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  {{- with .Values.keda.advanced }}
  advanced:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if not .Values.keda.triggers }}
  {{- fail (printf "%s: keda.triggers is required when keda.enabled" .Chart.Name) }}
  {{- end }}
  triggers:
    {{- toYaml .Values.keda.triggers | nindent 4 }}
{{- end }}
