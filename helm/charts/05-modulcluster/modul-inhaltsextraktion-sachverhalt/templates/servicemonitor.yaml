{{- if .Values.serviceMonitor.enabled }}
{{- /* Prometheus Operator scrape config — the alternative to podMonitoring (GMP). */ -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "modul-inhaltsextraktion-sachverhalt.fullname" . }}
  namespace: {{ include "modul-inhaltsextraktion-sachverhalt.namespace" . }}
  labels:
    {{- include "modul-inhaltsextraktion-sachverhalt.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "modul-inhaltsextraktion-sachverhalt.selectorLabels" . | nindent 6 }}
  endpoints:
    {{- toYaml .Values.serviceMonitor.endpoints | nindent 4 }}
{{- end }}
