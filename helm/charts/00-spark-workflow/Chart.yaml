apiVersion: v2
name: spark-workflow
description: >
  Top-level umbrella chart for the complete SPARK Workflow application.
  Aggregates all layer umbrellas: base services, frontend, service layer,
  orchestration layer, and AI module layer. Individual layers can be
  enabled or disabled independently via conditions.
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  # 00 – Base services (external infrastructure)
  - name: basisdienste
    version: "0.1.0"
    repository: "file://../01-basisdienste"
    condition: basisdienste.enabled

  # 01 – Frontend
  - name: frontend
    version: "0.1.0"
    repository: "file://../02-frontend"
    alias: frontend-layer
    condition: frontend-layer.enabled

  # 02 – Service Layer
  - name: service-layer
    version: "0.1.0"
    repository: "file://../03-service-layer"
    condition: service-layer.enabled

  # 03 – Orchestration Layer
  - name: orchestration-layer
    version: "0.1.0"
    repository: "file://../04-orchestration-layer"
    condition: orchestration-layer.enabled

  # 04 – AI Module Layer
  - name: ai-module-layer
    version: "0.1.0"
    repository: "file://../05-ai-module-layer"
    condition: ai-module-layer.enabled
