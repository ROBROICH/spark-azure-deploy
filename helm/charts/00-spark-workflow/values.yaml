      - name: BUCKET_NAME
        value: "dms"
      - name: CORS_ORIGINS
        value: "https://dashboard.example.com"
      - name: DB_NAME
        value: "document_management_service"
      - name: OTEL_ENDPOINT
        value: ""
      - name: QUARANTINE_BUCKET_NAME
        value: "quarantine-bucket-test"
      - name: QUARANTINE_S3_ENDPOINT_URL
        value: "https://s3.example.com"
      - name: S3_ENDPOINT_URL
        value: "https://s3.example.com"
      - name: S3_EXTERNAL_URL
        value: "https://s3.example.com"
      - name: S3_REGION
        value: "my-store"
      - name: TEMPORAL__S3_BUCKET_NAME
        value: "temporal-payloads"
      - name: TEMPORAL__S3_ENDPOINT_URL
        value: "https://s3.example.com"
      - name: TEMPORAL__S3_REGION
        value: "my-store"
      - name: TEMPORAL__S3_ACCESS_KEY_ID
        valueFrom: { secretKeyRef: { name: temporal-s3-secrets, key: TEMPORAL_S3_ACCESS_KEY_ID } }
      - name: TEMPORAL__S3_SECRET_ACCESS_KEY
        valueFrom: { secretKeyRef: { name: temporal-s3-secrets, key: TEMPORAL_S3_SECRET_ACCESS_KEY } }

  # ── agent-orchestration-service ───────────────────────────────────────────
  # Coordinates multi-agent AI workflows via Temporal.
  agent-orchestration-service:
    image:
      repository: "<container-registry>/agent-orchestration-module"
      tag: "<image-tag>"
    replicaCount: 2
    extraEnv:
      # Service-to-service URLs below are pre-configured in 03-service-layer/values.yaml
      # as tpl expressions derived from Release.Name and Release.Namespace.
      # Uncomment and set an explicit value only when a non-standard endpoint is required:
      #   - name: API__ADMINISTRATIVE_FILE_DRAFT_BASE_URL
      #     value: "<administrative-file-draft-service-url>"
      #   - name: API__DMS_BASE_URL
      #     value: "<document-management-service-url>"
      #   - name: API__EXAMINATION_SERVICE_BASE_URL
      #     value: "<examination-service-url>"
      #   - name: API__FPP_BASE_URL
      #     value: "<fpp-service-url>"
      #   - name: API__FVP_BASE_URL
      #     value: "<formal-completeness-check-url>"
      #   - name: API__OBJECTIONS_SERVICE_BASE_URL
      #     value: "<objections-management-service-url>"
      #   - name: API__PLAUSIBILITY_NOTES_BASE_URL
      #     value: "<plausibility-notes-url>"
      #   - name: API__PLS_BASE_URL
      #     value: "<project-logic-service-url>"
      # FPP external-service OAuth credentials.
      - name: CORS_ORIGINS
        value: "https://dashboard.example.com"
      - name: OTEL_ENDPOINT
        value: ""
      - name: TEMPORAL__S3_BUCKET_NAME
        value: "temporal-payloads"
      - name: TEMPORAL__S3_ENDPOINT_URL
        value: "https://s3.example.com"
      - name: TEMPORAL__S3_REGION
        value: "my-store"
      - name: TEMPORAL__S3_ACCESS_KEY_ID
        valueFrom: { secretKeyRef: { name: temporal-s3-secrets, key: TEMPORAL_S3_ACCESS_KEY_ID } }
      - name: TEMPORAL__S3_SECRET_ACCESS_KEY
        valueFrom: { secretKeyRef: { name: temporal-s3-secrets, key: TEMPORAL_S3_SECRET_ACCESS_KEY } }


  # ── administrative-file-draft ──────────────────────────────────────────────
  # Manages administrative file drafts and planning document lifecycle.
  administrative-file-draft:
    image:
