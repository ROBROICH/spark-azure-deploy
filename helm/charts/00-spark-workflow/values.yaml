      # Shared docling instance (basisdienste docling-rq is disabled on dev).
      - name: DOCLING_HOST
        value: "https://docling.example.com"
      - name: DOCLING_CLIENT_ID
        valueFrom: { secretKeyRef: { name: docling-keycloak-secrets, key: KEYCLOAK_CLIENT_ID } }
      - name: DOCLING_CLIENT_SECRET
        valueFrom: { secretKeyRef: { name: docling-keycloak-secrets, key: KEYCLOAK_CLIENT_SECRET } }
      - name: DOCLING_TOKEN_URL
        value: "https://keycloak.example.com/realms/master/protocol/openid-connect/token"
      - name: OTEL_ENDPOINT
        value: "otel-gateway.observability.svc.cluster.local:4317"
      - name: TEMPORAL_S3_BUCKET_NAME
        value: "temporal-payloads"
      - name: TEMPORAL_S3_ENDPOINT_URL
        value: "https://s3.example.com"
      - name: TEMPORAL_S3_REGION
        value: "my-store"

# =============================================================================
# Layer 4 — Orchestration (Temporal)
# =============================================================================
#
# Path: orchestration-layer.temporal.temporal.<key>
# The third nesting level ("temporal") is the upstream chart name inside the
# sources/external/temporal wrapper.
#
# Common overrides: web replica count, CORS origin for the Temporal UI,
# dynamic config flags (matching, fairness, migration).

orchestration-layer:
  enabled: true
  temporal:
    temporal:
      web:
        additionalEnv:
          - name: TEMPORAL_CORS_ORIGINS
            value: "https://dashboard.example.com"
        image: { repository: "temporalio/ui", tag: "2.44.0" }
      admintools:
        image: { repository: "temporalio/admin-tools", tag: "1.29.1-tctl-1.18.4-cli-1.5.0" }
      server:
        image: { repository: "temporalio/server", tag: "1.29.1" }
        config:
          persistence:
            # Direct -rw service (NOT the pgbouncer pooler): the temporal
            # schema tools require session-level features.
            default:
              sql:
                host: "<db-host>"
                user: "temporal"
                existingSecret: "temporal-db-credentials"
            visibility:
              sql:
                host: "<db-host>"
                user: "temporal"
                existingSecret: "temporal-db-credentials"
    searchAttributesJob:
      image: { repository: "temporalio/admin-tools", tag: "1.29.1-tctl-1.18.4-cli-1.5.0" }

# =============================================================================
# Layer 5 — AI Module Layer
# =============================================================================
#
# Path: ai-module-layer.<alias>.extraEnv[...]
# Each alias is a separately configured instance of the temporal-worker chart.
# Shared Temporal / S3 config repeats per module because each module has its
# own Temporal task queue and may reference different model endpoints.

ai-module-layer:
  enabled: true

  # ── inhaltsextraktion ─────────────────────────────────────────────────────
  # Document content extraction: full text, tables, and metadata.
  inhaltsextraktion:
    image:
      repository: "<container-registry>/inhaltsextraktion-backend"
      tag: "<image-tag>"
    replicaCount: 1
    extraEnv:
      - name: LITELLM_BASE_URL
        value: "https://litellm.example.com/v1"
      - name: METADATA_MODEL_NAME
        value: "self-hosted/gpt-oss-120b"
      - name: SCHWERPUNKTTHEMA_MODEL_NAME
        value: "self-hosted/gpt-oss-120b"
      - name: STRUCTURE_MODEL_NAME
        value: "self-hosted/gpt-oss-120b"
      - name: SUMMARIZATION_MODEL_NAME
        value: "self-hosted/gpt-oss-120b"
      - name: VLM_SUMMARY_MODEL_NAME
        value: "self-hosted/gpt-oss-120b"
      - name: VLLM_MODEL
        value: "self-hosted/gpt-oss-120b"
      - name: INJECTION_MODEL_URL
        value: "https://prompt-injection.example.com/predict"
      - name: KEYCLOAK_TOKEN_URL
        value: "https://keycloak.example.com/realms/master/protocol/openid-connect/token"
      # Shared docling instance (basisdienste docling-rq is disabled on dev).
      - name: DOCLING_HOST
        value: ""
      - name: DOCLING_PORT
        value: "443"
      - name: DOCLING_PROTOCOL
        value: "https"
      - name: OTEL_ENDPOINT
        value: ""
      - name: TEMPORAL_S3_BUCKET_NAME
        value: "temporal-payloads"
      - name: TEMPORAL_S3_ENDPOINT_URL
