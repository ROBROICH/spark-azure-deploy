      #   - name: PROJECT_LOGIC_SERVICE_URL
      #     value: "<project-logic-service-url>"
      - name: DB_NAME
        value: "administrative_file_draft"

  # ── comment-service ────────────────────────────────────────────────────────
  # Inline comment and annotation management for planning documents.
  comment-service:
    image:
      repository: "<container-registry>/comment-module"
      tag: "<image-tag>"
    replicaCount: 1
    extraEnv:
      - name: DB_NAME
        value: "comment_service"

  # ── examination-service ────────────────────────────────────────────────────
  # Orchestrates formal examination workflows for submitted documents.
  examination-service:
    image:
      repository: "<container-registry>/examination-service"
      tag: "<image-tag>"
    replicaCount: 2
    extraEnv:
