# =============================================================================
# spark-workflow — values.yaml
# =============================================================================
#
# Full configuration reference for a complete SPARK Workflow deployment.
# Replace every <placeholder> with deployment-specific values before installing.
# Secrets should be supplied via Kubernetes Secret objects and referenced
# through secretKeyRef — do NOT inline credentials in this file.
#
# Install:
#   helm dep update charts/00-spark-workflow
#   helm upgrade --install spark charts/00-spark-workflow \
#     --namespace spark --create-namespace \
#     -f values.yaml
#
# Render without installing:
#   helm template spark charts/00-spark-workflow --namespace spark -f values.yaml
#
# Single-layer override:
#   helm upgrade spark charts/00-spark-workflow \
#     --set service-layer.temporal-job-service.replicaCount=3
#
# Env var precedence (last wins per name):
#   global.env → global.extraEnv → <chart>.env → <chart>.extraEnv
#
# Key path structure (top-level umbrella → layer → service):
#   service-layer.<service-name>.extraEnv[...]
#   ai-module-layer.<alias>.extraEnv[...]
#   orchestration-layer.temporal.temporal.<key>
#
# =============================================================================

# ---------------------------------------------------------------------------
# Global — shared configuration propagated to every subchart
# ---------------------------------------------------------------------------

global:

  # Stage suffix appended to generated resource names.
  # E.g. "dev" → spark-frontend-dev.  Leave empty for no suffix.
  stage:
    name: ""

  # Extra pod labels applied to every workload across all layers.
  # Precedence (lowest → highest): global.labels → values.labels
  # spark-workflow.layer/name and spark-workflow.group/name are set by each
  # layer umbrella automatically via global.labels.layer/group.
  labels:
    app.kubernetes.io/part-of: spark-workflow

  # Shared baseline env vars injected into every container (lowest priority).
  # Chart-level env always wins on name collision.
  env: []

  # Shared override vars injected after global.env (second-lowest priority).
  # Use this block for cluster-wide credentials and auth configuration.
  extraEnv:

    # ── Authentication & authorisation (all services) ──────────────────────
    # JWT audience claim validated by each service.
    - name: AUTH_AUDIENCE
      value: "<auth-audience>"

    # Base URL of the Keycloak/OIDC server (e.g. https://keycloak.example.com).
    - name: AUTH_BASE_URL
      value: "<keycloak-base-url>"

    # Authentication enforcement mode: optional_verify | enforce | disabled.
    - name: AUTH_MODE
      value: "<auth-mode>"

    # Keycloak realm used for token validation.
    - name: AUTH_REALM
      value: "<auth-realm>"

    # SpiceDB gRPC endpoint for relationship-based access control.
    - name: AUTH_SPICE_DB_ENDPOINT
      value: "<spicedb-host>:50051"

    # Set to "true" to connect to SpiceDB without TLS (development/staging only).
    - name: AUTH_SPICE_DB_INSECURE
      value: "true"

    # SpiceDB pre-shared key — sourced from the spicedb-config Secret.
    - name: AUTH_SPICE_DB_TOKEN
      valueFrom:
        secretKeyRef:
          name: spicedb-config
          key: preshared_key

    # Temporal-job-service base URL — required by the backend services and by
    # every AI module worker (workflow progress reporting and job dispatch).
    # Chart-agnostic template: derives the stage suffix from global.stage.name.
    - name: TEMPORAL_JOB_SERVICE_URL
      value: '{{ printf "http://%s-temporal-job-service%s.%s.svc.cluster.local" .Release.Name (ternary (printf "-%s" .Values.global.stage.name) "" (not (empty .Values.global.stage.name))) .Release.Namespace }}'

# ── Layer toggles — merged into each configuration block ──────────────────────
# Each layer section below starts with `enabled: true`.
# To disable a layer, set the `enabled` key to false inside that block,
# or pass --set <layer>.enabled=false at install time.
# basisdienste has no configuration below; its toggle stands alone.

basisdienste:
  enabled: true

  qdrant:
    qdrant:
      chartTests:
        dbInteraction:
          image: ""
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 100m
              memory: 200Mi
# =============================================================================
# Layer 2 — Frontend
# =============================================================================
#
# Path: frontend-layer.<key>
# The frontend chart renders a single Nginx-based SPA container.
# VITE_* variables are baked into the container at startup via an entrypoint
# script; they must all be set before the first deployment.

frontend-layer:
  enabled: true

  frontend:
    image:
      repository: "<container-registry>/frontend-app"
      tag: "<image-tag>"

    replicaCount: 1

    extraEnv:
      # Public API prefix used by all fetch() calls in the SPA.
      - name: VITE_API_BASE_URL
        value: "/api"

      # Client-side base path for React Router.
      - name: VITE_APP_BASE_PATH
        value: "/app"

      # Enable EWMS feature flag (Einwendungsmanagement).
      - name: VITE_ENABLE_EWMS_FEATURE
        value: "true"

      # Set to "true" to activate the maintenance mode splash page.
      - name: VITE_ENABLE_MAINTENANCE_MODE
        value: "false"

      # Sentry error-reporting DSN. Set to "" to disable Sentry.
      - name: VITE_SENTRY_DSN
        value: "null"

      # Sentry environment tag shown in the Sentry dashboard.
      - name: VITE_SENTRY_ENVIRONMENT
        value: "<sentry-environment>"

      # Full URL of the Temporal Web UI (used by the admin panel).
      - name: VITE_TEMPORAL_UI_BASE_URL
        value: "https://dashboard.example.com/temporal/namespaces/default/workflows"

# =============================================================================
# Layer 3 — Service Layer
# =============================================================================
#
# Path: service-layer.<service-name>.extraEnv[...]
#
# Use extraEnv at the service level for deployment-specific config (DB creds,
# S3 buckets, CORS, Temporal queues, etc.). Values in global.extraEnv (auth,
# SpiceDB) are already injected — do not repeat them here unless overriding.
#
# Database credentials are expected in per-service Kubernetes Secrets:
#   Secret name: <service-name>-db-credentials
#   Keys:        username, password
# The CNPG pooler hostname follows the pattern:
#   {release}-cnpg-postgres-pooler-rw.{namespace}.svc.cluster.local

service-layer:
  enabled: true

  # ── project-logic-service ──────────────────────────────────────────────────
  # Core project state machine and workflow coordinator.
  project-logic-service:
    image:
      repository: "<container-registry>/pls-module"
      tag: "<image-tag>"
    replicaCount: 2
    extraEnv:
      # Service-to-service URLs below are pre-configured in 03-service-layer/values.yaml
      # as tpl expressions derived from Release.Name and Release.Namespace.
      # Uncomment and set an explicit value only when a non-standard endpoint is required:
      #   - name: API__ADMINISTRATIVE_FILE_DRAFT_BASE_URL
      #     value: "<administrative-file-draft-service-url>"
      #   - name: API__DMS_BASE_URL
      #     value: "<document-management-service-url>"
      #   - name: API__EXAMINATION_BASE_URL
      #     value: "<examination-service-url>"
      #   - name: API__FCS_BASE_URL
      #     value: "<formal-completeness-check-url>"
      #   - name: API__OBJECTIONS_BASE_URL
      #     value: "<objections-management-service-url>"
      #   - name: API__PLAUSIBILITY_BASE_URL
      #     value: "<plausibility-notes-url>"
      #   - name: API__PLS_BASE_URL
      #     value: "<project-logic-service-url>"
      - name: DB_NAME
        value: "project_logic_service"

      - name: OTEL_ENDPOINT
        value: ""
      - name: PROJECT_LOGIC_SERVICE_CORS_ORIGINS
        value: "https://dashboard.example.com"
      - name: TEMPORAL__S3_BUCKET_NAME
        value: "temporal-payloads"
      - name: TEMPORAL__S3_ENDPOINT_URL
        value: "https://s3.example.com"
      - name: TEMPORAL__S3_REGION
        value: "my-store"
      - name: TEMPORAL__S3_ACCESS_KEY_ID
        valueFrom: { secretKeyRef: { name: temporal-s3-secrets, key: TEMPORAL_S3_ACCESS_KEY_ID } }
      - name: TEMPORAL__S3_SECRET_ACCESS_KEY
        valueFrom: { secretKeyRef: { name: temporal-s3-secrets, key: TEMPORAL_S3_SECRET_ACCESS_KEY } }


  # ── temporal-job-service ───────────────────────────────────────────────────
  # REST facade exposing Temporal workflow submission and status APIs.
  temporal-job-service:
    image:
      repository: "<container-registry>/temporal-jobs-module"
      tag: "<image-tag>"
    replicaCount: 2
    extraEnv:
      - name: DB__NAME
        value: "temporal_job_service"
      - name: DB__USER
        valueFrom: { secretKeyRef: { name: temporal-job-service-db-user, key: username } }
      - name: DB__PASSWORD
        valueFrom: { secretKeyRef: { name: temporal-job-service-db-user, key: password } }
      - name: OTEL_ENDPOINT
        value: ""
      - name: TEMPORAL__S3_ARCHIVAL_BUCKET_NAME
        value: "temporal-archival"
      - name: TEMPORAL__S3_BUCKET_NAME
        value: "temporal-payloads"
      - name: TEMPORAL__S3_ENDPOINT_URL
        value: "https://s3.example.com"
      - name: TEMPORAL__S3_REGION
        value: "my-store"


  # ── document-management-service ───────────────────────────────────────────
  # Document storage, virus scanning, and lifecycle management.
  document-management-service:
    image:
      repository: "<container-registry>/dms-module"
      tag: "<image-tag>"
    replicaCount: 2
    extraEnv:
      # Service-to-service URLs below are pre-configured in 03-service-layer/values.yaml
      # as tpl expressions derived from Release.Name and Release.Namespace.
      # Uncomment and set an explicit value only when a non-standard endpoint is required:
      #   - name: PROJECT_LOGIC_SERVICE_URL
