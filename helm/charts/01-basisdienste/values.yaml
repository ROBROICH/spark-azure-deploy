# =============================================================================
# 01-basisdienste — Base Infrastructure Layer
# =============================================================================
# Deploys the shared infrastructure services that the application layers depend
# on. All services in this layer are stateful or long-running infrastructure
# components. They are typically deployed once per namespace and shared across
# all application tiers.
#
# Services:
#   spicedb      — Relationship-based access control (ReBAC) engine. Provides
#                  fine-grained authorisation decisions to backend services via
#                  gRPC. Includes the SpiceDB Operator (namespaced) and the
#                  SpiceDBCluster data-plane.
#   qdrant       — Vector database for semantic search and embedding storage.
#                  Used by AI modules for nearest-neighbour retrieval.
#   unoserver    — LibreOffice-based document conversion (DOCX → PDF, etc.).
#                  Called by the document-management workflow.
#   clamav       — Antivirus scanner daemon. Invoked during document uploads
#                  to detect malicious content before storage.
#   docling-rq   — Document intelligence pipeline backed by a Redis job queue.
#                  Handles OCR, layout analysis, and content extraction for
#                  uploaded documents.
#
# Global values are forwarded to all subcharts unchanged.
# =============================================================================

global:
  stage:
    name: ""
  labels: {}

# Authorization engine (ReBAC). Operator + data-plane cluster.
spicedb:
  enabled: true

# Vector database for semantic search.
qdrant:
  enabled: true

# Document format conversion (LibreOffice headless).
unoserver:
  enabled: true

# Antivirus scanning daemon.
clamav:
  enabled: true

# Document intelligence pipeline (OCR, layout, extraction) with Redis queue.
docling-rq:
  enabled: true
