[project]
name = "anonymisierung"
version = "0.1.0"
description = "PDF redaction pipeline for PII anonymization using local LLMs"

readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # PDF processing
    "pypdfium2>=4.0",
    "pikepdf>=9.0",
    "img2pdf>=0.5",
    # Utilities
    "python-dotenv>=1.2.2",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    # Workflow orchestration
    "temporalio>=1.33.0,<2.0.0",
    "temporal",
    "prompt-injection",
    # LLM client
    "openai>=2.26.0",
    # Deterministic PII detection (NER + structured patterns)
    "presidio-analyzer>=2.2,<3.0",
    "spacy>=3.7,<4.0",
    "de-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl",
    "ocrmypdf>=16.7,<17",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-env>=1.1.5,<2",
    "pytest-timeout>=2.4.0,<3.0.0",
    "coverage>=7.0",
    "pyrefly>=0.15",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.uv.sources]
temporal = { workspace = true }
prompt-injection = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:warnings -v -m 'not slow'"
testpaths = ["tests"]
pythonpath = ["."]
env = [
    "D:TEMPORAL_S3_ACCESS_KEY_ID=test",
    "D:TEMPORAL_S3_SECRET_ACCESS_KEY=test",
]
markers = [
    "slow: marks tests that load heavy ML models (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
omit = ["src/activities/__init__.py", "src/config.py", "src/env.py", "src/prompts/*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyrefly]
search_path = ["."]
project-includes = ["src"]
disable-search-path-heuristics = true
