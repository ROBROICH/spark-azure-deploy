[project]
name = "modul-suche-und-zuordnung"
version = "0.1.0"
description = "TBM Matching and Research with Temporal Workflows"
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
    # Data Validation & Settings
    "pydantic>=2.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    # HTTP Clients
    "httpx>=0.28.1,<0.29",
    # Vector DB
    "qdrant-client>=1.15.1,<2",
    # LLM / NLP
    "tiktoken>=0.11.0",
    # Workflow Orchestration — resolved from packages/temporal/python (workspace).
    # External builds: install from the repo root with `uv sync --package modul-suche-und-zuordnung`
    # or publish temporal to PyPI and replace the [tool.uv.sources] entry below.
    "temporal",
    # Data Processing
    "python-dotenv>=1.2.2",
    "openai>=2.26.0",
    "json-repair>=0.58.0",
    # Prompt defence — resolved from packages/prompt-injection (workspace).
    # Same build requirement as temporal above.
    "prompt-injection",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
    "ruff>=0.14.6,<0.15",
    "pyrefly>=0.49.0",
    "bandit[toml]>=1.9.3",
]

[tool.uv]
package = false

[tool.uv.sources]
temporal = { workspace = true }
prompt-injection = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=84", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
search_path = [".", "../../packages/prompt-injection/src"]
project-includes = ["."]
disable-search-path-heuristics = true
[tool.pyrefly.errors]
# Core strict typing - catch implicit Any and missing annotations
implicit-any = "error"
unannotated-parameter = "error"
unannotated-return = "error"
unannotated-attribute = "error"
# Class strictness
implicit-abstract-class = "error"
implicitly-defined-attribute = "error"
missing-override-decorator = "error"
# TypedDict strictness
not-required-key-access = "error"
open-unpacking = "error"
# Import strictness
untyped-import = "error"
missing-source = "error"
missing-source-for-stubs = "error"
# Keep warnings as errors for maximum strictness
deprecated = "error"
redundant-cast = "error"
unnecessary-comparison = "error"





