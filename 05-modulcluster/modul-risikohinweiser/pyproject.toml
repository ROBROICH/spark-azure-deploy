[project]
name = "modul-risikohinweiser"
version = "0.1.0"
description = "Risk indicator module for analyzing Beschluss sections"
authors = []
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
    "openai>=2.26.0,<3.0.0",
    "python-dotenv>=1.2.2",
    "temporalio>=1.33.0,<2.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "prompt-injection",
    "temporal",
    "types-regex>=2026.4.4.20260408",
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "coverage>=7.11.3,<8.0.0",
    "ruff>=0.14.6,<0.15",
    "pyrefly>=0.49.0",
    "streamlit>=1.40.0,<2.0.0",
    "st-annotated-text>=4.0.2",
    "pre-commit>=4.5.1",
    "scipy>=1.17.1",
]

[tool.uv]
package = false

[tool.uv.sources]
prompt-injection = { workspace = true }
temporal = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"


[tool.pyrefly]
python-interpreter-path = "../../.venv/bin/python"
search_path = ["."]
project-includes = ["src"]
disable-search-path-heuristics = true
[tool.pyrefly.errors]
implicit-any = "error"
unannotated-parameter = "error"
unannotated-return = "error"
unannotated-attribute = "error"
implicit-abstract-class = "error"
implicitly-defined-attribute = "error"
missing-override-decorator = "error"
not-required-key-access = "error"
open-unpacking = "error"
untyped-import = "error"
missing-source = "error"
missing-source-for-stubs = "error"
deprecated = "error"
redundant-cast = "error"
unnecessary-comparison = "error"
