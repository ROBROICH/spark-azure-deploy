[project]
name = "einwendungsmanagement"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "hdbscan>=0.8.41",
    "jinja2>=3.1.6",
    "pydantic>=2.10.6",
    "qdrant-client>=1.16.1,<2.0.0",
    "umap-learn>=0.5.11",
    "temporal[prompt-guard]",
    "openai>=2.26.0,<3.0.0",
    "urllib3>=2.8.0,<3",
    "python-dotenv>=1.2.2",
    "prompt-injection",
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "coverage>=7.11.3,<8.0.0",
    "ipykernel>=6.29.5,<7.0.0",
    "pytest-cov>=6.3.0",
    "ruff>=0.14.6,<0.15",
    "pyrefly>=0.49.0",
]

[tool.uv]
package = false

[tool.uv.sources]
temporal = { workspace = true }
prompt-injection = { workspace = true }

[build-system]
requires = ["setuptools>=84", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
search_path = [".", "src"]
project-includes = ["."]
disable-search-path-heuristics = true
[tool.pyrefly.errors]
# Core strict typing - catch implicit Any and missing annotations
implicit-any = "error"
unannotated-parameter = "error"
unannotated-return = "error"
unannotated-attribute = "error"
# Class strictness
implicit-abstract-class = "error"
implicitly-defined-attribute = "error"
missing-override-decorator = "error"
# TypedDict strictness
not-required-key-access = "error"
open-unpacking = "error"
# Import strictness
untyped-import = "error"
missing-source = "error"
missing-source-for-stubs = "error"
# Keep warnings as errors for maximum strictness
deprecated = "error"
redundant-cast = "error"
unnecessary-comparison = "error"

[tool.pytest.ini_options]
timeout=20
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "-v"
]
