[project]
name = "rechtsmethodik"
version = "0.1.0"
description = ""

requires-python = ">=3.13, <3.14"
readme = "README.md"
dependencies = [
    "pydantic>=2.10.6",
    "python-dotenv>=1.2.2",
    "pyyaml (==6.0.2)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "httpx>=0.28.0,<0.29.0",
    "internal-auth",
    "temporal",
    "rapidfuzz>=3.14.3",
    "bleach>=6.2.0",
    "prompt-injection",
]

[dependency-groups]
dev = [
    "ipython==8.32.0",
    "interrogate>=1.7.0,<2",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.2.1,<7",
    "ipykernel>=6.29.5,<7.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "bandit[toml]>=1.9.3",
    "scikit-learn>=1.8.0",
    "ruff>=0.14.6,<0.15",
    "pyrefly>=0.49.0",
    "types-bleach>=6.3.0.20260408",
]

[tool.uv]
package = false
constraint-dependencies = [
    "urllib3>=2.7.0",
]

[tool.uv.sources]
internal-auth = { workspace = true }
temporal = { workspace = true }
prompt-injection = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.interrogate]
exclude = [
    "src/notebooks/"
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore:coroutine '.*_execute_mock_call' was never awaited:RuntimeWarning",
]


[tool.pyrefly]
search_path = [".", "src", "tests"]
project-includes = ["."]
disable-search-path-heuristics = true

[tool.pyrefly.errors]
# Core strict typing - catch implicit Any and missing annotations
implicit-any = "error"
unannotated-parameter = "error"
unannotated-return = "error"
unannotated-attribute = "error"

# Class strictness
implicit-abstract-class = "error"
implicitly-defined-attribute = "error"
missing-override-decorator = "error"

# TypedDict strictness
not-required-key-access = "error"
open-unpacking = "error"

# Import strictness
untyped-import = "error"
missing-source = "error"
missing-source-for-stubs = "error"

# Keep warnings as errors for maximum strictness
deprecated = "error"
redundant-cast = "error"
unnecessary-comparison = "error"
