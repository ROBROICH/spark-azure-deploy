# Native application runtimes for local development.
# Start shared infrastructure first with:
#   docker compose --env-file .env up --wait
version: "0.5"

environment:
  - ENV=dev
  - AUTH_MODE=disabled
  - PYTHONUNBUFFERED=1
  - BUN_RUNTIME_TRANSPILER_CACHE_PATH=0
  - HOST=127.0.0.1
  - DB_USER=application_runtime
  - DB_PASSWORD=${DB_PASSWORD}
  - DB_HOST=localhost
  - DB_MIGRATE_HOST=localhost
  - DB_MIGRATE_USER=application_migrator
  - DB_MIGRATE_PASSWORD=${DB_PASSWORD}
  - DB_PORT=5433
  - DB_NAME=application
  - PROJECT_LOGIC_SERVICE_CORS_ORIGINS=
  - LAW_DATABASE_BASE_URL=http://localhost:18020
  - TEMPORAL_HOST=localhost:7233
  - TEMPORAL_NAMESPACE=default
  - TEMPORAL_ENABLE_APPROVAL=false
  - TEMPORAL_MAX_CONCURRENT_ACTIVITIES=2
  - TEMPORAL_JOB_SERVICE_URL=http://localhost:18015/api
  - TEMPORAL_S3_BUCKET_NAME=temporal-payloads
  - TEMPORAL_S3_ARCHIVAL_BUCKET_NAME=temporal-payloads
  - TEMPORAL_S3_ENDPOINT_URL=http://localhost:9000
  - TEMPORAL_S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
  - TEMPORAL_S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
  - TEMPORAL_S3_REGION=eu-west-1
  - ARCHIVAL_ENABLED=false
  - ARCHIVAL_WORKFLOW_ID=WeeklyHistoryArchivalWorkflow
  - ARCHIVAL_CRON=0 0 * * 0
  - ARCHIVAL_BATCH_SIZE=100
  - ARCHIVAL_S3_PREFIX=temporal-history
  - DEFAULT_WORKFLOW_COMPLEXITY_WEIGHT=3
  - MAX_SYSTEM_COMPLEXITY=20000
  - WORKFLOW_COMPLEXITY={}
  - BUCKET_NAME=dms-local
  - S3_ENDPOINT_URL=http://localhost:9000
  - S3_EXTERNAL_URL=http://localhost:9000
  - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
  - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
  - S3_REGION=eu-west-1
  - DOC_STORE_PATH=dms_data
  - CLAMAV_ENABLED=false
  - CLAMAV_BASE_URL=http://localhost:3310
  - CHECKPOINT_RETENTION_PERIOD_DAYS=60
  - MAX_ZIP_ENTRIES=5000
  - MAX_SINGLE_ENTRY_SIZE_MB=1024
  - MAX_ZIP_EXTRACTION_SIZE_GB=10
  - MAX_COMPRESSION_RATIO=100
  - MAX_ZIP_APPENDED_DATA_BYTES=65536
  - MAX_OBJECT_SIZE_MB=1024
  - QUARANTINE_S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
  - QUARANTINE_S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
  - UNO_HOST=localhost
  - UNO_PORT=2003
  - UNO_PROTOCOL=http
  - UNO_TIMEOUT_MS=120000
  - UNO_PREFLIGHT_TIMEOUT_MS=10000
  - DEFAULT_PROJECT_TYPE_ID=00000000-0000-0000-0000-000000000000
  - SYSTEM_USER_ID=${LOCAL_USER_ID}
  - FPP_ALLOWED_DOMAINS=fpp.url
  - FPP_BLOCK_PRIVATE_IPS=true
  - AUTH_BASE_URL=http://localhost:9090
  - AUTH_REALM=local
  - AUTH_CLIENT_ID=local-client
  - AUTH_CLIENT_SECRET=${LOCAL_OIDC_CLIENT_SECRET:-${LOCAL_KEYCLOAK_CLIENT_SECRET:-}}
  - AUTH_PRIVILEGED_REALM=local
  - AUTH_PRIVILEGED_CLIENT_ID=local-client
  - AUTH_PRIVILEGED_CLIENT_SECRET=${LOCAL_OIDC_CLIENT_SECRET:-${LOCAL_KEYCLOAK_CLIENT_SECRET:-}}
  - AUTH_SPICE_DB_ENDPOINT=localhost:50051
  - AUTH_SPICE_DB_TOKEN=${AUTH_SPICE_DB_TOKEN}
  - AUTH_SPICE_DB_INSECURE=true
  - AUTH_SPICE_DB_BULK_CHUNK_SIZE=1000
  - EXTERNAL_SERVICE_TIMEOUT_MS=10000

processes:
  docling:
    command: $${DOCLING_COMMAND:-docker run --rm --name spark-docling-serve -p 127.0.0.1:5001:5001 quay.io/docling-project/docling-serve-cpu:v1.14.3}
    readiness_probe:
      http_get:
        host: localhost
        port: 5001
        path: /health
      initial_delay_seconds: 1
      period_seconds: 20
      timeout_seconds: 5
      failure_threshold: 6
    shutdown:
      timeout_seconds: 5
    availability:
      restart: on_failure
      backoff_seconds: 3

  project-logic:
    command: corepack pnpm --filter @spark-workflow/spark-backend start
    environment:
      - PORT=18000
      - ACTIVE_FEATURE_WORKER=project-logic
    readiness_probe:
      http_get:
        host: localhost
        port: 18000
        path: /ready
      initial_delay_seconds: 2
      period_seconds: 20
      timeout_seconds: 5
      failure_threshold: 6
    shutdown:
      timeout_seconds: 20
    availability:
      restart: always
      backoff_seconds: 21

