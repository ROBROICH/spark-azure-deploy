      - DMS_BASE_URL=http://localhost:18001/api/dms/v1
      - QDRANT_CLUSTER_ENDPOINT=http://localhost:6333
      - LITELLM_MODEL=${LITELLM_TEXT_MODEL}
      - LITELLM_EMBEDDING_MODEL=${LITELLM_EMBEDDING_MODEL}
    availability:
      restart: on_failure
      backoff_seconds: 3

  worker-anonymisierung:
    command: uv run --locked --all-packages python main.py
    working_dir: ./05-modulcluster/modul-anonymisierung
    environment:
      - LLM_MODEL=${LITELLM_TEXT_MODEL}
    availability:
      restart: on_failure
      backoff_seconds: 3

  frontend:
    # Served behind oauth2-proxy (docker-compose) which owns http://localhost:3000
    # and enforces the Keycloak login before proxying to this dev server.
    command: pnpm dev --host 0.0.0.0 --port 3002
    working_dir: ./01-frontend/frontend
    environment:
      - VITE_DEV_API_MODE=port-forwarding
      - VITE_API_BASE_URL=http://localhost:3000
      - VITE_APP_BASE_PATH=/app
      - VITE_TEMPORAL_UI_BASE_URL=http://localhost:8233/namespaces/default/workflows
      - VITE_ALLOWED_DOWNLOAD_ORIGINS=http://localhost:9000
      - VITE_ALLOWED_UPLOAD_ORIGINS=http://localhost:9000
      - VITE_API_URL=http://localhost:18000
      - API_DMS_ORIGIN=http://localhost:18001
      - API_FCS_ORIGIN=http://localhost:18002
      - API_AOM_ORIGIN=http://localhost:18003
      - API_PNS_ORIGIN=http://localhost:18005
      - API_OMS_ORIGIN=http://localhost:18006
      - API_FPP_ORIGIN=http://localhost:18007
      - API_COMMENTS_ORIGIN=http://localhost:18008
      - API_EXAMINATION_ORIGIN=http://localhost:18009
      - API_VAE_ORIGIN=http://localhost:18010
      - API_FEEDBACK_ORIGIN=http://localhost:18011
      - API_SUPPLEMENTARY_REQUESTS_ORIGIN=http://localhost:18012
      - API_IDENTITY_MANAGEMENT_ORIGIN=http://localhost:18013
      - API_TEMPORAL_JOBS_ORIGIN=http://localhost:18015
      - API_PROTOCOL_ORIGIN=http://localhost:18016
      - VITE_LAW_CHANGES_OPENAPI_URL=http://localhost:18024/openapi.json
      - VITE_LOCAL_USER_ID=${LOCAL_USER_ID}
      - VITE_LOCAL_USER_EMAIL=${LOCAL_USER_EMAIL}
      - VITE_LOCAL_USER_FIRST_NAME=${LOCAL_USER_FIRST_NAME}
      - VITE_LOCAL_USER_LAST_NAME=${LOCAL_USER_LAST_NAME}
      - ALLOW_DEV_MODE=true
      - VITE_ENABLE_EWMS_FEATURE=true
      - VITE_ENABLE_AUTH_REDIRECT_RETRY=true
      - VITE_SYSTEM_LOAD_DISABLE_THRESHOLD_PERCENTAGE=500

    readiness_probe:
      http_get:
        host: localhost
        port: 3002
        path: /app/
      initial_delay_seconds: 2
      period_seconds: 20
      timeout_seconds: 5
      failure_threshold: 6
    depends_on:
      project-logic:
        condition: process_healthy
      document-management:
        condition: process_healthy
      formal-completeness:
        condition: process_healthy
      agent-orchestration:
        condition: process_healthy
      plausibility-notes:
        condition: process_healthy
      objections-management:
        condition: process_healthy
      fpp:
        condition: process_healthy
      comment:
        condition: process_healthy
      examination:
        condition: process_healthy
      administrative-file-draft:
        condition: process_healthy
      feedback:
        condition: process_healthy
      supplementary-requests:
        condition: process_healthy
      identity-management:
        condition: process_healthy
      temporal-job:
        condition: process_healthy
      protocol:
        condition: process_healthy
    shutdown:
      timeout_seconds: 20
    availability:
      restart: always
      backoff_seconds: 21
