files: ^02-backend/formal_completeness_check
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast                 # Checks Python files for syntax errors by parsing the AST
      - id: check-added-large-files   # Prevents accidentally committing very large files
      - id: check-merge-conflict      # Detects unresolved merge conflict markers in files
      - id: check-case-conflict       # Checks for filename conflicts that differ only in case
      - id: check-json                # Validates that JSON files are properly formatted
      - id: check-yaml                # Validates that YAML files are properly formatted
      - id: debug-statements          # Warns if there are debug statements like print() or pdb
      - id: end-of-file-fixer         # Ensures files end with a newline character
      - id: trailing-whitespace       # Removes trailing whitespace from lines
      - id: mixed-line-ending         # Normalizes line endings across files (LF vs CRLF)

  - repo: local
    hooks:
      # Check the lock file is up to date with requirements.
      - id: uv-lock-check
        name: uv-lock-check
        entry: uv lock --check
        language: system
        always_run: true
        pass_filenames: false

      # Runs the ruff linter
      - id: ruff
        name: ruff
        entry: bash -c 'uv run ruff check 02-backend/formal_completeness_check/src --fix'
        language: system
        types: [python]
        always_run: true
        pass_filenames: false

      # Runs the ruff formatter
      - id: ruff-format
        name: ruff-format
        entry: bash -c 'uv run ruff format 02-backend/formal_completeness_check/src'
        language: system
        types: [python]
        always_run: true
        pass_filenames: false

      # Runs pyrefly
      - id: pyrefly
        name: pyrefly
        entry: bash -c 'cd 02-backend/formal_completeness_check && uv run pyrefly check src'
        language: system
        types: [python]
        always_run: true
        pass_filenames: false

      # Runs the CI prechecks locally
      - id: ci-precheck
        name: ci-precheck
        entry: bash -c 'cd 02-backend/formal_completeness_check && uv run bash ../../03-infrastructure-resources/tooling/ci-precheck/ci-precheck.sh'
        language: system
        types: [python]
        always_run: true
        pass_filenames: false
