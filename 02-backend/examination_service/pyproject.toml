[project]
name = "examination-service"
version = "0.1.0"
description = "Graph-based data model API for the Examination step (Pruefungsservice)"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
  "prometheus-fastapi-instrumentator",
  "typing-extensions>=4.5.0",
  "fastapi>=0.120.1",
  "starlette>=1.3.1",
  "uvicorn>=0.41.0",
  "pydantic-settings (>=2.10.1,<3.0.0)",
  "sqlalchemy (>=2.0.41,<3.0.0)",
  "alembic (>=1.16.4,<2.0.0)",
  "psycopg2-binary (>=2.9.10,<3.0.0)",
  "asyncpg (>=0.30.0,<0.31.0)",
  "greenlet (>=3.1.0,<4.0.0)",
  "httpx (>=0.28.1,<0.29.0)",
  "h11>=0.16.0",
  "alembic-utils",
  "event-logging",
  "node-crud",
  "audit-client",
  "authentification",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1.0,<2",
  "httpx>=0.28.1,<0.29",
  "pytest-cov>=6.2.1,<7",
  "interrogate>=1.7.0,<2",
  "pytest-env>=1.1.5,<2",
  "pytest-httpx>=0.36.2,<0.37",
  "pre-commit>=4.3.0,<5",
  "aiosqlite>=0.20.0,<0.21",
  "mypy>=1.19.1,<2",
  "ruff>=0.14.6,<0.15",
  "pyrefly>=0.49.0",
  "ipykernel>=6.30.1,<7",
  "syrupy>=4.9.1",
  "py-pglite[sqlalchemy,psycopg]",
  "poethepoet>=0.37.0",
]

[tool.uv]
package = false

[tool.uv.sources]
alembic-utils = { workspace = true }
audit-client = { workspace = true }
event-logging = { workspace = true }
node-crud = { workspace = true }
authentification = { workspace = true }

[tool.pytest.ini_options]
markers = ["integration: mark a test as an integration test (uses real external services)"]
addopts = "-m 'not integration' --cov=src --cov-report=term-missing -p no:pytest_postgresql"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
env = [
  # Force pure-Python psycopg so PGlite integration tests don't segfault
  # when psycopg-binary is installed via uv sync --all-packages.
  "PSYCOPG_IMPL=python",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.coverage.run]
source = ["src"]
omit = ["src/db/migrations/**"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-module = true
ignore-nested-functions = true

[tool.pyrefly]
search_path = [".", "src"]
project-includes = ["."]
disable-search-path-heuristics = true

[tool.pyrefly.errors]
implicit-any = "error"
unannotated-parameter = "error"
unannotated-return = "error"
unannotated-attribute = "error"
implicit-abstract-class = "error"
implicitly-defined-attribute = "error"
missing-override-decorator = "error"
not-required-key-access = "error"
open-unpacking = "error"
untyped-import = "error"
missing-source = "error"
missing-source-for-stubs = "error"
deprecated = "error"
redundant-cast = "error"
unnecessary-comparison = "error"

[tool.poe.tasks]
dev = "uvicorn src.main:app --host 0.0.0.0 --port 8008 --reload"

[tool.swagger]
name = "Examination Service"
