server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # HSTS belongs at the TLS-terminating gateway. This container only serves
    # plain HTTP behind that gateway.
    # Keep the policy explicit so new browser capabilities fail closed. The
    # current index.html injects window.__APP_CONFIG__ inline at container
    # startup, so script-src still needs 'unsafe-inline'. React component style
    # attributes currently require style-src 'unsafe-inline'.
    set $security_csp "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https:; media-src 'self' blob:; frame-src 'self' https: blob:; worker-src 'self' blob:; form-action 'self'";

    add_header Content-Security-Policy $security_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Serve static files directly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        add_header Content-Security-Policy $security_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
