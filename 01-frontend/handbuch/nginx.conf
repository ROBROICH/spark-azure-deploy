server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # TLS is terminated by the deployment gateway.
    set $security_csp "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; frame-src 'self'; worker-src 'self' blob:; form-action 'self'";

    add_header Content-Security-Policy $security_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webm)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        add_header Content-Security-Policy $security_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
